<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Kein Zoomen: Die Körperansicht hat eine feste Größe -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>mamu – Fitness &amp; Ernährung</title>

<style>
/* =====================================================================
   mamu – Benutzeroberfläche
   Aufbau dieser Datei:
   1. CSS (Aussehen)      2. HTML (Struktur)      3. JavaScript (Verhalten)
   ===================================================================== */

/* ---------- 1. Farben und Grundwerte (zentral an einer Stelle) ---------- */
:root {
  --salbei: #9bb8a5;          /* Hauptakzent: Salbeigrün */
  --salbei-dunkel: #4f7a63;   /* kräftigere Variante für Knöpfe und Text */
  --salbei-mittel: #d5e4da;
  --salbei-hell: #eef4f0;
  --text: #25302a;
  --leise: #68766e;           /* zurückhaltender Text */
  --linie: #e2e9e4;
  --koerper: #eceeec;         /* Farbe der Körper-Silhouette */
  --radius: 18px;
  --nav-h: 68px;              /* Höhe der unteren Navigationsleiste */

  /* Statusfarben der Muskelgruppen (dezent) */
  --rot: #ec8f88;
  --orange: #f4b872;
  --gelb: #f0dc78;
  --gruen: #8ccf99;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #ffffff;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}

/* Platz für die untere Navigationsleiste */
body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); }

h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }

/* ---------- 2. Seiten ---------- */
.seite { display: none; max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; }
.seite.aktiv { display: block; }
/* Auf großen Bildschirmen bleiben die Karten gut lesbar (nur die Körperseite nutzt die volle Breite) */
#seite-training, #seite-statistik, #seite-ernaehrung, #seite-mehr { max-width: 720px; }

.seitenkopf {
  display: flex; align-items: baseline; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 18px) 0 14px;
}
.marke { font-weight: 800; letter-spacing: .5px; color: var(--salbei-dunkel); font-size: 20px; }
.seitenkopf h1 { font-size: 22px; font-weight: 700; }
.untertitel { color: var(--leise); font-size: 14px; margin-bottom: 14px; }

/* ---------- 3. Bausteine: Karten, Knöpfe, Eingabefelder ---------- */
.karte {
  background: #fff; border: 1px solid var(--linie); border-radius: var(--radius);
  padding: 16px; box-shadow: 0 1px 3px rgba(40, 60, 50, .05);
}
.karte + .karte { margin-top: 14px; }
.karte h2 { font-size: 17px; margin-bottom: 10px; }
.karte h3 { font-size: 15px; margin-bottom: 8px; }

.knopf {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--salbei); background: #fff; color: var(--salbei-dunkel);
  border-radius: 14px; padding: 11px 18px; font-weight: 600; cursor: pointer;
}
.knopf:hover { background: var(--salbei-hell); }
.knopf.primaer { background: var(--salbei-dunkel); border-color: var(--salbei-dunkel); color: #fff; }
.knopf.primaer:hover { background: #416a54; }
.knopf.breit { width: 100%; }
.knopf.klein { padding: 7px 12px; font-size: 13px; border-radius: 11px; }
.knopf.gefahr { border-color: #e3a29d; color: #b34a42; }
.knopf:disabled { opacity: .45; cursor: not-allowed; }
.knopf:focus-visible, .nav button:focus-visible { outline: 3px solid var(--salbei-mittel); outline-offset: 2px; }

.feld { display: block; margin-bottom: 12px; }
.feld > span { display: block; font-size: 13px; color: var(--leise); margin-bottom: 4px; }
.feld input, .feld select {
  width: 100%; padding: 11px 13px; border: 1px solid var(--linie); border-radius: 13px;
  background: #fff; min-height: 44px;
}
.feld input:focus, .feld select:focus { outline: 2px solid var(--salbei); border-color: var(--salbei); }
.feld-reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }

.segment { display: inline-flex; background: var(--salbei-hell); border-radius: 14px; padding: 3px; }
.segment button {
  border: 0; background: none; padding: 8px 18px; border-radius: 11px; cursor: pointer;
  color: var(--leise); font-weight: 600;
}
.segment button.aktiv { background: #fff; color: var(--salbei-dunkel); box-shadow: 0 1px 3px rgba(40, 60, 50, .15); }

.hinweis { background: var(--salbei-hell); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--text); }
.hinweis.warnung { background: #fdf4e3; }
.hinweis.fehler { background: #fcebe9; color: #8e362f; }
.klein-text { font-size: 13px; color: var(--leise); }
.platzhalter { color: var(--leise); text-align: center; padding: 18px 8px; }

.raster { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kennzahl { background: var(--salbei-hell); border-radius: 16px; padding: 14px; }
.kennzahl b { display: block; font-size: 26px; line-height: 1.1; color: var(--salbei-dunkel); }
.kennzahl span { font-size: 13px; color: var(--leise); }

/* ---------- 4. Statusfarben ---------- */
.s-inactive { --farbe: #ffffff; }
.s-starter  { --farbe: var(--rot); }
.s-rising   { --farbe: var(--orange); }
.s-advanced { --farbe: var(--gelb); }
.s-elite    { --farbe: var(--gruen); }

.status-pille {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px;
  border-radius: 20px; background: var(--salbei-hell); font-size: 14px; font-weight: 600;
}
.status-pille i, .legende i {
  width: 12px; height: 12px; border-radius: 50%; background: var(--farbe);
  border: 1px solid rgba(0, 0, 0, .18); display: inline-block;
}

/* ---------- 5. Körperansicht ---------- */
.koerper-layout { display: block; }
.schalter-zeile { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 8px; }

.wischbereich { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.figuren { display: flex; justify-content: center; gap: 28px; }
.figur { display: none; text-align: center; }
.figur.aktiv { display: block; }
.figur-titel { font-size: 13px; color: var(--leise); margin-bottom: 2px; }
.figur svg { display: block; margin: 0 auto; width: 220px; height: 462px; touch-action: pan-y; }

.punkte { display: flex; justify-content: center; gap: 8px; margin: 6px 0 2px; }
.punkte i { width: 8px; height: 8px; border-radius: 50%; background: var(--salbei-mittel); }
.punkte i.aktiv { background: var(--salbei-dunkel); }
.wisch-hinweis { text-align: center; font-size: 12px; color: var(--leise); }

.koerper-form ellipse, .koerper-form path, .koerper-form rect { fill: var(--koerper); }
.koerper-form line { stroke: var(--koerper); }

/* Muskelgruppen: nur die Statusfarbe ist sichtbar */
.muskel { cursor: pointer; outline: none; }
.muskel .form { fill: var(--farbe); stroke: rgba(255, 255, 255, .9); stroke-width: 1.4; stroke-linejoin: round; }
.muskel.s-inactive .form { stroke: #c3ccc6; }
.muskel:hover .form { stroke: var(--salbei-dunkel); stroke-width: 2; }
.muskel:focus-visible .form { stroke: var(--salbei-dunkel); stroke-width: 2.5; }
/* Angeklickte Muskelgruppe: deutlicher Farbrand */
.muskel.ausgewaehlt .form { stroke: #2e5a45; stroke-width: 3; }

.score-label rect { fill: #fff; stroke: #2e5a45; stroke-width: 1.4; }
.score-label text { font-size: 10.5px; font-weight: 700; fill: #2e5a45; }

.legende {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px;
  margin: 14px auto 0; max-width: 560px; font-size: 13px; color: var(--leise);
}
.legende span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- 6. Muskelprofil ---------- */
/* Smartphone: eigene Vollbildansicht (über dem Inhalt, unter der Navigation) */
.profil-bereich { display: none; }
.profil-bereich.offen {
  display: block; position: fixed; left: 0; right: 0; top: 0;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  background: #fff; overflow-y: auto; z-index: 30; padding: 0 16px 28px;
}
.profil-kopf {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 14px) 0 12px;
  position: sticky; top: 0; background: #fff; z-index: 2;
}
.profil-kopf h2 { font-size: 24px; }
.zurueck {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--linie);
  background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.zurueck:hover { background: var(--salbei-hell); }

.score-kopf { display: flex; align-items: center; gap: 18px; margin: 4px 0 16px; }
.ring { width: 110px; height: 110px; flex: none; }
.ring text { text-anchor: middle; fill: var(--text); }

.zeile { padding: 10px 0; border-top: 1px solid var(--linie); }
.zeile:first-child { border-top: 0; }
.zeile-kopf { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.zeile-kopf b { font-weight: 600; }
.balken { height: 8px; background: var(--salbei-hell); border-radius: 6px; margin-top: 7px; overflow: hidden; }
.balken i { display: block; height: 100%; background: var(--salbei); border-radius: 6px; }

.diagramm svg { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; }
.diagramm .achse { stroke: var(--linie); stroke-width: 1; }
.diagramm .linie { fill: none; stroke: var(--salbei-dunkel); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.diagramm .punkt { fill: #fff; stroke: var(--salbei-dunkel); stroke-width: 2; }
.diagramm .punkt.letzter { fill: var(--salbei-dunkel); }
.diagramm text { font-size: 11px; fill: var(--leise); }
.diagramm .wert { fill: var(--text); font-weight: 600; }

.uebungs-karten { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.uebung-karte { border: 1px solid var(--linie); border-radius: 16px; overflow: hidden; background: #fff; }
.uebung-bild {
  height: 92px; background: var(--salbei-hell); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; color: var(--salbei-dunkel); font-size: 11px;
}
.uebung-inhalt { padding: 12px; }
.uebung-inhalt b { display: block; margin-bottom: 4px; }
.etikett {
  display: inline-block; font-size: 12px; background: var(--salbei-hell); color: var(--salbei-dunkel);
  border-radius: 10px; padding: 2px 9px; margin-bottom: 6px;
}

@media (min-width: 700px) {
  .figur { display: block; }
  .figur svg { width: 250px; height: 525px; }
  .seiten-schalter, .punkte, .wisch-hinweis { display: none; }
}

/* Große Bildschirme: Muskelprofil als eigener Inhaltsbereich neben dem Körper */
@media (min-width: 1000px) {
  .koerper-layout { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 28px; align-items: start; }
  .profil-bereich, .profil-bereich.offen {
    display: block; position: static; z-index: auto; overflow: visible;
    padding: 4px 20px 20px; border: 1px solid var(--linie); border-radius: var(--radius); background: #fff;
  }
  .profil-kopf { position: static; padding-top: 14px; }
}

/* ---------- 7. Training ---------- */
.liste-eintrag { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--linie); }
.liste-eintrag:first-child { border-top: 0; }
.liste-eintrag b { display: block; }
.liste-eintrag .klein-text { margin-top: 2px; }

.schritte { display: flex; gap: 6px; margin: 4px 0 16px; }
.schritte i { flex: 1; height: 6px; border-radius: 4px; background: var(--salbei-hell); }
.schritte i.fertig { background: var(--salbei); }
.schritte i.aktiv { background: var(--salbei-dunkel); }

.gruppen-raster { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.gruppen-knopf {
  display: flex; align-items: center; gap: 9px; padding: 13px 12px; border-radius: 14px;
  border: 1px solid var(--linie); background: #fff; cursor: pointer; font-weight: 600; text-align: left;
}
.gruppen-knopf i { width: 14px; height: 14px; border-radius: 50%; background: var(--farbe); border: 1px solid rgba(0,0,0,.18); flex: none; }
.gruppen-knopf.gewaehlt { border-color: var(--salbei-dunkel); background: var(--salbei-hell); box-shadow: 0 0 0 2px var(--salbei-mittel); }

.wahl-eintrag {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 11px 13px; border: 1px solid var(--linie); border-radius: 14px; margin-bottom: 8px;
}
.wahl-eintrag.gewaehlt { border-color: var(--salbei-dunkel); background: var(--salbei-hell); }
.wahl-eintrag .klein-text { margin-top: 1px; }
.knopf-zeile { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.knopf-zeile .knopf { flex: 1; }
.fehlerliste { margin: 10px 0 0; padding-left: 18px; }

/* ---------- 8. Statistik ---------- */
.score-zeile { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
.score-balken { height: 12px; background: var(--salbei-hell); border-radius: 8px; overflow: hidden; }
.score-balken i { display: block; height: 100%; background: var(--farbe); border-right: 1px solid rgba(0,0,0,.12); }
.score-wert { text-align: right; font-variant-numeric: tabular-nums; }
.plus { color: #3d7d52; } .minus { color: #b34a42; }

/* ---------- 9. Ernährung ---------- */
.ergebnis-raster { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 14px; }
.ergebnis { background: var(--salbei-hell); border-radius: 18px; padding: 16px; text-align: center; }
.ergebnis b { display: block; font-size: 30px; color: var(--salbei-dunkel); line-height: 1.1; }
.ergebnis span { font-size: 13px; color: var(--leise); }

/* ---------- 10. Mehr ---------- */
.avatar {
  width: 64px; height: 64px; border-radius: 50%; background: var(--salbei-mittel); color: var(--salbei-dunkel);
  display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex: none;
}
.profil-zeile { display: flex; gap: 14px; align-items: center; }

/* ---------- 11. Untere Navigationsleiste (immer sichtbar) ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255, 255, 255, .97); border-top: 1px solid var(--linie);
  display: flex; justify-content: center;
}
.nav-innen { display: flex; width: 100%; max-width: 640px; }
.nav button {
  flex: 1; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--leise);
}
.nav-icon { width: 50px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
.nav button.aktiv { color: var(--salbei-dunkel); font-weight: 700; }
.nav button.aktiv .nav-icon { background: var(--salbei-mittel); }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Kurze Rückmeldung (Toast) */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  background: var(--salbei-dunkel); color: #fff; padding: 11px 18px; border-radius: 14px;
  font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .25s;
  max-width: 90vw; text-align: center;
}
.toast.sichtbar { opacity: 1; }
</style>
</head>
<body>
<noscript>Bitte JavaScript aktivieren, damit mamu funktioniert.</noscript>

<!-- =====================================================================
     SEITE 1: KÖRPER (Startseite)
     ===================================================================== -->
<main id="seite-koerper" class="seite aktiv">
  <div class="seitenkopf"><span class="marke">mamu</span><h1>Körper</h1></div>

  <div class="koerper-layout">
    <section aria-label="Körperansicht">
      <div class="schalter-zeile">
        <!-- Umschalter Mann / Frau -->
        <div class="segment" id="schalter-geschlecht" role="group" aria-label="Körperansicht wählen">
          <button type="button" data-aktion="geschlecht" data-wert="mann" class="aktiv">Mann</button>
          <button type="button" data-aktion="geschlecht" data-wert="frau">Frau</button>
        </div>
        <!-- Umschalter Vorderseite / Rückseite (nur auf dem Smartphone sichtbar) -->
        <div class="segment seiten-schalter" id="schalter-seite" role="group" aria-label="Körperseite wählen">
          <button type="button" data-aktion="ansicht" data-wert="vorne" class="aktiv">Vorderseite</button>
          <button type="button" data-aktion="ansicht" data-wert="hinten">Rückseite</button>
        </div>
      </div>

      <!-- Hier zeichnet JavaScript die Körperfiguren -->
      <div class="wischbereich" id="wischbereich">
        <div class="figuren" id="figuren"></div>
      </div>
      <div class="punkte" id="punkte" aria-hidden="true"><i class="aktiv"></i><i></i></div>
      <p class="wisch-hinweis">Zum Wechseln der Körperseite nach links oder rechts wischen</p>

      <!-- Farblegende -->
      <div class="legende" aria-label="Legende der Statusfarben">
        <span class="s-inactive"><i></i>Noch keine Daten</span>
        <span class="s-starter"><i></i>Starter (1–20)</span>
        <span class="s-rising"><i></i>Rising (21–40)</span>
        <span class="s-advanced"><i></i>Advanced (41–70)</span>
        <span class="s-elite"><i></i>Elite (71–100)</span>
      </div>
    </section>

    <!-- Muskelprofil: Vollbild auf dem Smartphone, Inhaltsbereich auf großen Bildschirmen -->
    <aside id="profil-bereich" class="profil-bereich" aria-live="polite"></aside>
  </div>
</main>

<!-- SEITE 2: TRAINING -->
<main id="seite-training" class="seite">
  <div class="seitenkopf"><span class="marke">mamu</span><h1>Training</h1></div>
  <div id="training-inhalt"></div>
</main>

<!-- SEITE 3: STATISTIKEN -->
<main id="seite-statistik" class="seite">
  <div class="seitenkopf"><span class="marke">mamu</span><h1>Statistiken</h1></div>
  <div id="statistik-inhalt"></div>
</main>

<!-- SEITE 4: ERNÄHRUNG -->
<main id="seite-ernaehrung" class="seite">
  <div class="seitenkopf"><span class="marke">mamu</span><h1>Ernährung</h1></div>
  <div id="ernaehrung-inhalt"></div>
</main>

<!-- SEITE 5: MEHR -->
<main id="seite-mehr" class="seite">
  <div class="seitenkopf"><span class="marke">mamu</span><h1>Mehr</h1></div>
  <div id="mehr-inhalt"></div>
</main>

<!-- =====================================================================
     UNTERE NAVIGATIONSLEISTE (immer sichtbar)
     ===================================================================== -->
<nav class="nav" aria-label="Hauptnavigation">
  <div class="nav-innen">
    <button type="button" data-aktion="seite" data-wert="koerper" class="aktiv" aria-current="page">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5"/><path d="M12 8v7M7.5 10.5 12 9l4.5 1.5M9 21l3-6 3 6"/></svg></span>Körper
    </button>
    <button type="button" data-aktion="seite" data-wert="training">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Training
    </button>
    <button type="button" data-aktion="seite" data-wert="statistik">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg></span>Statistiken
    </button>
    <button type="button" data-aktion="seite" data-wert="ernaehrung">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 8c-2-2-6-1-6 4 0 4 2 8 4 8 1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 4-4 4-8 0-5-4-6-6-4zM12 8c0-2 1-3 3-3"/></svg></span>Ernährung
    </button>
    <button type="button" data-aktion="seite" data-wert="mehr">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></span>Mehr
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>

/* ======================================================================
   ABSCHNITT A: Bestehende Algorithmen von mamu (UNVERÄNDERT)
   Die folgenden drei Blöcke sind wortgleiche Kopien aus den Dateien
   ernaehrung.js, uebungsempfehlung.js und berechnung.js.
   Im Browser gibt es kein require(), deshalb stehen sie hier direkt.
   Sobald mamu über einen Node.js-Server läuft, können diese Blöcke durch
   Anfragen an den Server ersetzt werden.
   ====================================================================== */

// ---------- A1: Ernährung (aus ernaehrung.js) ----------
function berechneErnaehrung(gewicht, anzahlUebungen, ziel) {
    // Eingaben prüfen
    if (typeof gewicht !== "number" || isNaN(gewicht) || gewicht <= 0) {
        return { ok: false, fehler: "Bitte ein gültiges Gewicht größer als 0 eingeben." };
    }
    if (!Number.isInteger(anzahlUebungen) || anzahlUebungen < 0 || anzahlUebungen > 8) {
        return { ok: false, fehler: "Die Anzahl der Übungen muss eine ganze Zahl zwischen 0 und 8 sein." };
    }

    // Ziel vereinheitlichen (Groß-/Kleinschreibung egal)
    const zielKlein = String(ziel).trim().toLowerCase();

    // Aktivitätslevel bestimmen
    let AK, AP;
    if (anzahlUebungen <= 2) {
        AK = 1.0; AP = 1.0;
    } else if (anzahlUebungen <= 5) {
        AK = 1.1; AP = 1.5;
    } else {
        AK = 1.2; AP = 2.0;
    }

    // Muskelaufbau verwendet immer AP = 2
    if (zielKlein === "muskelaufbau") {
        AP = 2.0;
    }

    // Kalorienbedarf je nach Ziel
    const grundbedarf = gewicht * 30 * AK;
    let kalorien;

    switch (zielKlein) {
        case "gewicht halten": kalorien = grundbedarf; break;
        case "zunehmen":       kalorien = grundbedarf + 400; break;
        case "abnehmen":       kalorien = grundbedarf - 300; break;
        case "muskelaufbau":   kalorien = grundbedarf + 300; break;
        default:
            return { ok: false, fehler: "Ungültiges Ziel. Erlaubt: Zunehmen, Abnehmen, Muskelaufbau, Gewicht halten." };
    }

    const protein = gewicht * AP;

    return {
        ok: true,
        kalorien: Math.round(kalorien),
        protein: Math.round(protein)
    };
}

// ---------- 4. Hilfsfunktion ----------
// Sucht einen Eintrag, egal ob groß oder klein geschrieben wurde.
// Gibt den richtigen Namen zurück oder null, wenn nichts passt.
function findeSchluessel(objekt, eingabe) {
  if (typeof eingabe !== "string") {
    return null;
  }
  const gesucht = eingabe.trim().toLowerCase();
  const alleNamen = Object.keys(objekt);
  for (let i = 0; i < alleNamen.length; i++) {
    if (alleNamen[i].toLowerCase() === gesucht) {
      return alleNamen[i];
    }
  }
  return null;
}

// ---------- 5. Hauptfunktion: der Algorithmus ----------
function waehleUebungen(muskelgruppe, trainingsziel, trainingsstatus) {

  // Schritt 1: Muskelgruppe prüfen
  const gruppe = findeSchluessel(uebungskatalog, muskelgruppe);
  if (gruppe === null) {
    return {
      ok: false,
      fehler: "Ungültige Muskelgruppe. Erlaubt sind: " + Object.keys(uebungskatalog).join(", ") + "."
    };
  }

  // Schritt 2: Trainingsziel prüfen
  const ziel = findeSchluessel(trainingsziele, trainingsziel);
  if (ziel === null) {
    return {
      ok: false,
      fehler: "Ungültiges Trainingsziel. Erlaubt sind: " + Object.keys(trainingsziele).join(", ") + "."
    };
  }

  // Schritt 3: Trainingsstatus prüfen (fehlt er, wird Starter verwendet)
  let status;
  const statusFehlt = (trainingsstatus === undefined ||
                       trainingsstatus === null ||
                       String(trainingsstatus).trim() === "");
  if (statusFehlt) {
    status = "Starter";
  } else {
    status = findeSchluessel(saetzeProStatus, trainingsstatus);
    if (status === null) {
      return {
        ok: false,
        fehler: "Ungültiger Trainingsstatus. Erlaubt sind: " + Object.keys(saetzeProStatus).join(", ") + "."
      };
    }
  }

  // Schritt 4: Sätze und Wiederholungen bestimmen
  const saetze = saetzeProStatus[status];                      // nur vom Status abhängig
  const wiederholungen = trainingsziele[ziel].wiederholungen;  // nur vom Ziel abhängig

  // Schritt 5: die drei Übungen der Muskelgruppe aus dem Katalog nehmen
  // (immer genau drei, immer dieselben, nicht zufällig)
  const katalogUebungen = uebungskatalog[gruppe];
  const ergebnisUebungen = [];
  for (let i = 0; i < 3; i++) {
    ergebnisUebungen.push({
      name: katalogUebungen[i].name,
      beschreibung: katalogUebungen[i].beschreibung,
      saetze: saetze,
      wiederholungen: wiederholungen
    });
  }

  // Schritt 6: Sicherheitshinweis bei Nackenübungen
  let hinweis = null;
  if (gruppe === "Nacken") {
    hinweis = "Sicherheitshinweis: Nackenübungen nur mit sehr leichtem Widerstand " +
              "und ohne ruckartige Bewegungen ausführen.";
  }

  return {
    ok: true,
    muskelgruppe: gruppe,
    trainingsziel: ziel,
    zweck: trainingsziele[ziel].zweck,
    trainingsstatus: status,
    uebungen: ergebnisUebungen,
    hinweis: hinweis
  };
}


// ---------- A3: Score-Berechnung und Status (aus berechnung.js) ----------
// ---------- Feste Werte aus den Projektvorgaben ----------
const BETRACHTETE_TAGE = 30;     // Trainingshäufigkeit: letzte 30 Tage
const ZIEL_TRAININGSTAGE = 12;   // 12 Trainingstage        -> volle Punkte
const ZIEL_VERHAELTNIS = 1.0;    // Gewicht / Körpergewicht = 1,0 -> volle Punkte
const ZIEL_WIEDERHOLUNGEN = 15;  // 15 Wiederholungen pro Satz -> volle Punkte
const ZIEL_SAETZE = 4;           // 4 Sätze                 -> volle Punkte

const MAX_HAEUFIGKEIT = 20;
const MAX_RELATIVE_LEISTUNG = 20;
const MAX_WIEDERHOLUNGEN = 15;
const MAX_SAETZE = 15;

// ---------- Datum ----------

// Heutiges Datum im Format JJJJ-MM-TT (Ortszeit)
function heutigesDatum() {
  const jetzt = new Date();
  const monat = String(jetzt.getMonth() + 1).padStart(2, "0");
  const tag = String(jetzt.getDate()).padStart(2, "0");
  return jetzt.getFullYear() + "-" + monat + "-" + tag;
}

// Prüft, ob ein Text ein echtes Datum im Format JJJJ-MM-TT ist
function istGueltigesDatum(text) {
  if (typeof text !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    return false;
  }
  const datum = new Date(text + "T00:00:00Z");
  if (isNaN(datum.getTime())) {
    return false;
  }
  // 2026-02-30 würde sonst zu 2026-03-02 umgerechnet werden
  return datum.toISOString().slice(0, 10) === text;
}

// Anzahl Tage zwischen zwei Datumsangaben (spaeter - frueher)
function tageZwischen(frueher, spaeter) {
  const a = new Date(frueher + "T00:00:00Z");
  const b = new Date(spaeter + "T00:00:00Z");
  return Math.round((b - a) / (24 * 60 * 60 * 1000));
}

// Sortiert Einheiten nach Datum (älteste zuerst). Bei gleichem Datum entscheidet die ID.
function sortiereChronologisch(einheiten) {
  const kopie = einheiten.slice();
  kopie.sort(function (a, b) {
    if (a.datum < b.datum) return -1;
    if (a.datum > b.datum) return 1;
    return a.id - b.id;
  });
  return kopie;
}

// ---------- Hilfsfunktionen für Punkte ----------

// Punkte proportional zum Zielwert, aber höchstens die Maximalpunkte
function punkteNachAnteil(wert, zielwert, maxPunkte) {
  const punkte = (wert / zielwert) * maxPunkte;
  if (punkte > maxPunkte) {
    return maxPunkte;
  }
  return punkte;
}

// Rundet auf eine Nachkommastelle (nur für die Anzeige der Teilpunkte)
function rundeEineStelle(zahl) {
  return Math.round(zahl * 10) / 10;
}

// Größter Wert eines Feldes (z. B. "gewicht") in einer Liste von Einheiten
function hoechsterWert(einheiten, feld) {
  let maximum = 0;
  for (let i = 0; i < einheiten.length; i++) {
    if (einheiten[i][feld] > maximum) {
      maximum = einheiten[i][feld];
    }
  }
  return maximum;
}

// ---------- Teilbereich 1: Trainingshäufigkeit ----------
// Zählt die verschiedenen Trainingstage der letzten 30 Tage
// (heute und die 29 Tage davor = 30 Kalendertage).
function zaehleTrainingstage(einheiten, heute) {
  const schonGezaehlt = {};
  let anzahl = 0;
  for (let i = 0; i < einheiten.length; i++) {
    const tage = tageZwischen(einheiten[i].datum, heute);
    if (tage >= 0 && tage < BETRACHTETE_TAGE && !schonGezaehlt[einheiten[i].datum]) {
      schonGezaehlt[einheiten[i].datum] = true;
      anzahl++;
    }
  }
  return anzahl;
}

// ---------- Teilbereich 5: Entwicklung über die Zeit ----------

// Verbesserung: mehr Gewicht ODER bei gleichem Gewicht mehr Wiederholungen insgesamt
function istVerbesserung(alt, neu) {
  if (neu.gewicht > alt.gewicht) {
    return true;
  }
  if (neu.gewicht === alt.gewicht) {
    return neu.wiederholungen * neu.saetze > alt.wiederholungen * alt.saetze;
  }
  return false;
}

// Vergleicht aufeinanderfolgende Einträge DERSELBEN Übung.
// Liefert: Anzahl Vergleiche, Anzahl Verbesserungen, längste Serie von Verbesserungen
function analysiereEntwicklung(einheiten) {
  const sortiert = sortiereChronologisch(einheiten);

  // Einträge nach Übung sortieren (jede Übung nur mit sich selbst vergleichen)
  const proUebung = {};
  for (let i = 0; i < sortiert.length; i++) {
    const name = sortiert[i].uebung;
    if (!proUebung[name]) {
      proUebung[name] = [];
    }
    proUebung[name].push(sortiert[i]);
  }

  let vergleiche = 0;
  let verbesserungen = 0;
  let laengsteSerie = 0;

  const namen = Object.keys(proUebung);
  for (let n = 0; n < namen.length; n++) {
    const liste = proUebung[namen[n]];
    let serie = 0;
    for (let i = 1; i < liste.length; i++) {
      vergleiche++;
      if (istVerbesserung(liste[i - 1], liste[i])) {
        verbesserungen++;
        serie++;
        if (serie > laengsteSerie) {
          laengsteSerie = serie;
        }
      } else {
        serie = 0;
      }
    }
  }

  return { vergleiche: vergleiche, verbesserungen: verbesserungen, laengsteSerie: laengsteSerie };
}

// 30 / 20 / 10 / 0 Punkte je nach Entwicklung
function punkteEntwicklung(analyse) {
  if (analyse.laengsteSerie >= 3) {
    return 30;
  }
  let quote = 0;
  if (analyse.vergleiche > 0) {
    quote = analyse.verbesserungen / analyse.vergleiche;
  }
  if (analyse.verbesserungen >= 2 && quote >= 0.5) {
    return 20;
  }
  if (analyse.verbesserungen >= 1) {
    return 10;
  }
  return 0;
}

// ---------- Status und Farbe ----------
function bestimmeStatus(score, hatTrainingsdaten) {
  if (!hatTrainingsdaten) return { status: "Inactive", farbe: "Weiß" };
  if (score <= 20) return { status: "Starter", farbe: "Rot" };
  if (score <= 40) return { status: "Rising", farbe: "Orange" };
  if (score <= 70) return { status: "Advanced", farbe: "Gelb" };
  return { status: "Elite", farbe: "Grün" };
}

// Ergebnis für eine Muskelgruppe ohne Trainingsdaten
function leereMuskelgruppe() {
  return {
    score: 0,
    status: "Inactive",
    farbe: "Weiß",
    teilpunkte: { haeufigkeit: 0, relativeLeistung: 0, wiederholungen: 0, saetze: 0, entwicklung: 0 },
    hinweis: null
  };
}

// ---------- Hauptfunktion: Score einer Muskelgruppe ----------
// einheiten: nur die Einheiten DIESER Muskelgruppe
// koerpergewicht: Zahl oder null (wenn unbekannt)
function berechneMuskelgruppe(einheiten, koerpergewicht, heute) {
  if (einheiten.length === 0) {
    return leereMuskelgruppe();
  }

  // 1. Trainingshäufigkeit (max. 20)
  const trainingstage = zaehleTrainingstage(einheiten, heute);
  const haeufigkeit = punkteNachAnteil(trainingstage, ZIEL_TRAININGSTAGE, MAX_HAEUFIGKEIT);

  // 2. Relative Trainingsleistung (max. 20): höchstes Gewicht / Körpergewicht
  let relativeLeistung = 0;
  let hinweis = null;
  if (typeof koerpergewicht === "number" && koerpergewicht > 0) {
    const verhaeltnis = hoechsterWert(einheiten, "gewicht") / koerpergewicht;
    relativeLeistung = punkteNachAnteil(verhaeltnis, ZIEL_VERHAELTNIS, MAX_RELATIVE_LEISTUNG);
  } else {
    hinweis = "Es ist kein Körpergewicht gespeichert. Die relative Trainingsleistung kann nicht berechnet werden " +
              "(0 Punkte dafür). Die Trainingsdaten bleiben unverändert erhalten.";
  }

  // 3. Wiederholungen (max. 15): höchste Wiederholungszahl pro Satz
  const wiederholungen = punkteNachAnteil(hoechsterWert(einheiten, "wiederholungen"), ZIEL_WIEDERHOLUNGEN, MAX_WIEDERHOLUNGEN);

  // 4. Sätze (max. 15): höchste Satzzahl
  const saetze = punkteNachAnteil(hoechsterWert(einheiten, "saetze"), ZIEL_SAETZE, MAX_SAETZE);

  // 5. Entwicklung über die Zeit (max. 30)
  const entwicklung = punkteEntwicklung(analysiereEntwicklung(einheiten));

  // Gesamtscore: addieren, auf höchstens 100 begrenzen, kaufmännisch runden
  let summe = haeufigkeit + relativeLeistung + wiederholungen + saetze + entwicklung;
  if (summe > 100) {
    summe = 100;
  }
  const score = Math.round(summe);

  const statusInfo = bestimmeStatus(score, true);

  return {
    score: score,
    status: statusInfo.status,
    farbe: statusInfo.farbe,
    teilpunkte: {
      haeufigkeit: rundeEineStelle(haeufigkeit),
      relativeLeistung: rundeEineStelle(relativeLeistung),
      wiederholungen: rundeEineStelle(wiederholungen),
      saetze: rundeEineStelle(saetze),
      entwicklung: entwicklung
    },
    hinweis: hinweis
  };
}

// ---------- Aktivitätslevel (aus der Anzahl der Übungen) ----------

// Zählt, wie viele verschiedene Übungen an einem Tag absolviert wurden.
// (Nicht verwechseln mit den Trainingstagen!)
function zaehleUebungenAmTag(einheiten, datum) {
  const schonGezaehlt = {};
  let anzahl = 0;
  for (let i = 0; i < einheiten.length; i++) {
    if (einheiten[i].datum === datum) {
      const schluessel = einheiten[i].muskelgruppe + "|" + einheiten[i].uebung;
      if (!schonGezaehlt[schluessel]) {
        schonGezaehlt[schluessel] = true;
        anzahl++;
      }
    }
  }
  return anzahl;
}

// 0-2 Übungen: niedrig, 3-5: mittel, ab 6: hoch
function bestimmeAktivitaetslevel(anzahlUebungen) {
  if (anzahlUebungen <= 2) return "niedrig";
  if (anzahlUebungen <= 5) return "mittel";
  return "hoch";
}

// Macht Text sicher für die Anzeige in HTML (verhindert eingeschleusten Code)
function esc(text) {
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Zahl im deutschen Format (Komma als Dezimaltrennzeichen)
function zahl(wert, stellen) {
  const maximal = (stellen === undefined) ? 1 : stellen;
  return Number(wert).toLocaleString("de-DE", { maximumFractionDigits: maximal });
}

// Datum von vor n Tagen (Format JJJJ-MM-TT)
function datumVorTagen(datum, tage) {
  const d = new Date(datum + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() - tage);
  return d.toISOString().slice(0, 10);
}

// 2026-10-01 -> "Heute", "Gestern" oder "01.10.2026"
function formatDatum(datum) {
  const heute = heutigesDatum();
  if (datum === heute) return "Heute";
  if (datum === datumVorTagen(heute, 1)) return "Gestern";
  return datum.slice(8, 10) + "." + datum.slice(5, 7) + "." + datum.slice(0, 4);
}

// Kurzes Datum für Diagramme: 01.10.
function kurzDatum(datum) {
  return datum.slice(8, 10) + "." + datum.slice(5, 7) + ".";
}

let toastTimer = null;
function zeigeToast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("sichtbar");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("sichtbar"); }, 2600);

   Die Daten werden im Browser (localStorage) abgelegt. Später kann dieser
   Abschnitt durch Aufrufe an den Node.js-Server ersetzt werden, der die
   JSON-Dateien (trainingseinheiten.json, profil.json, ...) schreibt.
   Funktioniert localStorage nicht (z. B. gesperrt), bleiben die Daten
   nur bis zum Schließen der Seite im Arbeitsspeicher.
   ====================================================================== */

const SCHLUESSEL = {
  einheiten: "mamu_trainingseinheiten",   // entspricht trainingseinheiten.json
  profil: "mamu_profil",                  // entspricht profil.json
  eigeneUebungen: "mamu_eigene_uebungen",
  einstellungen: "mamu_einstellungen",
  angaben: "mamu_angaben"
};

const gedaechtnis = {};       // Zwischenspeicher im Arbeitsspeicher
const gesperrt = {};          // Schlüssel, deren gespeicherte Daten nicht lesbar waren
let speicherFunktioniert = true;

// Liest einen Wert. Sind die gespeicherten Daten kaputt, wird NICHT überschrieben.
function ladeWert(schluessel, standard) {
  if (gedaechtnis[schluessel] !== undefined) {
    return JSON.parse(gedaechtnis[schluessel]);
  }
  let text = null;
  try {
    text = window.localStorage.getItem(schluessel);
  } catch (fehler) {
    speicherFunktioniert = false;
  }
  if (text === null) {
    return standard;
  }
  try {
    return JSON.parse(text);
  } catch (fehler) {
    gesperrt[schluessel] = true;       // kaputte Daten bleiben unverändert
    return standard;
  }
}

// Speichert einen Wert. Gibt true zurück, wenn es geklappt hat.
function speichereWert(schluessel, wert) {
  if (gesperrt[schluessel]) {
    return false;
  }
  const text = JSON.stringify(wert);
  gedaechtnis[schluessel] = text;
  try {
    window.localStorage.setItem(schluessel, text);
  } catch (fehler) {
    speicherFunktioniert = false;
  }
  return true;
}

const FEHLER_GESPERRT = "Die gespeicherten Daten konnten nicht gelesen werden. Es wurde nichts überschrieben.";


/* ======================================================================
   ABSCHNITT D: Verwaltung der Trainingsdaten
   Gleiche Aufgaben und Regeln wie trainingsdaten.js (Node.js):
   prüfen, speichern, löschen, Status berechnen.
   Erweiterung der Oberfläche: Eigene Übungen dürfen angelegt werden.
   ====================================================================== */

function ladeEinheitenDaten() {
  return ladeWert(SCHLUESSEL.einheiten, { naechsteId: 1, einheiten: [] });
}

function holeAlleEinheiten() {
  return ladeEinheitenDaten().einheiten;
}

// Körpergewicht aus dem Profil (Zahl) oder null, wenn keins gespeichert ist
function holeKoerpergewicht() {
  const profil = ladeWert(SCHLUESSEL.profil, { koerpergewicht: null });
  if (typeof profil.koerpergewicht === "number" && profil.koerpergewicht > 0) {
    return profil.koerpergewicht;
  }
  return null;
}

function speichereKoerpergewicht(gewicht) {
  const wert = Number(gewicht);
  if (gewicht === "" || gewicht === null || !isFinite(wert) || wert <= 0) {
    return { ok: false, fehler: "Das Körpergewicht muss eine Zahl größer als 0 sein." };
  }
  if (!speichereWert(SCHLUESSEL.profil, { koerpergewicht: wert })) {
    return { ok: false, fehler: FEHLER_GESPERRT };
  }
  return { ok: true, koerpergewicht: wert };
}

// ----- Eigene Übungen -----
function holeEigeneUebungen(gruppe) {
  const alle = ladeWert(SCHLUESSEL.eigeneUebungen, {});
  return alle[gruppe] || [];
}

// Übungsnamen einer Muskelgruppe: Katalog + eigene Übungen
function holeUebungsnamen(gruppe) {
  const namen = [];
  for (let i = 0; i < uebungskatalog[gruppe].length; i++) {
    namen.push(uebungskatalog[gruppe][i].name);
  }
  const eigene = holeEigeneUebungen(gruppe);
  for (let j = 0; j < eigene.length; j++) {
    namen.push(eigene[j]);
  }
  return namen;
}

function speichereEigeneUebung(gruppe, eingabe) {
  const name = String(eingabe).trim().replace(/\s+/g, " ");
  if (name.length < 2 || name.length > 40) {
    return { ok: false, fehler: "Der Name der Übung muss 2 bis 40 Zeichen lang sein." };
  }
  if (!/[A-Za-zÄÖÜäöüß]/.test(name)) {
    return { ok: false, fehler: "Der Name der Übung muss Buchstaben enthalten." };
  }
  if (findeSchluessel(arrayAlsObjekt(holeUebungsnamen(gruppe)), name) !== null) {
    return { ok: false, fehler: "Diese Übung gibt es bei " + gruppe + " bereits." };
  }
  const alle = ladeWert(SCHLUESSEL.eigeneUebungen, {});
  if (!alle[gruppe]) {
    alle[gruppe] = [];
  }
  alle[gruppe].push(name);
  if (!speichereWert(SCHLUESSEL.eigeneUebungen, alle)) {
    return { ok: false, fehler: FEHLER_GESPERRT };
  }
  return { ok: true, name: name };
}

function loescheEigeneUebung(gruppe, name) {
  const alle = ladeWert(SCHLUESSEL.eigeneUebungen, {});
  const neu = [];
  const liste = alle[gruppe] || [];
  for (let i = 0; i < liste.length; i++) {
    if (liste[i] !== name) neu.push(liste[i]);
  }
  alle[gruppe] = neu;
  speichereWert(SCHLUESSEL.eigeneUebungen, alle);
}

// Hilfsfunktion: macht aus einer Namensliste ein Objekt, damit findeSchluessel() sie durchsuchen kann
function arrayAlsObjekt(liste) {
  const objekt = {};
  for (let i = 0; i < liste.length; i++) {
    objekt[liste[i]] = true;
  }
  return objekt;
}

// ----- Eingaben prüfen (gleiche Regeln wie in trainingsdaten.js) -----
function pruefeEinheit(eingabe) {
  const felder = [["muskelgruppe", "Muskelgruppe"], ["uebung", "Übung"], ["gewicht", "Gewicht"],
                  ["wiederholungen", "Wiederholungen"], ["saetze", "Sätze"]];
  const fehlend = [];
  for (let i = 0; i < felder.length; i++) {
    const wert = eingabe[felder[i][0]];
    if (wert === undefined || wert === null || String(wert).trim() === "") {
      fehlend.push(felder[i][1]);
    }
  }
  if (fehlend.length > 0) {
    return { ok: false, fehler: "Pflichtfelder fehlen: " + fehlend.join(", ") + "." };
  }

  const gruppe = findeSchluessel(uebungskatalog, eingabe.muskelgruppe);
  if (gruppe === null) {
    return { ok: false, fehler: "Ungültige Muskelgruppe." };
  }
  const uebung = findeSchluessel(arrayAlsObjekt(holeUebungsnamen(gruppe)), eingabe.uebung);
  if (uebung === null) {
    return { ok: false, fehler: "Die Übung \"" + eingabe.uebung + "\" gehört nicht zur Muskelgruppe " + gruppe + "." };
  }

  const gewicht = Number(eingabe.gewicht);
  if (!isFinite(gewicht)) return { ok: false, fehler: "Das Gewicht muss eine Zahl sein." };
  if (gewicht < 0) return { ok: false, fehler: "Das Gewicht darf nicht negativ sein." };
  const wiederholungen = Number(eingabe.wiederholungen);
  if (!Number.isInteger(wiederholungen) || wiederholungen <= 0) {
    return { ok: false, fehler: "Die Wiederholungen müssen eine ganze Zahl größer als 0 sein." };
  }
  const saetze = Number(eingabe.saetze);
  if (!Number.isInteger(saetze) || saetze <= 0) {
    return { ok: false, fehler: "Die Sätze müssen eine ganze Zahl größer als 0 sein." };
  }

  const heute = heutigesDatum();
  let datum = heute;
  if (eingabe.datum !== undefined && eingabe.datum !== null && String(eingabe.datum).trim() !== "") {
    datum = String(eingabe.datum).trim();
    if (!istGueltigesDatum(datum)) {
      return { ok: false, fehler: "Das Datum muss ein echtes Datum sein (JJJJ-MM-TT)." };
    }
    if (datum > heute) {
      return { ok: false, fehler: "Das Datum darf nicht in der Zukunft liegen." };
    }
  }

  return { ok: true, einheit: { muskelgruppe: gruppe, uebung: uebung, gewicht: gewicht,
                                wiederholungen: wiederholungen, saetze: saetze, datum: datum } };
}

// Speichert mehrere Übungen eines Trainings auf einmal.
// Zuerst werden ALLE geprüft; nur wenn alles gültig ist, wird gespeichert.
function fuegeTrainingseinheitenHinzu(liste) {
  const geprueft = [];
  for (let i = 0; i < liste.length; i++) {
    const ergebnis = pruefeEinheit(liste[i]);
    if (!ergebnis.ok) {
      return { ok: false, fehler: liste[i].uebung + ": " + ergebnis.fehler };
    }
    geprueft.push(ergebnis.einheit);
  }
  const daten = ladeEinheitenDaten();
  for (let j = 0; j < geprueft.length; j++) {
    daten.einheiten.push({
      id: daten.naechsteId,                 // eindeutige ID
      muskelgruppe: geprueft[j].muskelgruppe,
      uebung: geprueft[j].uebung,
      gewicht: geprueft[j].gewicht,
      wiederholungen: geprueft[j].wiederholungen,
      saetze: geprueft[j].saetze,
      datum: geprueft[j].datum
    });
    daten.naechsteId = daten.naechsteId + 1;
  }
  if (!speichereWert(SCHLUESSEL.einheiten, daten)) {
    return { ok: false, fehler: FEHLER_GESPERRT };
  }
  return { ok: true, anzahl: geprueft.length };
}

function loescheTrainingseinheit(id) {
  const daten = ladeEinheitenDaten();
  const uebrig = [];
  for (let i = 0; i < daten.einheiten.length; i++) {
    if (daten.einheiten[i].id !== id) uebrig.push(daten.einheiten[i]);
  }
  daten.einheiten = uebrig;
  return speichereWert(SCHLUESSEL.einheiten, daten);
}

// ----- Status aller Muskelgruppen (jede unabhängig berechnet) -----
function einheitenDerGruppe(alle, gruppe) {
  const liste = [];
  for (let i = 0; i < alle.length; i++) {
    if (alle[i].muskelgruppe === gruppe) liste.push(alle[i]);
  }
  return liste;
}

function berechneAlleStatus() {
  const alle = holeAlleEinheiten();
  const gewicht = holeKoerpergewicht();
  const heute = heutigesDatum();
  const ergebnis = {};
  for (let i = 0; i < MUSKELGRUPPEN.length; i++) {
    const g = MUSKELGRUPPEN[i];
    ergebnis[g] = berechneMuskelgruppe(einheitenDerGruppe(alle, g), gewicht, heute);
  }
  return ergebnis;
}

// Score-Verlauf einer Muskelgruppe: Score an jedem Trainingstag (+ heute)
function berechneScoreVerlauf(gruppe) {
  const alle = holeAlleEinheiten();
  const liste = sortiereChronologisch(einheitenDerGruppe(alle, gruppe));
  const gewicht = holeKoerpergewicht();
  const heute = heutigesDatum();
  const verlauf = [];
  let letztesDatum = "";
  for (let i = 0; i < liste.length; i++) {
    const tag = liste[i].datum;
    if (tag === letztesDatum) continue;       // jeden Tag nur einmal
    letztesDatum = tag;
    const bisher = [];
    for (let j = 0; j < liste.length; j++) {
      if (liste[j].datum <= tag) bisher.push(liste[j]);
    }
    verlauf.push({ datum: tag, score: berechneMuskelgruppe(bisher, gewicht, tag).score });
  }
  if (liste.length > 0 && letztesDatum !== heute) {
    verlauf.push({ datum: heute, score: berechneMuskelgruppe(liste, gewicht, heute).score });
  }
  return verlauf;
}

// Trainingseinheiten für die Anzeige: Einträge mit gleichem Datum und gleicher Muskelgruppe gehören zusammen
function gruppiereEinheiten(alle) {
  const sortiert = sortiereChronologisch(alle).reverse();    // neueste zuerst
  const gruppen = [];
  const index = {};
  for (let i = 0; i < sortiert.length; i++) {
    const e = sortiert[i];
    const schluessel = e.datum + "|" + e.muskelgruppe;
    if (index[schluessel] === undefined) {
      index[schluessel] = gruppen.length;
      gruppen.push({ datum: e.datum, muskelgruppe: e.muskelgruppe, eintraege: [] });
    }
    gruppen[index[schluessel]].eintraege.push(e);
  }
  return gruppen;
}

// Einstellungen und persönliche Angaben
function holeEinstellungen() {
  const e = ladeWert(SCHLUESSEL.einstellungen, {});
  return {
    koerper: (e.koerper === "frau") ? "frau" : "mann",
    trainingsziel: findeSchluessel(trainingsziele, e.trainingsziel) || "Muskelaufbau"
  };
}
function holeAngaben() {
  const a = ladeWert(SCHLUESSEL.angaben, {});
  return { name: a.name || "", alter: a.alter || "", groesse: a.groesse || "" };
}


/* ======================================================================
   ABSCHNITT E: Zustand der Oberfläche
   Alles, was die Oberfläche "weiß", steht in diesem einen Objekt.
   ====================================================================== */
const zustand = {
  seite: "koerper",         // aktuell angezeigter Bereich
  ansicht: "vorne",         // "vorne" oder "hinten" (Smartphone)
  geschlecht: "mann",       // "mann" oder "frau"
  auswahl: null,            // angeklickte Muskelgruppe (am Anfang: keine)
  profilOffen: false,       // ist das Muskelprofil als Vollbild geöffnet?
  training: { schritt: 0, gruppe: null, gewaehlt: [], eingaben: {}, datum: "", fehler: [] },
  statistik: { zeitraum: 30, gruppe: null },
  ernaehrung: null          // letztes Ergebnis der Ernährungsberechnung
};


/* ======================================================================
   ABSCHNITT F: Körperansicht (Zeichnung als SVG)
   Es wird nur die linke Körperhälfte beschrieben und für die rechte Hälfte
   gespiegelt. Jede Muskelgruppe ist ein klickbares Element.
   ====================================================================== */

// Umriss des Oberkörpers (linke Hälfte)
const TORSO_MANN = "M100,60 L80,63 L57,70 L53,96 L64,140 L71,170 L68,204 L100,210 Z";
const TORSO_FRAU = "M100,60 L84,64 L62,70 L61,96 L73,138 L79,160 L71,186 L63,206 L100,212 Z";

// Kleine Bausteine zum Zeichnen
function formPfad(d) {
  return '<path class="form" d="' + d + '"/>';
}
function formEllipse(cx, cy, rx, ry, drehung) {
  const dreh = drehung ? ' transform="rotate(' + drehung + ' ' + cx + ' ' + cy + ')"' : "";
  return '<ellipse class="form" cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"' + dreh + '/>';
}
// Linke Hälfte + gespiegelte rechte Hälfte
function beideSeiten(markup) {
  return markup + '<g transform="matrix(-1 0 0 1 200 0)">' + markup + '</g>';
}
// Streckt/staucht eine Körperregion waagerecht (für die Frauen-Ansicht)
function skaliere(faktor) {
  if (faktor === 1) return "";
  return ' transform="translate(100 0) scale(' + faktor + ' 1) translate(-100 0)"';
}

// Die elf Muskelgruppen mit ihrer Form:
// [Name, Körperbereich, Form, Position des Score-Labels (x, y)]
const MUSKEL_FORMEN = {
  vorne: [
    ["Brust", "oben", formPfad("M100,67 L83,67 C70,69 64,80 65,95 C67,108 84,114 100,111 Z"), 100, 89],
    ["Bauch", "mitte", formPfad("M100,115 L87,116 C84,136 85,160 91,181 L100,188 Z"), 100, 150],
    ["Nacken", "oben", formPfad("M100,45 L92,45 L90,58 L79,65 L100,69 Z"), 100, 58],
    ["Schultern", "oben", formEllipse(58, 78, 10, 11, 0), 58, 78],
    ["Bizeps", "oben", formEllipse(48, 110, 7.5, 22, 7.85), 47, 110],
    ["Oberschenkel", "unten", formEllipse(80, 249, 13, 37, 2.7), 80, 249],
    ["Beine", "unten", formEllipse(77, 342, 8.5, 36, 1.1), 77, 342]
  ],
  hinten: [
    ["Rücken", "oben", formPfad("M100,76 L77,67 C68,73 63,92 65,112 C69,140 84,165 100,172 Z"), 100, 118],
    ["Nacken", "oben", formPfad("M100,45 L92,45 L89,58 L77,66 L100,74 Z"), 100, 58],
    ["Schultern", "oben", formEllipse(58, 78, 10, 11, 0), 58, 78],
    ["Trizeps", "oben", formEllipse(48, 110, 7.5, 22, 7.85), 47, 110],
    ["Gesäß", "unten", formEllipse(86, 203, 15, 15, 0), 100, 203],
    ["Oberschenkel", "unten", formEllipse(80, 252, 12.5, 31, 2.7), 80, 252],
    ["Beine", "unten", formEllipse(69.5, 252, 4.5, 36, 0), 70, 252],
    ["Waden", "unten", formEllipse(77, 326, 9.5, 23, 0.8), 77, 326]
  ]
};

// Zeichnet eine Körperseite als SVG-Text
function koerperSvg(seite, geschlecht, alleStatus, auswahl) {
  const frau = (geschlecht === "frau");
  const faktoren = {
    oben: frau ? 0.86 : 1,
    mitte: frau ? 0.88 : 1,
    unten: frau ? 1.06 : 1
  };

  // 1. Silhouette (graue Körperform)
  const arm = '<line x1="52" y1="78" x2="44" y2="136" stroke-width="18" stroke-linecap="round"/>' +
              '<line x1="44" y1="136" x2="35" y2="194" stroke-width="14" stroke-linecap="round"/>' +
              '<ellipse cx="33" cy="204" rx="6.5" ry="9"/>';
  const bein = '<line x1="82" y1="206" x2="78" y2="290" stroke-width="30" stroke-linecap="round"/>' +
               '<line x1="78" y1="290" x2="76" y2="390" stroke-width="21" stroke-linecap="round"/>' +
               '<ellipse cx="73" cy="402" rx="11" ry="7"/>';
  const halsBreite = frau ? 12 : 16;

  let svg = '<svg viewBox="0 0 200 420" role="group" aria-label="' +
            (seite === "vorne" ? "Vorderansicht" : "Rückansicht") + ' des Körpers">';
  svg += '<g class="koerper-form">';
  svg += '<ellipse cx="100" cy="27" rx="13.5" ry="17"/>';
  svg += '<rect x="' + (100 - halsBreite / 2) + '" y="40" width="' + halsBreite + '" height="26" rx="5"/>';
  svg += beideSeiten('<path d="' + (frau ? TORSO_FRAU : TORSO_MANN) + '"/>');
  svg += '<g' + skaliere(faktoren.oben) + '>' + beideSeiten(arm) + '</g>';
  svg += '<g' + skaliere(faktoren.unten) + '>' + beideSeiten(bein) + '</g>';
  svg += '</g>';

  // 2. Muskelgruppen (die ausgewählte wird zuletzt gezeichnet, damit ihr Rand vorn liegt)
  const formen = MUSKEL_FORMEN[seite].slice();
  formen.sort(function (a, b) {
    return (a[0] === auswahl ? 1 : 0) - (b[0] === auswahl ? 1 : 0);
  });

  let label = "";
  for (let i = 0; i < formen.length; i++) {
    const name = formen[i][0];
    const faktor = faktoren[formen[i][1]];
    const st = alleStatus[name];
    const klassen = "muskel " + STATUS_KLASSE[st.status] + (name === auswahl ? " ausgewaehlt" : "");
    svg += '<g class="' + klassen + '" data-gruppe="' + name + '" tabindex="0" role="button" ' +
           'aria-label="' + name + ': ' + st.score + ' von 100 Punkten, Status ' + st.status + '">' +
           '<g' + skaliere(faktor) + '>' + beideSeiten(formen[i][2]) + '</g></g>';

    // Score-Label nur bei der ausgewählten Muskelgruppe, z. B. 72/100
    if (name === auswahl) {
      const lx = 100 - (100 - formen[i][3]) * faktor;
      label = '<g class="score-label" transform="translate(' + lx + ' ' + formen[i][4] + ')" pointer-events="none">' +
              '<rect x="-24" y="-9.5" width="48" height="19" rx="9.5"/>' +
              '<text y="3.8" text-anchor="middle">' + st.score + '/100</text></g>';
    }
  }
  svg += label + '</svg>';
  return svg;
}

// Zeichnet beide Körperseiten neu (z. B. nach einem Klick oder neuem Training)
function renderFiguren() {
  const alleStatus = berechneAlleStatus();
  const seiten = ["vorne", "hinten"];
  const titel = { vorne: "Vorderseite", hinten: "Rückseite" };
  let html = "";
  for (let i = 0; i < seiten.length; i++) {
    const s = seiten[i];
    html += '<div class="figur' + (zustand.ansicht === s ? " aktiv" : "") + '">' +
            '<div class="figur-titel">' + titel[s] + '</div>' +
            koerperSvg(s, zustand.geschlecht, alleStatus, zustand.auswahl) + '</div>';
  }
  $("figuren").innerHTML = html;

  // Umschalter und Punkte-Anzeige aktualisieren
  markiereAktiv("#schalter-geschlecht button", zustand.geschlecht);
  markiereAktiv("#schalter-seite button", zustand.ansicht);
  const punkte = document.querySelectorAll("#punkte i");
  punkte[0].classList.toggle("aktiv", zustand.ansicht === "vorne");
  punkte[1].classList.toggle("aktiv", zustand.ansicht === "hinten");
}

function markiereAktiv(auswahl, wert) {
  const knoepfe = document.querySelectorAll(auswahl);
  for (let i = 0; i < knoepfe.length; i++) {
    knoepfe[i].classList.toggle("aktiv", knoepfe[i].dataset.wert === wert);
  }
}

// Muskelgruppe wurde angeklickt
function klickMuskel(name) {
  zustand.auswahl = name;
  renderFiguren();                       // Farbrand + Score im Körperbild
  const grossBildschirm = window.matchMedia("(min-width: 1000px)").matches;
  if (grossBildschirm) {
    renderProfil();                      // Profil erscheint neben dem Körper
  } else {
    // Kurz warten, damit man die Hervorhebung noch sieht, dann Vollbild öffnen
    setTimeout(function () {
      if (zustand.auswahl === name) {
        zustand.profilOffen = true;
        renderProfil();
        $("profil-bereich").scrollTop = 0;
      }
    }, 300);
  }
}

// Zurück-Pfeil: Körperseite bleibt, die Auswahl wird zurückgesetzt
function schliesseProfil() {
  zustand.profilOffen = false;
  zustand.auswahl = null;
  renderFiguren();
  renderProfil();
}
