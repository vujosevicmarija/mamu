                      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

const HANTEL_ICON = '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" ' +
                    'stroke-width="1.6" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>';

// Ring mit Score in der Mitte
function scoreRing(score, klasse) {
  const umfang = 2 * Math.PI * 42;
  const gefuellt = umfang * score / 100;
  return '<svg class="ring ' + klasse + '" viewBox="0 0 110 110" role="img" aria-label="Score ' + score + ' von 100">' +
         '<circle cx="55" cy="55" r="42" fill="none" stroke="#edf1ee" stroke-width="11"/>' +
         '<circle cx="55" cy="55" r="42" fill="none" stroke="' + (score > 0 ? "var(--farbe)" : "#edf1ee") + '" stroke-width="11" ' +
         'stroke-linecap="round" stroke-dasharray="' + gefuellt + ' ' + umfang + '" transform="rotate(-90 55 55)"/>' +
         '<text x="55" y="56" font-size="28" font-weight="700">' + score + '</text>' +
         '<text x="55" y="74" font-size="12" style="fill:#68766e">von 100</text></svg>';
}

// Eine Zeile mit Beschriftung, Wert und Punktebalken
function kennzeile(titel, text, punkte, maximum) {
  const prozent = Math.round(punkte / maximum * 100);
  return '<div class="zeile"><div class="zeile-kopf"><b>' + titel + '</b><span>' + zahl(punkte) + ' / ' + maximum + ' Punkte</span></div>' +
         '<div class="klein-text">' + text + '</div>' +
         '<div class="balken"><i style="width:' + prozent + '%"></i></div></div>';
}

// Prozentuale Veränderung als Text
function veraenderungText(aktuell, vorher) {
  if (vorher === null) return "–";
  if (vorher === 0) return aktuell === 0 ? "0 %" : "neu";
  const prozent = (aktuell - vorher) / vorher * 100;
  return (prozent > 0 ? "+" : "") + zahl(prozent, 1) + " %";
}

// Liniendiagramm als SVG
function liniendiagramm(verlauf) {
  const B = 320, H = 170, links = 34, rechts = 14, oben = 16, unten = 28;
  const innenB = B - links - rechts;
  const innenH = H - oben - unten;
  function px(i) {
    return verlauf.length === 1 ? links + innenB / 2 : links + innenB * i / (verlauf.length - 1);
  }
  function py(score) {
    return oben + innenH * (1 - score / 100);
  }

  let svg = '<svg viewBox="0 0 ' + B + ' ' + H + '" role="img" aria-label="Liniendiagramm: Entwicklung des Scores">';
  const gitter = [0, 50, 100];
  for (let g = 0; g < gitter.length; g++) {
    svg += '<line class="achse" x1="' + links + '" x2="' + (B - rechts) + '" y1="' + py(gitter[g]) + '" y2="' + py(gitter[g]) + '"/>' +
           '<text x="' + (links - 6) + '" y="' + (py(gitter[g]) + 4) + '" text-anchor="end">' + gitter[g] + '</text>';
  }
  if (verlauf.length > 1) {
    let punkteText = "";
    for (let i = 0; i < verlauf.length; i++) {
      punkteText += px(i) + "," + py(verlauf[i].score) + " ";
    }
    svg += '<polyline class="linie" points="' + punkteText + '"/>';
  }
  for (let i = 0; i < verlauf.length; i++) {
    const letzter = (i === verlauf.length - 1);
    svg += '<circle class="punkt' + (letzter ? " letzter" : "") + '" cx="' + px(i) + '" cy="' + py(verlauf[i].score) + '" r="4.5"/>';
    if (verlauf.length <= 8) {
      svg += '<text class="wert" x="' + px(i) + '" y="' + (py(verlauf[i].score) - 9) + '" text-anchor="middle">' + verlauf[i].score + '</text>';
    }
    // Datum unter der Achse (bei vielen Punkten nur erster und letzter)
    if (verlauf.length <= 6 || i === 0 || letzter) {
      svg += '<text x="' + px(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + kurzDatum(verlauf[i].datum) + '</text>';
    }
  }
  return svg + '</svg>';
}

// Drei Übungsempfehlungen (mit der bestehenden Funktion waehleUebungen)
function empfehlungenHtml(gruppe, statusName) {
  const ziel = holeEinstellungen().trainingsziel;
  // "Inactive" kennt waehleUebungen nicht -> wie vereinbart als "Starter" übergeben
  const statusFuerAlgorithmus = (statusName === "Inactive") ? "Starter" : statusName;
  const e = waehleUebungen(gruppe, ziel, statusFuerAlgorithmus);
  if (!e.ok) {
    return '<div class="hinweis fehler">' + esc(e.fehler) + '</div>';
  }
  let html = '<div class="karte"><h3>Übungsempfehlungen</h3>' +
             '<p class="klein-text" style="margin-bottom:12px">Für dein Ziel „' + esc(e.trainingsziel) + '“ · Status ' + esc(statusName) + '</p>' +
             '<div class="uebungs-karten">';
  for (let i = 0; i < e.uebungen.length; i++) {
    const u = e.uebungen[i];
    html += '<div class="uebung-karte"><div class="uebung-bild">' + HANTEL_ICON + '<span>Abbildung folgt</span></div>' +
            '<div class="uebung-inhalt"><b>' + esc(u.name) + '</b>' +
            '<span class="etikett">' + esc(gruppe) + '</span>' +
            '<p style="font-size:14px;font-weight:600">' + u.saetze + ' Sätze × ' + esc(u.wiederholungen) + ' Wdh.</p>' +
            '<p class="klein-text" style="margin-top:4px">' + esc(u.beschreibung) + '</p></div></div>';
  }
  html += '</div>';
  if (e.hinweis) {
    html += '<div class="hinweis warnung" style="margin-top:12px">' + esc(e.hinweis) + '</div>';
  }
  return html + '</div>';
}

// Baut das komplette Muskelprofil auf
function renderProfil() {
  const box = $("profil-bereich");
  box.classList.toggle("offen", zustand.profilOffen && zustand.auswahl !== null);

  if (zustand.auswahl === null) {
    box.innerHTML = '<div class="platzhalter">Tippe auf eine Muskelgruppe, um das ausführliche Muskelprofil zu sehen.</div>';
    return;
  }

  const gruppe = zustand.auswahl;
  const alle = holeAlleEinheiten();
  const liste = einheitenDerGruppe(alle, gruppe);
  const gewicht = holeKoerpergewicht();
  const heute = heutigesDatum();
  const erg = berechneMuskelgruppe(liste, gewicht, heute);
  const klasse = STATUS_KLASSE[erg.status];

  // Kopf: Zurück-Pfeil + Überschrift (nur der Name der Muskelgruppe)
  let html = '<div class="profil-kopf"><button type="button" class="zurueck" data-aktion="profil-zurueck" ' +
             'aria-label="Zurück zur Körperansicht">' + PFEIL_ZURUECK + '</button><h2>' + esc(gruppe) + '</h2></div>';

  // Score und Status
  html += '<div class="score-kopf ' + klasse + '">' + scoreRing(erg.score, klasse) +
          '<div><div class="klein-text">Aktueller Trainings-Score</div>' +
          '<div style="font-size:24px;font-weight:700;margin:2px 0 6px">' + erg.score + ' / 100</div>' +
          '<span class="status-pille ' + klasse + '"><i></i>' + esc(erg.status) + '</span></div></div>';

  if (liste.length === 0) {
    html += '<div class="karte"><p style="font-weight:700">Noch keine Daten</p>' +
            '<p class="klein-text" style="margin:4px 0 12px">Für diese Muskelgruppe wurde noch kein Training gespeichert.</p>' +
            '<button type="button" class="knopf primaer breit" data-aktion="erstes-training">Erstes Training hinzufügen</button></div>';
  } else {
    // Einzelne Bereiche des Scores
    const t = erg.teilpunkte;
    const tage = zaehleTrainingstage(liste, heute);
    const analyse = analysiereEntwicklung(liste);
    let relativText;
    if (gewicht === null) {
      relativText = 'Körpergewicht fehlt (bitte unter „Ernährung“ oder „Mehr“ eintragen)';
    } else {
      relativText = zahl(hoechsterWert(liste, "gewicht") / gewicht, 2) + ' (höchstes Gewicht ' +
                    zahl(hoechsterWert(liste, "gewicht")) + ' kg ÷ Körpergewicht ' + zahl(gewicht) + ' kg)';
    }
    html += '<div class="karte"><h3>Details zum Score</h3>' +
            kennzeile("Trainingshäufigkeit", tage + ' von 12 Trainingstagen in den letzten 30 Tagen', t.haeufigkeit, 20) +
            kennzeile("Relative Trainingsleistung", relativText, t.relativeLeistung, 20) +
            kennzeile("Wiederholungen", 'Höchstwert: ' + hoechsterWert(liste, "wiederholungen") + ' pro Satz', t.wiederholungen, 15) +
            kennzeile("Sätze", 'Höchstwert: ' + hoechsterWert(liste, "saetze") + ' Sätze', t.saetze, 15) +
            kennzeile("Entwicklung über die Zeit", analyse.verbesserungen + ' Verbesserungen bei ' + analyse.vergleiche + ' Vergleichen', t.entwicklung, 30) +
            '</div>';

    // Entwicklung: Liniendiagramm + Vergleich
    const verlauf = berechneScoreVerlauf(gruppe);
    const aktuell = verlauf[verlauf.length - 1].score;
    const vorher = verlauf.length > 1 ? verlauf[verlauf.length - 2].score : null;
    html += '<div class="karte"><h3>Entwicklung über die Zeit</h3><div class="diagramm">' + liniendiagramm(verlauf) + '</div>' +
            '<div class="raster" style="margin-top:12px">' +
            '<div class="kennzahl"><b>' + aktuell + '</b><span>Aktueller Score</span></div>' +
            '<div class="kennzahl"><b>' + (vorher === null ? "–" : vorher) + '</b><span>Vorheriger Score</span></div>' +
            '<div class="kennzahl"><b>' + veraenderungText(aktuell, vorher) + '</b><span>Veränderung</span></div></div>' +
            (vorher === null ? '<p class="klein-text" style="margin-top:10px">Ein Vergleich ist möglich, sobald es mehr als einen Messpunkt gibt.</p>' : '') +
            '</div>';
  }

  html += empfehlungenHtml(gruppe, erg.status);
  box.innerHTML = html;
}


/* ======================================================================
   ABSCHNITT H: Training (Übersicht und Schritt-für-Schritt-Erfassung)
   ====================================================================== */

function neuesTraining() {
  return { schritt: 0, gruppe: null, gewaehlt: [], eingaben: {}, datum: heutigesDatum(), fehler: [] };
}

function speicherWarnungHtml() {
  if (speicherFunktioniert) return "";
  return '<div class="hinweis warnung" style="margin-bottom:14px">Dein Browser erlaubt hier kein dauerhaftes Speichern. ' +
         'Die Daten bleiben nur bis zum Schließen dieser Seite erhalten.</div>';
}

// Übersicht: Trainingshäufigkeit, "Training starten", zuletzt absolvierte Einheiten
function trainingUebersichtHtml() {
  const alle = holeAlleEinheiten();
  const tage = zaehleTrainingstage(alle, heutigesDatum());
  const prozent = Math.min(tage / ZIEL_TRAININGSTAGE, 1) * 100;
  const gruppen = gruppiereEinheiten(alle).slice(0, 8);

  let html = speicherWarnungHtml();
  html += '<div class="karte"><h2>Trainingshäufigkeit</h2>' +
          '<div class="raster"><div class="kennzahl"><b>' + tage + '</b><span>Trainingstage in den letzten 30 Tagen</span></div>' +
          '<div class="kennzahl"><b>' + gruppiereEinheiten(alle).length + '</b><span>Trainingseinheiten insgesamt</span></div></div>' +
          '<div class="balken" style="margin-top:12px"><i style="width:' + prozent + '%"></i></div>' +
          '<p class="klein-text" style="margin-top:6px">Für die volle Punktzahl bei der Häufigkeit zählen ' + ZIEL_TRAININGSTAGE + ' Trainingstage in 30 Tagen.</p>' +
          '<button type="button" class="knopf primaer breit" style="margin-top:14px" data-aktion="training-starten">Training starten</button></div>';

  html += '<div class="karte"><h2>Zuletzt absolviert</h2>';
  if (gruppen.length === 0) {
    html += '<div class="platzhalter">Noch keine Trainingseinheiten.<br>Tippe auf „Training starten“, um deine erste Einheit zu erfassen.</div>';
  } else {
    for (let i = 0; i < gruppen.length; i++) {
      const g = gruppen[i];
      const ids = [];
      let zeilen = "";
      for (let j = 0; j < g.eintraege.length; j++) {
        const e = g.eintraege[j];
        ids.push(e.id);
        zeilen += '<div class="klein-text">' + esc(e.uebung) + ' · ' + e.saetze + ' × ' + e.wiederholungen + ' · ' + zahl(e.gewicht) + ' kg</div>';
      }
      html += '<div class="liste-eintrag"><div><b>' + esc(g.muskelgruppe) + '</b>' +
              '<div class="klein-text">' + esc(formatDatum(g.datum)) + '</div>' + zeilen + '</div>' +
              '<button type="button" class="knopf klein gefahr" data-aktion="einheit-loeschen" data-wert="' + ids.join(",") + '">Löschen</button></div>';
    }
  }
  return html + '</div>';
}

// Beschreibung einer Katalogübung (oder null bei eigenen Übungen)
function katalogBeschreibung(gruppe, name) {
  for (let i = 0; i < uebungskatalog[gruppe].length; i++) {
    if (uebungskatalog[gruppe][i].name === name) return uebungskatalog[gruppe][i].beschreibung;
  }
  return null;
}

function fehlerListeHtml(fehler) {
  if (fehler.length === 0) return "";
  let html = '<div class="hinweis fehler" style="margin-top:12px"><ul class="fehlerliste">';
  for (let i = 0; i < fehler.length; i++) html += '<li>' + esc(fehler[i]) + '</li>';
  return html + '</ul></div>';
}

// Die vier Schritte der Erfassung
function wizardHtml() {
  const t = zustand.training;
  const titel = ["", "Muskelgruppe auswählen", "Übungen hinzufügen", "Details eingeben", "Training speichern"];

  let html = '<div class="karte"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px">' +
             '<h2 style="margin:0">Neues Training</h2>' +
             '<button type="button" class="knopf klein" data-aktion="training-abbrechen">Abbrechen</button></div>';
  html += '<div class="schritte" aria-hidden="true">';
  for (let s = 1; s <= 4; s++) {
    html += '<i class="' + (s < t.schritt ? "fertig" : (s === t.schritt ? "aktiv" : "")) + '"></i>';
  }
  html += '</div><p class="untertitel" style="margin-bottom:12px">Schritt ' + t.schritt + ' von 4: ' + titel[t.schritt] + '</p>';

  // ---- Schritt 1: Muskelgruppe ----
  if (t.schritt === 1) {
    const status = berechneAlleStatus();
    html += '<div class="gruppen-raster">';
    for (let i = 0; i < MUSKELGRUPPEN.length; i++) {
      const g = MUSKELGRUPPEN[i];
      html += '<button type="button" class="gruppen-knopf ' + STATUS_KLASSE[status[g].status] + (t.gruppe === g ? " gewaehlt" : "") +
              '" data-aktion="gruppe-waehlen" data-wert="' + esc(g) + '"><i></i>' + esc(g) + '</button>';
    }
    html += '</div>';
  }

  // ---- Schritt 2: Übungen ----
  if (t.schritt === 2) {
    const namen = holeUebungsnamen(t.gruppe);
    const eigene = holeEigeneUebungen(t.gruppe);
    html += '<h3>Übungen für ' + esc(t.gruppe) + '</h3>';
    for (let i = 0; i < namen.length; i++) {
      const name = namen[i];
      const gewaehlt = t.gewaehlt.indexOf(name) !== -1;
      const beschreibung = katalogBeschreibung(t.gruppe, name);
      const istEigene = eigene.indexOf(name) !== -1;
      html += '<div class="wahl-eintrag' + (gewaehlt ? " gewaehlt" : "") + '"><div><b>' + esc(name) + '</b>' +
              '<div class="klein-text">' + (beschreibung ? esc(beschreibung) : 'Eigene Übung') + '</div></div>' +
              '<div style="display:flex;gap:6px;flex:none">' +
              (istEigene ? '<button type="button" class="knopf klein gefahr" data-aktion="eigene-loeschen" data-wert="' + esc(name) + '" aria-label="Eigene Übung löschen">✕</button>' : '') +
              '<button type="button" class="knopf klein' + (gewaehlt ? "" : " primaer") + '" data-aktion="uebung-toggle" data-wert="' + esc(name) + '">' +
              (gewaehlt ? "Entfernen" : "Hinzufügen") + '</button></div></div>';
    }
    html += '<h3 style="margin-top:16px">Eigene Übung erstellen</h3>' +
            '<label class="feld"><span>Name der Übung</span><input type="text" id="eigene-uebung" maxlength="40" placeholder="z. B. Kabelzug-Fly"></label>' +
            '<button type="button" class="knopf breit" data-aktion="eigene-anlegen">Speichern und hinzufügen</button>';
  }

  // ---- Schritt 3: Sätze, Wiederholungen, Gewicht ----
  if (t.schritt === 3) {
    for (let i = 0; i < t.gewaehlt.length; i++) {
      const name = t.gewaehlt[i];
      const e = t.eingaben[name] || {};
      html += '<div class="wahl-eintrag" style="display:block"><b>' + esc(name) + '</b><div class="feld-reihe" style="margin-top:8px">' +
              '<label class="feld" style="margin:0"><span>Sätze</span><input type="number" inputmode="numeric" min="1" step="1" data-feld="saetze" data-uebung="' + esc(name) + '" value="' + esc(e.saetze || "") + '"></label>' +
              '<label class="feld" style="margin:0"><span>Wiederholungen</span><input type="number" inputmode="numeric" min="1" step="1" data-feld="wiederholungen" data-uebung="' + esc(name) + '" value="' + esc(e.wiederholungen || "") + '"></label>' +
              '<label class="feld" style="margin:0"><span>Gewicht (kg)</span><input type="number" inputmode="decimal" min="0" step="0.5" data-feld="gewicht" data-uebung="' + esc(name) + '" value="' + esc(e.gewicht || "") + '"></label>' +
              '</div></div>';
    }
    html += '<label class="feld" style="margin-top:12px"><span>Datum</span><input type="date" data-feld="datum" max="' + heutigesDatum() + '" value="' + esc(t.datum) + '"></label>' +
            '<p class="klein-text">Gewicht 0 ist erlaubt, z. B. bei Liegestützen oder Plank.</p>';
  }

  // ---- Schritt 4: Zusammenfassung ----
  if (t.schritt === 4) {
    html += '<div class="hinweis"><b>' + esc(t.gruppe) + '</b> · ' + esc(formatDatum(t.datum)) + '</div><div style="margin-top:10px">';
    for (let i = 0; i < t.gewaehlt.length; i++) {
      const name = t.gewaehlt[i];
      const e = t.eingaben[name];
      html += '<div class="liste-eintrag"><div><b>' + esc(name) + '</b><div class="klein-text">' +
              esc(e.saetze) + ' Sätze × ' + esc(e.wiederholungen) + ' Wiederholungen · ' + esc(e.gewicht) + ' kg</div></div></div>';
    }
    html += '</div>';
  }

  html += fehlerListeHtml(t.fehler);

  // Knöpfe unten
  html += '<div class="knopf-zeile">';
  if (t.schritt > 1) html += '<button type="button" class="knopf" data-aktion="schritt-zurueck">Zurück</button>';
  if (t.schritt < 4) {
    html += '<button type="button" class="knopf primaer" data-aktion="schritt-weiter">Weiter</button>';
  } else {
    html += '<button type="button" class="knopf primaer" data-aktion="training-speichern">Training speichern</button>';
  }
  return html + '</div></div>';
}

function renderTraining() {
  const t = zustand.training;
  $("training-inhalt").innerHTML = (t.schritt === 0) ? trainingUebersichtHtml() : wizardHtml();
}

function startTraining(gruppe) {
  zustand.training = neuesTraining();
  if (gruppe) {
    zustand.training.gruppe = gruppe;
    zustand.training.schritt = 2;          // Muskelgruppe ist schon bekannt
  } else {
    zustand.training.schritt = 1;
  }
  renderTraining();
}

// "Weiter": Eingaben des aktuellen Schritts prüfen
function schrittWeiter() {
  const t = zustand.training;
  t.fehler = [];
  if (t.schritt === 1 && !t.gruppe) {
    t.fehler.push("Bitte wähle eine Muskelgruppe aus.");
  } else if (t.schritt === 2 && t.gewaehlt.length === 0) {
    t.fehler.push("Bitte füge mindestens eine Übung hinzu.");
  } else if (t.schritt === 3) {
    for (let i = 0; i < t.gewaehlt.length; i++) {
      const name = t.gewaehlt[i];
      const e = t.eingaben[name] || {};
      const ergebnis = pruefeEinheit({ muskelgruppe: t.gruppe, uebung: name, gewicht: e.gewicht,
                                       wiederholungen: e.wiederholungen, saetze: e.saetze, datum: t.datum });
      if (!ergebnis.ok) t.fehler.push(name + ": " + ergebnis.fehler);
    }
  }
  if (t.fehler.length === 0) t.schritt = t.schritt + 1;
  renderTraining();
}

function speichereTraining() {
  const t = zustand.training;
  const liste = [];
  for (let i = 0; i < t.gewaehlt.length; i++) {
    const name = t.gewaehlt[i];
    const e = t.eingaben[name];
    liste.push({ muskelgruppe: t.gruppe, uebung: name, gewicht: e.gewicht, wiederholungen: e.wiederholungen, saetze: e.saetze, datum: t.datum });
  }
  const ergebnis = fuegeTrainingseinheitenHinzu(liste);
  if (!ergebnis.ok) {
    t.fehler = [ergebnis.fehler];
    renderTraining();
    return;
  }
  // Zurück zur Übersicht; Scores, Farben und Statistiken werden neu berechnet
  zustand.training = neuesTraining();
  renderAlles();
  zeigeToast("Training gespeichert. Scores wurden aktualisiert.");
}


/* ======================================================================
   ABSCHNITT I: Statistiken
   ====================================================================== */

function renderStatistik() {
  const box = $("statistik-inhalt");
  const alle = holeAlleEinheiten();
  if (alle.length === 0) {
    box.innerHTML = '<div class="karte"><div class="platzhalter">Noch keine Daten.<br>Speichere dein erstes Training, um Statistiken zu sehen.</div>' +
                    '<button type="button" class="knopf primaer breit" data-aktion="training-starten">Training starten</button></div>';
    return;
  }

  const heute = heutigesDatum();
  const zeitraum = zustand.statistik.zeitraum;                       // 7, 30, 90 oder 0 (alles)
  const start = zeitraum > 0 ? datumVorTagen(heute, zeitraum - 1) : "0000-01-01";
  const imZeitraum = [];
  for (let i = 0; i < alle.length; i++) {
    if (alle[i].datum >= start) imZeitraum.push(alle[i]);
  }
  const tageImZeitraum = zaehleVerschiedeneTage(imZeitraum);

  // Zeitraum wählen
  const optionen = [[7, "7 Tage"], [30, "30 Tage"], [90, "90 Tage"], [0, "Gesamt"]];
  let html = '<div style="margin-bottom:14px"><div class="segment" role="group" aria-label="Zeitraum wählen">';
  for (let i = 0; i < optionen.length; i++) {
    html += '<button type="button" data-aktion="zeitraum" data-wert="' + optionen[i][0] + '"' +
            (optionen[i][0] === zeitraum ? ' class="aktiv"' : '') + '>' + optionen[i][1] + '</button>';
  }
  html += '</div></div>';

  // Kennzahlen
  html += '<div class="karte"><h2>Überblick</h2><div class="raster">' +
          '<div class="kennzahl"><b>' + gruppiereEinheiten(imZeitraum).length + '</b><span>Trainingseinheiten im Zeitraum</span></div>' +
          '<div class="kennzahl"><b>' + tageImZeitraum + '</b><span>Trainingstage im Zeitraum</span></div>' +
          '<div class="kennzahl"><b>' + imZeitraum.length + '</b><span>erfasste Übungen</span></div>' +
          '<div class="kennzahl"><b>' + zaehleTrainingstage(alle, heute) + ' / ' + ZIEL_TRAININGSTAGE + '</b><span>Trainingshäufigkeit (30 Tage)</span></div>' +
          '</div></div>';

  // Scores aller Muskelgruppen und Fortschritt im Zeitraum
  const status = berechneAlleStatus();
  const gewicht = holeKoerpergewicht();
  const vorTag = datumVorTagen(start, 1);
  html += '<div class="karte"><h2>Scores der Muskelgruppen</h2>' +
          (zeitraum > 0 ? '<p class="klein-text" style="margin-bottom:8px">Rechts: Veränderung seit Beginn des Zeitraums</p>' : '');
  for (let i = 0; i < MUSKELGRUPPEN.length; i++) {
    const g = MUSKELGRUPPEN[i];
    const jetzt = status[g].score;
    let aenderung = "–";
    let aenderungKlasse = "";
    if (zeitraum > 0 && jetzt > 0) {
      const frueher = [];
      const gruppenListe = einheitenDerGruppe(alle, g);
      for (let j = 0; j < gruppenListe.length; j++) {
        if (gruppenListe[j].datum <= vorTag) frueher.push(gruppenListe[j]);
      }
      const vorher = berechneMuskelgruppe(frueher, gewicht, vorTag).score;
      const diff = jetzt - vorher;
      aenderung = (diff > 0 ? "+" : "") + diff;
      aenderungKlasse = diff > 0 ? "plus" : (diff < 0 ? "minus" : "");
    }
    html += '<div class="score-zeile ' + STATUS_KLASSE[status[g].status] + '"><span>' + esc(g) + '</span>' +
            '<div class="score-balken"><i style="width:' + jetzt + '%"></i></div>' +
            '<span class="score-wert">' + jetzt + ' <span class="' + aenderungKlasse + '">(' + aenderung + ')</span></span></div>';
  }
  html += '</div>';

  // Entwicklung einer Muskelgruppe als Liniendiagramm
  if (zustand.statistik.gruppe === null) {
    for (let i = 0; i < MUSKELGRUPPEN.length; i++) {
      if (einheitenDerGruppe(alle, MUSKELGRUPPEN[i]).length > 0) { zustand.statistik.gruppe = MUSKELGRUPPEN[i]; break; }
    }
  }
  const gewaehlt = zustand.statistik.gruppe;
  html += '<div class="karte"><h2>Entwicklung der Scores</h2><label class="feld"><span>Muskelgruppe</span><select data-feld="statistik-gruppe">';
  for (let i = 0; i < MUSKELGRUPPEN.length; i++) {
    html += '<option value="' + esc(MUSKELGRUPPEN[i]) + '"' + (MUSKELGRUPPEN[i] === gewaehlt ? " selected" : "") + '>' + esc(MUSKELGRUPPEN[i]) + '</option>';
  }
  html += '</select></label>';
  const verlauf = [];
  const voll = berechneScoreVerlauf(gewaehlt);
  for (let i = 0; i < voll.length; i++) {
    if (voll[i].datum >= start) verlauf.push(voll[i]);
  }
  if (verlauf.length === 0) {
    html += '<div class="platzhalter">Noch keine Daten für ' + esc(gewaehlt) + ' im gewählten Zeitraum.</div>';
  } else {
    html += '<div class="diagramm">' + liniendiagramm(verlauf) + '</div>';
  }
  box.innerHTML = html + '</div>';
}

// Anzahl verschiedener Tage in einer Liste von Einheiten
function zaehleVerschiedeneTage(einheiten) {
  const gesehen = {};
  let anzahl = 0;
  for (let i = 0; i < einheiten.length; i++) {
    if (!gesehen[einheiten[i].datum]) { gesehen[einheiten[i].datum] = true; anzahl++; }
  }
  return anzahl;
}


/* ======================================================================
   ABSCHNITT J: Ernährung (nutzt die bestehende Funktion berechneErnaehrung)
   ====================================================================== */

const ZIEL_REIHENFOLGE = ["Abnehmen", "Muskelaufbau", "Zunehmen", "Gewicht halten"];

function ergebnisHtml() {
  const e = zustand.ernaehrung;
  if (e === null) return "";
  if (!e.ok) return '<div class="hinweis fehler" style="margin-top:14px">' + esc(e.fehler) + '</div>';
  return '<div class="ergebnis-raster"><div class="ergebnis"><b>' + zahl(e.kalorien, 0) + ' kcal</b><span>Täglicher Kalorienbedarf</span></div>' +
         '<div class="ergebnis"><b>' + zahl(e.protein, 0) + ' g</b><span>Täglicher Proteinbedarf</span></div></div>' +
         '<p class="klein-text" style="margin-top:12px">Richtwerte nach einer vereinfachten Projektformel – keine individuelle medizinische Beratung.</p>';
}

function renderErnaehrung() {
  const alle = holeAlleEinheiten();
  const anzahlHeute = zaehleUebungenAmTag(alle, heutigesDatum());
  const gewicht = holeKoerpergewicht();
  const ziel = holeEinstellungen().trainingsziel;

  let optionen = "";
  for (let i = 0; i < ZIEL_REIHENFOLGE.length; i++) {
    optionen += '<option' + (ZIEL_REIHENFOLGE[i] === ziel ? " selected" : "") + '>' + ZIEL_REIHENFOLGE[i] + '</option>';
  }
  const vorschlag = Math.min(anzahlHeute, 8);

  $("ernaehrung-inhalt").innerHTML =
    '<div class="karte"><h2>Kalorien- und Proteinbedarf</h2>' +
    '<p class="untertitel">Berechne deinen täglichen Bedarf passend zu deinem Trainingsziel.</p>' +
    '<label class="feld"><span>Körpergewicht (kg)</span><input type="number" inputmode="decimal" id="ern-gewicht" min="1" step="0.1" value="' + (gewicht === null ? "" : gewicht) + '" placeholder="z. B. 70"></label>' +
    '<label class="feld"><span>Trainingsziel</span><select id="ern-ziel">' + optionen + '</select></label>' +
    '<label class="feld"><span>Trainingsaktivität: Übungen heute (0–8)</span><input type="number" inputmode="numeric" id="ern-uebungen" min="0" max="8" step="1" value="' + vorschlag + '"></label>' +
    '<p class="klein-text" style="margin:-4px 0 14px">Aus deinem heutigen Training übernommen: ' + anzahlHeute + ' Übung(en), Aktivität „' +
    bestimmeAktivitaetslevel(anzahlHeute) + '“. Du kannst den Wert ändern.' + (anzahlHeute > 8 ? ' Mehr als 8 Übungen zählen wie 8.' : '') + '</p>' +
    '<button type="button" class="knopf primaer breit" data-aktion="ernaehrung-berechnen">Berechnen</button>' +
    '<div id="ern-ergebnis">' + ergebnisHtml() + '</div></div>';
}

function berechneErnaehrungAusFormular() {
  const gewichtText = $("ern-gewicht").value.trim();
  const uebungenText = $("ern-uebungen").value.trim();
  const ziel = $("ern-ziel").value;
  // Leere Felder werden als ungültig (NaN) übergeben, damit berechneErnaehrung die Fehlermeldung liefert
  const ergebnis = berechneErnaehrung(gewichtText === "" ? NaN : Number(gewichtText),
                                      uebungenText === "" ? NaN : Number(uebungenText), ziel);
  zustand.ernaehrung = ergebnis;
  if (ergebnis.ok) {
    speichereKoerpergewicht(Number(gewichtText));       // Körpergewicht im Profil merken
    const einst = ladeWert(SCHLUESSEL.einstellungen, {});
    einst.trainingsziel = ziel;
    speichereWert(SCHLUESSEL.einstellungen, einst);
    renderFiguren();                                     // Gewicht beeinflusst die relative Leistung
  }
  $("ern-ergebnis").innerHTML = ergebnisHtml();
}


/* ======================================================================
   ABSCHNITT K: Mehr (Profil, Angaben, Einstellungen, Info)
   ====================================================================== */

function renderMehr() {
  const angaben = holeAngaben();
  const einst = holeEinstellungen();
  const gewicht = holeKoerpergewicht();
  const initial = angaben.name ? angaben.name.trim().charAt(0).toUpperCase() : "M";

  let zielOptionen = "";
  for (let i = 0; i < ZIEL_REIHENFOLGE.length; i++) {
    zielOptionen += '<option' + (ZIEL_REIHENFOLGE[i] === einst.trainingsziel ? " selected" : "") + '>' + ZIEL_REIHENFOLGE[i] + '</option>';
  }

  $("mehr-inhalt").innerHTML =
    speicherWarnungHtml() +
    '<div class="karte"><div class="profil-zeile"><div class="avatar">' + esc(initial) + '</div><div>' +
    '<h2 style="margin:0">' + esc(angaben.name || "Dein Profil") + '</h2><p class="klein-text">Persönliches Profil</p></div></div></div>' +

    '<div class="karte"><h2>Persönliche Angaben</h2>' +
    '<label class="feld"><span>Name</span><input type="text" id="m-name" maxlength="40" value="' + esc(angaben.name) + '"></label>' +
    '<div class="feld-reihe">' +
    '<label class="feld"><span>Alter</span><input type="number" inputmode="numeric" id="m-alter" min="1" step="1" value="' + esc(angaben.alter) + '"></label>' +
    '<label class="feld"><span>Größe (cm)</span><input type="number" inputmode="decimal" id="m-groesse" min="1" value="' + esc(angaben.groesse) + '"></label>' +
    '<label class="feld"><span>Gewicht (kg)</span><input type="number" inputmode="decimal" id="m-gewicht" min="1" step="0.1" value="' + (gewicht === null ? "" : gewicht) + '"></label></div>' +
    '<div id="m-meldung"></div>' +
    '<button type="button" class="knopf primaer breit" data-aktion="angaben-speichern">Angaben speichern</button></div>' +

    '<div class="karte"><h2>Einstellungen</h2>' +
    '<label class="feld"><span>Standard-Körperansicht</span><select id="m-ansicht"><option value="mann"' + (einst.koerper === "mann" ? " selected" : "") +
    '>Mann</option><option value="frau"' + (einst.koerper === "frau" ? " selected" : "") + '>Frau</option></select></label>' +
    '<label class="feld"><span>Trainingsziel (für Übungsempfehlungen)</span><select id="m-ziel">' + zielOptionen + '</select></label>' +
    '<button type="button" class="knopf primaer breit" data-aktion="einstellungen-speichern">Einstellungen speichern</button>' +
    '<button type="button" class="knopf gefahr breit" style="margin-top:10px" data-aktion="daten-loeschen">Alle Daten löschen</button></div>' +

    '<div class="karte"><h2>Über mamu</h2>' +
    '<p style="margin-bottom:8px">mamu ist eine Fitness- und Ernährungsanwendung: Du dokumentierst dein Training, verfolgst deine Muskelgruppen auf der Körperansicht, ' +
    'erhältst passende Übungen und berechnest deinen Kalorien- und Proteinbedarf.</p>' +
    '<p class="klein-text">Die Statusstufen Starter, Rising, Advanced und Elite sind eine interne Bewertung von mamu und keine allgemeingültige sportliche Bewertung. ' +
    'Trainings- und Ernährungswerte sind vereinfachte Projektvorgaben und keine individuell abgestimmten Pläne.</p>' +
    '<p class="klein-text" style="margin-top:8px">Version: Prototyp 1.0 · Ein Projekt der FH Technikum Wien</p></div>';
}

function speichereAngaben() {
  const name = $("m-name").value.trim();
  const alter = $("m-alter").value.trim();
  const groesse = $("m-groesse").value.trim();
  const gewicht = $("m-gewicht").value.trim();
  const fehler = [];
  if (alter !== "" && (!Number.isInteger(Number(alter)) || Number(alter) <= 0)) fehler.push("Das Alter muss eine ganze Zahl größer als 0 sein.");
  if (groesse !== "" && !(Number(groesse) > 0)) fehler.push("Die Größe muss eine Zahl größer als 0 sein.");
  if (gewicht !== "" && !(Number(gewicht) > 0)) fehler.push("Das Gewicht muss eine Zahl größer als 0 sein.");
  if (fehler.length > 0) {
    $("m-meldung").innerHTML = fehlerListeHtml(fehler) + '<div style="height:12px"></div>';
    return;
  }
  speichereWert(SCHLUESSEL.angaben, { name: name, alter: alter, groesse: groesse });
  if (gewicht !== "") speichereKoerpergewicht(Number(gewicht));
  renderAlles();
  zeigeToast("Angaben gespeichert.");
}

function speichereEinstellungen() {
  const einst = { koerper: $("m-ansicht").value, trainingsziel: $("m-ziel").value };
  speichereWert(SCHLUESSEL.einstellungen, einst);
  zustand.geschlecht = einst.koerper;
  renderAlles();
  zeigeToast("Einstellungen gespeichert.");
}

function loescheAlleDaten() {
  if (!window.confirm("Wirklich alle Daten löschen? Das kann nicht rückgängig gemacht werden.")) return;
  const schluessel = Object.keys(SCHLUESSEL);
  for (let i = 0; i < schluessel.length; i++) {
    const name = SCHLUESSEL[schluessel[i]];
    delete gedaechtnis[name];
    delete gesperrt[name];
    try { window.localStorage.removeItem(name); } catch (fehler) { /* nicht erreichbar */ }
  }
  zustand.auswahl = null;
  zustand.profilOffen = false;
  zustand.geschlecht = "mann";
  zustand.training = neuesTraining();
  zustand.statistik = { zeitraum: 30, gruppe: null };
  zustand.ernaehrung = null;
  renderAlles();
  zeigeToast("Alle Daten wurden gelöscht.");
}


/* ======================================================================
   ABSCHNITT L: Navigation, Ereignisse und Start
   ====================================================================== */

// Alles neu zeichnen (nach dem Speichern oder Ändern von Daten)
function renderAlles() {
  renderFiguren();
  renderProfil();
  renderTraining();
  renderStatistik();
  renderErnaehrung();
  renderMehr();
}

// Bereich wechseln (untere Navigationsleiste)
function zeigeSeite(name) {
  zustand.seite = name;
  zustand.profilOffen = false;           // Vollbild-Profil schließen
  if (name !== "koerper") zustand.auswahl = null;
  const seiten = document.querySelectorAll(".seite");
  for (let i = 0; i < seiten.length; i++) {
    seiten[i].classList.toggle("aktiv", seiten[i].id === "seite-" + name);
  }
  const knoepfe = document.querySelectorAll(".nav button");
  for (let j = 0; j < knoepfe.length; j++) {
    const aktiv = knoepfe[j].dataset.wert === name;
    knoepfe[j].classList.toggle("aktiv", aktiv);
    if (aktiv) knoepfe[j].setAttribute("aria-current", "page");
    else knoepfe[j].removeAttribute("aria-current");
  }
  renderAlles();                         // Daten sind immer aktuell
  window.scrollTo(0, 0);
}

// Alle Schaltflächen mit data-aktion laufen hier zusammen
function behandleAktion(aktion, wert, element) {
  const t = zustand.training;
  switch (aktion) {
    case "seite": zeigeSeite(wert); break;

    // Körper
    case "geschlecht": {
      zustand.geschlecht = wert;
      const einst = ladeWert(SCHLUESSEL.einstellungen, {});
      einst.koerper = wert;
      speichereWert(SCHLUESSEL.einstellungen, einst);
      renderFiguren();
      break;
    }
    case "ansicht": zustand.ansicht = wert; renderFiguren(); break;
    case "profil-zurueck": schliesseProfil(); break;
    case "erstes-training": {
      const gruppe = zustand.auswahl;
      zeigeSeite("training");
      startTraining(gruppe);
      break;
    }

    // Training
    case "training-starten": zeigeSeite("training"); startTraining(null); break;
    case "training-abbrechen": zustand.training = neuesTraining(); renderTraining(); break;
    case "gruppe-waehlen": t.gruppe = wert; t.gewaehlt = []; t.eingaben = {}; t.fehler = []; renderTraining(); break;
    case "schritt-weiter": schrittWeiter(); break;
    case "schritt-zurueck": t.fehler = []; t.schritt = t.schritt - 1; renderTraining(); break;
    case "uebung-toggle": {
      const position = t.gewaehlt.indexOf(wert);
      if (position === -1) t.gewaehlt.push(wert); else t.gewaehlt.splice(position, 1);
      t.fehler = [];
      renderTraining();
      break;
    }
    case "eigene-anlegen": {
      const ergebnis = speichereEigeneUebung(t.gruppe, $("eigene-uebung").value);
      if (ergebnis.ok) {
        t.gewaehlt.push(ergebnis.name);
        t.fehler = [];
        zeigeToast("Eigene Übung gespeichert.");
      } else {
        t.fehler = [ergebnis.fehler];
      }
      renderTraining();
      break;
    }
    case "eigene-loeschen": {
      loescheEigeneUebung(t.gruppe, wert);
      const position = t.gewaehlt.indexOf(wert);
      if (position !== -1) t.gewaehlt.splice(position, 1);
      renderTraining();
      break;
    }
    case "training-speichern": speichereTraining(); break;
    case "einheit-loeschen": {
      if (!window.confirm("Diese Trainingseinheit löschen?")) break;
      const ids = wert.split(",");
      for (let i = 0; i < ids.length; i++) loescheTrainingseinheit(Number(ids[i]));
      renderAlles();
      zeigeToast("Trainingseinheit gelöscht.");
      break;
    }

    // Statistik, Ernährung, Mehr
    case "zeitraum": zustand.statistik.zeitraum = Number(wert); renderStatistik(); break;
    case "ernaehrung-berechnen": berechneErnaehrungAusFormular(); break;
    case "angaben-speichern": speichereAngaben(); break;
    case "einstellungen-speichern": speichereEinstellungen(); break;
    case "daten-loeschen": loescheAlleDaten(); break;
  }
}

// Klicks (Muskelgruppen im Körperbild und alle Schaltflächen)
document.addEventListener("click", function (ereignis) {
  const muskel = ereignis.target.closest(".muskel");
  if (muskel) {
    klickMuskel(muskel.dataset.gruppe);
    return;
  }
  const element = ereignis.target.closest("[data-aktion]");
  if (element) {
    behandleAktion(element.dataset.aktion, element.dataset.wert, element);
  }
});

// Tastatur: Enter oder Leertaste wählt eine fokussierte Muskelgruppe
document.addEventListener("keydown", function (ereignis) {
  if (ereignis.key !== "Enter" && ereignis.key !== " ") return;
  const muskel = ereignis.target.closest ? ereignis.target.closest(".muskel") : null;
  if (muskel) {
    ereignis.preventDefault();
    klickMuskel(muskel.dataset.gruppe);
  }
});

// Eingaben im Trainings-Formular merken (ohne die Seite neu zu zeichnen)
document.addEventListener("input", function (ereignis) {
  const feld = ereignis.target.dataset ? ereignis.target.dataset.feld : null;
  if (!feld) return;
  const t = zustand.training;
  if (feld === "datum") {
    t.datum = ereignis.target.value;
  } else if (feld === "saetze" || feld === "wiederholungen" || feld === "gewicht") {
    const name = ereignis.target.dataset.uebung;
    if (!t.eingaben[name]) t.eingaben[name] = {};
    t.eingaben[name][feld] = ereignis.target.value;
  }
});

// Auswahlfeld in der Statistik
document.addEventListener("change", function (ereignis) {
  if (ereignis.target.dataset && ereignis.target.dataset.feld === "statistik-gruppe") {
    zustand.statistik.gruppe = ereignis.target.value;
    renderStatistik();
  }
});

// Wischen zwischen Vorder- und Rückseite (nur Smartphone)
let wischStart = null;
$("wischbereich").addEventListener("touchstart", function (ereignis) {
  wischStart = { x: ereignis.touches[0].clientX, y: ereignis.touches[0].clientY };
}, { passive: true });
$("wischbereich").addEventListener("touchend", function (ereignis) {
  if (wischStart === null || window.innerWidth >= 700) { wischStart = null; return; }
  const ende = ereignis.changedTouches[0];
  const dx = ende.clientX - wischStart.x;
  const dy = ende.clientY - wischStart.y;
  wischStart = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0 && zustand.ansicht === "vorne") { zustand.ansicht = "hinten"; renderFiguren(); }
    if (dx > 0 && zustand.ansicht === "hinten") { zustand.ansicht = "vorne"; renderFiguren(); }
  }
}, { passive: true });

// ----- Start der App -----
// Beim Öffnen: immer Vorderseite, keine Muskelgruppe ausgewählt
zustand.geschlecht = holeEinstellungen().koerper;
zustand.training = neuesTraining();
renderAlles();
</script>
