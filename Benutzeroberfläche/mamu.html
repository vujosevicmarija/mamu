<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Kein Zoomen: Die Körperansicht hat eine feste Größe (Anforderung des Projekts) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>mamu – Fitness &amp; Ernährung</title>
<style>
/* ======================================================================
   mamu – Gestaltung (CSS)
   Weißer Hintergrund, Salbeigrün als Akzent, abgerundete Karten.
   Alle Farben stehen oben als Variablen, damit man sie leicht ändern kann.
   ====================================================================== */
:root {
  --hintergrund: #ffffff;
  --beige: #f6f2ec;
  --linie: #e4dfd6;
  --text: #1f2a24;
  --text-leise: #5b6560;
  --salbei: #7fa086;
  --salbei-dunkel: #46664e;
  --salbei-hell: #eaf1ec;
  --fehler: #b3261e;
  --fehler-hell: #fdecea;
  --radius: 16px;
  --nav-hoehe: 68px;
  /* Statusfarben der Muskelgruppen */
  --status-inactive: #ffffff;
  --status-starter: #e8837c;
  --status-rising: #f2b36a;
  --status-advanced: #efd668;
  --status-elite: #7fc592;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--hintergrund);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  padding-bottom: calc(var(--nav-hoehe) + env(safe-area-inset-bottom));
  touch-action: pan-y;
}
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5rem; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .5rem; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.nur-lesegeraet { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.leise { color: var(--text-leise); font-size: .9rem; }
.skip-link { position: absolute; left: 8px; top: -60px; background: var(--salbei-dunkel); color: #fff; padding: 10px 14px; border-radius: 10px; z-index: 100; }
.skip-link:focus { top: 8px; }

/* Sichtbarer Tastaturfokus */
:focus-visible { outline: 3px solid var(--salbei-dunkel); outline-offset: 2px; }

/* ---------- Seitenaufbau ---------- */
.bereich { padding: 16px 16px 24px; max-width: 760px; margin: 0 auto; }
.bereich.breit { max-width: 1040px; }
.seite-kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.seite-kopf h1 { margin: 0; }
.karte { background: #fff; border: 1px solid var(--linie); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(31, 42, 36, .04); }
.karte.beige { background: var(--beige); border-color: transparent; }
.karte h2 { margin-bottom: 10px; }
.leer-zustand { text-align: center; padding: 22px 12px; }
.leer-zustand p { color: var(--text-leise); }

/* ---------- Schaltflächen ---------- */
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--salbei-dunkel); background: #fff; color: var(--salbei-dunkel); font-weight: 600; cursor: pointer; }
.knopf:hover { background: var(--salbei-hell); }
.knopf.primaer { background: var(--salbei-dunkel); color: #fff; }
.knopf.primaer:hover { background: #3a5841; }
.knopf.gefahr { border-color: var(--fehler); color: var(--fehler); }
.knopf.gefahr:hover { background: var(--fehler-hell); }
.knopf.breit { width: 100%; }
.knopf[disabled] { opacity: .55; cursor: not-allowed; }
.knopf.klein { min-height: 36px; padding: 6px 14px; font-size: .9rem; }
.knopf-reihe { display: flex; gap: 10px; margin-top: 14px; }
.knopf-reihe .knopf { flex: 1; }
.rund { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; }

/* Umschalter (Mann/Frau, Vorne/Hinten) */
.segment { display: inline-flex; background: var(--beige); border-radius: 999px; padding: 3px; }
.segment button { border: 0; background: transparent; min-height: 40px; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--text-leise); }
.segment button[aria-pressed="true"] { background: var(--salbei-dunkel); color: #fff; }

/* ---------- Eingabefelder ---------- */
.feld { display: block; margin-bottom: 12px; }
.feld > .feld-name { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 4px; }
.feld .zusatz { font-weight: 400; color: var(--text-leise); }
.feld input, .feld select { width: 100%; min-height: 46px; padding: 10px 14px; border: 1.5px solid #cfc9bf; border-radius: 12px; background: #fff; }
.feld input:focus, .feld select:focus { border-color: var(--salbei-dunkel); }
.feld input.ungueltig { border-color: var(--fehler); background: var(--fehler-hell); }
.fehlertext { color: var(--fehler); font-size: .88rem; margin-top: 4px; min-height: 0; }
.fehlertext:empty { display: none; }
.hilfetext { color: var(--text-leise); font-size: .85rem; margin-top: 4px; }
.feld-reihe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.feld-reihe.zwei { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 520px) { .feld-reihe { grid-template-columns: 1fr; } .feld-reihe.zwei { grid-template-columns: 1fr 1fr; } }
.meldung { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: .92rem; }
.meldung.fehler { background: var(--fehler-hell); color: var(--fehler); }
.meldung.info { background: var(--salbei-hell); color: var(--salbei-dunkel); }
.meldung.warnung { background: #fff4de; color: #7a4b00; }

/* ---------- Untere Navigation ---------- */
.navleiste { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: #fff; border-top: 1px solid var(--linie); padding-bottom: env(safe-area-inset-bottom); }
.navleiste ul { list-style: none; margin: 0 auto; padding: 0; display: flex; max-width: 760px; }
.navleiste li { flex: 1; }
.navleiste button { width: 100%; height: var(--nav-hoehe); border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--text-leise); font-size: .75rem; font-weight: 600; }
.navleiste button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navleiste button[aria-current="page"] { color: var(--salbei-dunkel); }
.navleiste button[aria-current="page"] .nav-punkt { background: var(--salbei-hell); }
.nav-punkt { display: flex; padding: 4px 18px; border-radius: 999px; }

/* ---------- Körperansicht ---------- */
.koerper-layout { display: block; }
.koerper-bereich { display: flex; justify-content: center; gap: 24px; touch-action: pan-y; margin: 6px 0 10px; }
.koerper-seite { text-align: center; }
.seiten-name { font-weight: 600; color: var(--text-leise); font-size: .9rem; margin-bottom: 4px; }
.seiten-umschalter { display: none; margin-bottom: 6px; }
.koerper-svg { width: 230px; height: 511px; display: block; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.haut-umriss { fill: none; stroke: #b79b84; stroke-width: 3; stroke-linejoin: round; }
.haut-flaeche { stroke: none; }
.haut-umriss, .haut-flaeche { pointer-events: none; }
.muskel { cursor: pointer; outline: none; }
.muskel-form { stroke: #c9ad95; stroke-width: 1; stroke-linejoin: round; transition: filter .15s; }
.muskel-licht { pointer-events: none; stroke: none; }
.status-inactive .muskel-form { fill: var(--status-inactive); }
.status-starter .muskel-form { fill: var(--status-starter); }
.status-rising .muskel-form { fill: var(--status-rising); }
.status-advanced .muskel-form { fill: var(--status-advanced); }
.status-elite .muskel-form { fill: var(--status-elite); }
.muskel:hover .muskel-form { filter: brightness(.94); }
.muskel:focus-visible .muskel-form { stroke: #1d3a26; stroke-width: 2.2; }
.detail-linie { fill: none; stroke: #b79b84; stroke-width: .8; opacity: .6; stroke-linecap: round; pointer-events: none; }
.auswahl-rand { pointer-events: none; }
.auswahl-pfad { fill: none; stroke: #2b5a3a; stroke-width: 2.6; stroke-linejoin: round; }
.score-label { pointer-events: none; }
.score-label rect { fill: #fff; stroke: #2b5a3a; stroke-width: 1.4; }
.score-label text { font: 700 11px system-ui, sans-serif; fill: #1f4a2e; }
.legende { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; padding: 0; margin: 8px 0 6px; font-size: .85rem; }
.legende li { display: flex; align-items: center; gap: 6px; }
.farbpunkt { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #c9ad95; display: inline-block; }
.hinweis-mitte { text-align: center; }

@media (max-width: 699px) {
  .seiten-umschalter { display: inline-flex; }
  .koerper-haupt { text-align: center; }
  .koerper-bereich[data-aktiv="vorne"] .koerper-seite[data-seite="hinten"] { display: none; }
  .koerper-bereich[data-aktiv="hinten"] .koerper-seite[data-seite="vorne"] { display: none; }
  .koerper-bereich .seiten-name { display: none; }
}

/* ---------- Muskelprofil ---------- */
/* Handy: eigene Vollbildansicht über dem Inhalt (die Navigation bleibt sichtbar) */
.profil { display: none; }
.profil.offen { display: block; position: fixed; left: 0; right: 0; top: 0; bottom: calc(var(--nav-hoehe) + env(safe-area-inset-bottom)); background: #fff; z-index: 40; overflow-y: auto; padding: 16px; }
.profil-innen { max-width: 640px; margin: 0 auto; }
.profil-kopf { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.profil-kopf h2 { font-size: 1.5rem; margin: 0; }
.score-bereich { display: flex; align-items: center; gap: 16px; }
.ring { width: 110px; height: 110px; flex: none; }
.ring-hintergrund { fill: none; stroke: var(--beige); stroke-width: 10; }
.ring-wert { fill: none; stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring-zahl { font: 700 28px system-ui, sans-serif; fill: var(--text); text-anchor: middle; }
.ring-klein { font: 500 11px system-ui, sans-serif; fill: var(--text-leise); text-anchor: middle; }
.status-plakette { display: inline-block; padding: 4px 14px; border-radius: 999px; font-weight: 700; font-size: .9rem; border: 1px solid rgba(0,0,0,.12); }
.status-plakette.starter { background: var(--status-starter); }
.status-plakette.rising { background: var(--status-rising); }
.status-plakette.advanced { background: var(--status-advanced); }
.status-plakette.elite { background: var(--status-elite); }
.kennzahlen { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kennzahl { background: var(--beige); border-radius: 14px; padding: 12px; }
.kennzahl .name { font-size: .8rem; color: var(--text-leise); font-weight: 600; }
.kennzahl .wert { font-size: 1.15rem; font-weight: 700; }
.kennzahl .punkte { font-size: .8rem; color: var(--text-leise); }
.vergleich { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-top: 10px; }
.vergleich div { background: var(--beige); border-radius: 12px; padding: 8px 4px; }
.vergleich .name { font-size: .75rem; color: var(--text-leise); font-weight: 600; }
.vergleich .wert { font-weight: 700; font-size: 1.05rem; }
.diagramm { width: 100%; height: auto; display: block; max-width: 520px; margin: 0 auto; }
.diagramm .gitter { stroke: var(--linie); stroke-width: 1; }
.diagramm .linie { fill: none; stroke: var(--salbei-dunkel); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.diagramm .punkt { fill: #fff; stroke: var(--salbei-dunkel); stroke-width: 2; }
.diagramm .punkt.aktuell { fill: var(--salbei-dunkel); }
.diagramm text { font: 11px system-ui, sans-serif; fill: var(--text-leise); }
.empfehlungen { display: grid; gap: 10px; }
.uebungskarte { display: flex; gap: 12px; align-items: center; border: 1px solid var(--linie); border-radius: 14px; padding: 10px; }
.uebungsbild { width: 72px; height: 72px; flex: none; border-radius: 12px; background: var(--salbei-hell); display: flex; align-items: center; justify-content: center; }
.uebungsbild svg { width: 44px; height: 44px; stroke: var(--salbei-dunkel); fill: none; stroke-width: 2; stroke-linecap: round; }
.uebungskarte .titel { font-weight: 700; }
.uebungskarte .info { color: var(--text-leise); font-size: .85rem; }
.profil-leer { display: none; }
@media (min-width: 1000px) {
  .bereich.koerper { max-width: 1120px; }
  .koerper-layout { display: grid; grid-template-columns: minmax(520px, 1fr) minmax(360px, 460px); gap: 28px; align-items: start; }
  .profil, .profil.offen { display: block; position: static; padding: 0; overflow: visible; background: transparent; z-index: auto; }
  .profil-leer { display: block; border: 1.5px dashed var(--linie); border-radius: var(--radius); padding: 40px 20px; text-align: center; color: var(--text-leise); }
  .profil-innen { max-width: none; }
}

/* ---------- Training ---------- */
.schritte { display: flex; gap: 6px; margin-bottom: 14px; }
.schritte span { flex: 1; height: 6px; border-radius: 3px; background: var(--linie); }
.schritte span.fertig { background: var(--salbei); }
.schritte span.aktiv { background: var(--salbei-dunkel); }
.gruppenraster { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.gruppenknopf { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--linie); background: #fff; cursor: pointer; font-weight: 600; text-align: left; }
.gruppenknopf:hover { border-color: var(--salbei); }
.gruppenknopf[aria-pressed="true"] { border-color: var(--salbei-dunkel); background: var(--salbei-hell); }
.chip-liste { display: grid; gap: 8px; }
.chip { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1.5px solid var(--linie); border-radius: 14px; background: #fff; cursor: pointer; text-align: left; width: 100%; }
.chip[aria-pressed="true"] { border-color: var(--salbei-dunkel); background: var(--salbei-hell); }
.chip .haken { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #b9b3a8; flex: none; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.chip[aria-pressed="true"] .haken { background: var(--salbei-dunkel); border-color: var(--salbei-dunkel); }
.chip[aria-pressed="true"] .haken::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.chip .chip-name { font-weight: 700; display: block; }
.chip .chip-text { font-size: .85rem; color: var(--text-leise); display: block; }
.eingabe-uebung { border: 1px solid var(--linie); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.sitzung { border: 1px solid var(--linie); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.sitzung-kopf { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 6px; }
.sitzung ul { margin: 0; padding-left: 18px; font-size: .92rem; }
.kennzahl-zeile { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }

/* ---------- Statistik ---------- */
.balkenzeile { display: grid; grid-template-columns: 110px 1fr 74px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: .9rem; }
.balken { height: 14px; border-radius: 7px; background: var(--beige); overflow: hidden; }
.balken span { display: block; height: 100%; border-radius: 7px; }
.balkenzeile .aenderung { text-align: right; font-weight: 600; font-size: .85rem; }
.pos { color: #2f6b3f; } .neg { color: var(--fehler); }

/* ---------- Dialog und Hinweis ---------- */
dialog { border: 0; border-radius: var(--radius); padding: 20px; max-width: min(92vw, 420px); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(31, 42, 36, .45); }
dialog .knopf-reihe { margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-hoehe) + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--salbei-dunkel); color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 90; font-weight: 600; max-width: 90vw; text-align: center; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--salbei); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; flex: none; }
.profil-zeile { display: flex; align-items: center; gap: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<a class="skip-link" href="#inhalt">Zum Inhalt springen</a>

<main id="inhalt">

  <!-- Meldung beim Laden der Daten vom Server (nur sichtbar, solange geladen wird oder ein Fehler auftritt) -->
  <div id="server-status" class="bereich" role="status" aria-live="polite" hidden></div>

  <!-- ===== Bereich 1: Körper ===== -->
  <section id="bereich-koerper" class="bereich koerper" aria-labelledby="titel-koerper" data-bereich="koerper">
    <div class="koerper-layout">
      <div class="koerper-haupt">
        <header class="seite-kopf">
          <h1 id="titel-koerper" tabindex="-1">Körper</h1>
          <div class="segment" role="group" aria-label="Körperform">
            <button type="button" data-aktion="geschlecht" data-wert="mann" aria-pressed="true">Mann</button>
            <button type="button" data-aktion="geschlecht" data-wert="frau" aria-pressed="false">Frau</button>
          </div>
        </header>
        <div class="hinweis-mitte">
          <div class="segment seiten-umschalter" role="group" aria-label="Körperseite">
            <button type="button" data-aktion="seite" data-wert="vorne" aria-pressed="true">Vorne</button>
            <button type="button" data-aktion="seite" data-wert="hinten" aria-pressed="false">Hinten</button>
          </div>
        </div>
        <div id="koerper-bereich" class="koerper-bereich" data-aktiv="vorne">
          <div class="koerper-seite" data-seite="vorne"><p class="seiten-name">Vorderansicht</p><div class="svg-platz"></div></div>
          <div class="koerper-seite" data-seite="hinten"><p class="seiten-name">Rückansicht</p><div class="svg-platz"></div></div>
        </div>
        <ul id="legende" class="legende" aria-label="Legende der Statusfarben"></ul>
        <p class="leise hinweis-mitte">Tippe auf eine Muskelgruppe. Auf dem Handy wechselst du die Seite durch Wischen oder mit „Vorne / Hinten“.</p>
      </div>
      <aside id="profil" class="profil" aria-label="Muskelprofil"></aside>
    </div>
  </section>

  <!-- ===== Bereich 2: Training ===== -->
  <section id="bereich-training" class="bereich" aria-labelledby="titel-training" data-bereich="training" hidden>
    <header class="seite-kopf"><h1 id="titel-training" tabindex="-1">Training</h1></header>
    <div id="training-uebersicht"></div>
    <div id="training-wizard" hidden></div>
  </section>

  <!-- ===== Bereich 3: Statistiken ===== -->
  <section id="bereich-statistik" class="bereich" aria-labelledby="titel-statistik" data-bereich="statistik" hidden>
    <header class="seite-kopf"><h1 id="titel-statistik" tabindex="-1">Statistiken</h1></header>
    <div id="statistik-inhalt"></div>
  </section>

  <!-- ===== Bereich 4: Ernährung ===== -->
  <section id="bereich-ernaehrung" class="bereich" aria-labelledby="titel-ernaehrung" data-bereich="ernaehrung" hidden>
    <header class="seite-kopf"><h1 id="titel-ernaehrung" tabindex="-1">Ernährung</h1></header>
    <div id="ernaehrung-inhalt"></div>
  </section>

  <!-- ===== Bereich 5: Mehr ===== -->
  <section id="bereich-mehr" class="bereich" aria-labelledby="titel-mehr" data-bereich="mehr" hidden>
    <header class="seite-kopf"><h1 id="titel-mehr" tabindex="-1">Mehr</h1></header>
    <div id="mehr-inhalt"></div>
  </section>

</main>

<!-- Dauerhaft sichtbare Navigation -->
<nav class="navleiste" aria-label="Hauptnavigation">
  <ul>
    <li><button type="button" data-aktion="bereich" data-wert="koerper" aria-current="page"><span class="nav-punkt"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2.3"/><path d="M12 8v6M7 9.5l5-1.5 5 1.5M9 21l3-7 3 7"/></svg></span>Körper</button></li>
    <li><button type="button" data-aktion="bereich" data-wert="training"><span class="nav-punkt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg></span>Training</button></li>
    <li><button type="button" data-aktion="bereich" data-wert="statistik"><span class="nav-punkt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></span>Statistiken</button></li>
    <li><button type="button" data-aktion="bereich" data-wert="ernaehrung"><span class="nav-punkt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-2-6-1-6 3 0 5 3 10 6 10s6-5 6-10c0-4-4-5-6-3zM12 6c0-2 1-3 3-3"/></svg></span>Ernährung</button></li>

<script>
"use strict";

/* ======================================================================
   A. BESTEHENDE ALGORITHMEN – UNVERÄNDERT
   Diese Funktionen stammen aus ernaehrung.js, uebungsempfehlung.js und berechnung.js.
   ====================================================================== */
// ===== Ernährung (unverändert aus ernaehrung.js) =====
function berechneErnaehrung(gewicht, anzahlUebungen, ziel) {
    // Eingaben prüfen
    if (typeof gewicht !== "number" || isNaN(gewicht) || gewicht <= 0) {
        return { ok: false, fehler: "Bitte ein gültiges Gewicht größer als 0 eingeben." };
    }
    if (!Number.isInteger(anzahlUebungen) || anzahlUebungen < 0 || anzahlUebungen > 8) {
        return { ok: false, fehler: "Die Anzahl der Übungen muss eine ganze Zahl zwischen 0 und 8 sein." };
    }

    // Ziel vereinheitlichen (Groß-/Kleinschreibung egal)
    const zielKlein = String(ziel).trim().toLowerCase();

    // Aktivitätslevel bestimmen
    let AK, AP;
    if (anzahlUebungen <= 2) {
        AK = 1.0; AP = 1.0;
    } else if (anzahlUebungen <= 5) {
        AK = 1.1; AP = 1.5;
    } else {
        AK = 1.2; AP = 2.0;
    }

    // Muskelaufbau verwendet immer AP = 2
    if (zielKlein === "muskelaufbau") {
        AP = 2.0;
    }

    // Kalorienbedarf je nach Ziel
    const grundbedarf = gewicht * 30 * AK;
    let kalorien;

    switch (zielKlein) {
        case "gewicht halten": kalorien = grundbedarf; break;
        case "zunehmen":       kalorien = grundbedarf + 400; break;
        case "abnehmen":       kalorien = grundbedarf - 300; break;
        case "muskelaufbau":   kalorien = grundbedarf + 300; break;
        default:
            return { ok: false, fehler: "Ungültiges Ziel. Erlaubt: Zunehmen, Abnehmen, Muskelaufbau, Gewicht halten." };
    }

    const protein = gewicht * AP;

    return {
        ok: true,
        kalorien: Math.round(kalorien),
        protein: Math.round(protein)
    };
}

// ===== Übungsauswahl (unverändert aus uebungsempfehlung.js; nur der Katalogeintrag der entfernten Gruppe fehlt) =====
// ============================================================
// Übungsauswahl für die mamu-App
// Eingaben: Muskelgruppe, Trainingsziel, Trainingsstatus
// Ausgabe: genau 3 Übungen mit Sätzen und Wiederholungen
// ============================================================

// ---------- 1. Übungskatalog ----------
const uebungskatalog = {
  "Schultern": [

  ],

  ],

    { name: "Shrugs", beschreibung: "Die Schultern mit oder ohne Hanteln kontrolliert in Richtung Ohren anheben." },
    { name: "Nackenstreckung", beschreibung: "Den Kopf gegen einen sehr leichten Widerstand kontrolliert nach hinten bewegen." },
    { name: "Nackenbeugung", beschreibung: "Den Kopf gegen einen sehr leichten Widerstand kontrolliert nach vorne bewegen." }
  ],
  "Rücken": [
    { name: "Lat Pulldown", beschreibung: "Eine Stange kontrolliert von oben in Richtung Brust ziehen." },
    { name: "Rudern", beschreibung: "Ein Gewicht kontrolliert in Richtung Bauch ziehen und die Schulterblätter zusammenführen." },
    { name: "Rückenstrecker", beschreibung: "Den Oberkörper aus einer nach vorne geneigten Position kontrolliert aufrichten." }
  ],
  "Trizeps": [
    { name: "Trizepsdrücken", beschreibung: "Ein Seil oder eine Stange am Kabelzug durch Strecken der Ellenbogen nach unten drücken." },
    { name: "Dips", beschreibung: "Den Körper mit den Armen absenken und wieder nach oben drücken." },
    { name: "Overhead Extensions", beschreibung: "Ein Gewicht hinter dem Kopf durch Strecken der Ellenbogen nach oben bewegen." }
  ],
  "Gesäß": [
    { name: "Hip Thrust", beschreibung: "Die Hüfte mit einer Hantel oder Langhantel kontrolliert nach oben drücken." },
    { name: "Romanian Deadlift", beschreibung: "Die Hüfte nach hinten schieben und das Gewicht mit leicht gebeugten Knien kontrolliert absenken." },
    { name: "Glute Bridge", beschreibung: "Das Becken aus der Rückenlage durch Anspannen der Gesäßmuskulatur anheben." }
  ]
};

// ---------- 2. Das Trainingsziel bestimmt die Wiederholungen ----------
const trainingsziele = {
  "Muskelaufbau":   { wiederholungen: "8–12",  zweck: "Muskelwachstum fördern" },
  "Abnehmen":       { wiederholungen: "12–15", zweck: "Muskulatur erhalten und das Training unterstützen" },
  "Gewicht halten": { wiederholungen: "10–12", zweck: "Kraft und Muskulatur erhalten" },
  "Zunehmen":       { wiederholungen: "8–12",  zweck: "Körpergewicht und Muskelmasse erhöhen" }
};

// ---------- 3. Der Trainingsstatus bestimmt NUR die Sätze ----------
const saetzeProStatus = {
  "Starter": 2,
  "Rising": 3,
  "Advanced": 3,
  "Elite": 4
};

// ---------- 4. Hilfsfunktion ----------
// Sucht einen Eintrag, egal ob groß oder klein geschrieben wurde.
// Gibt den richtigen Namen zurück oder null, wenn nichts passt.
function findeSchluessel(objekt, eingabe) {
  if (typeof eingabe !== "string") {
    return null;
  }
  const gesucht = eingabe.trim().toLowerCase();
  const alleNamen = Object.keys(objekt);
  for (let i = 0; i < alleNamen.length; i++) {
    if (alleNamen[i].toLowerCase() === gesucht) {
      return alleNamen[i];
    }
  }
  return null;
}

// ---------- 5. Hauptfunktion: der Algorithmus ----------
function waehleUebungen(muskelgruppe, trainingsziel, trainingsstatus) {

  // Schritt 1: Muskelgruppe prüfen
  const gruppe = findeSchluessel(uebungskatalog, muskelgruppe);
  if (gruppe === null) {
    return {
      ok: false,
      fehler: "Ungültige Muskelgruppe. Erlaubt sind: " + Object.keys(uebungskatalog).join(", ") + "."
    };
  }

  // Schritt 2: Trainingsziel prüfen
  const ziel = findeSchluessel(trainingsziele, trainingsziel);
  if (ziel === null) {
    return {
      ok: false,
      fehler: "Ungültiges Trainingsziel. Erlaubt sind: " + Object.keys(trainingsziele).join(", ") + "."
    };
  }

  // Schritt 3: Trainingsstatus prüfen (fehlt er, wird Starter verwendet)
  let status;
  const statusFehlt = (trainingsstatus === undefined ||
                       trainingsstatus === null ||
                       String(trainingsstatus).trim() === "");
  if (statusFehlt) {
    status = "Starter";
  } else {
    status = findeSchluessel(saetzeProStatus, trainingsstatus);
    if (status === null) {
      return {
        ok: false,
        fehler: "Ungültiger Trainingsstatus. Erlaubt sind: " + Object.keys(saetzeProStatus).join(", ") + "."
      };
    }
  }

  // Schritt 4: Sätze und Wiederholungen bestimmen
  const saetze = saetzeProStatus[status];                      // nur vom Status abhängig
  const wiederholungen = trainingsziele[ziel].wiederholungen;  // nur vom Ziel abhängig

  // Schritt 5: die drei Übungen der Muskelgruppe aus dem Katalog nehmen
  // (immer genau drei, immer dieselben, nicht zufällig)
  const katalogUebungen = uebungskatalog[gruppe];
  const ergebnisUebungen = [];
  for (let i = 0; i < 3; i++) {
    ergebnisUebungen.push({
      name: katalogUebungen[i].name,
      beschreibung: katalogUebungen[i].beschreibung,
      saetze: saetze,
      wiederholungen: wiederholungen
    });
  }

  // Schritt 6: Sicherheitshinweis bei Nackenübungen
  let hinweis = null;
  if (gruppe === "Nacken") {
    hinweis = "Sicherheitshinweis: Nackenübungen nur mit sehr leichtem Widerstand " +
              "und ohne ruckartige Bewegungen ausführen.";
  }

  return {
    ok: true,
    muskelgruppe: gruppe,
    trainingsziel: ziel,
    zweck: trainingsziele[ziel].zweck,
    trainingsstatus: status,
    uebungen: ergebnisUebungen,
    hinweis: hinweis
  };
}

// ===== Score-Berechnung (unverändert aus berechnung.js) =====
// ---------- Feste Werte aus den Projektvorgaben ----------
const BETRACHTETE_TAGE = 30;     // Trainingshäufigkeit: letzte 30 Tage
const ZIEL_TRAININGSTAGE = 12;   // 12 Trainingstage        -> volle Punkte
const ZIEL_VERHAELTNIS = 1.0;    // Gewicht / Körpergewicht = 1,0 -> volle Punkte
const ZIEL_WIEDERHOLUNGEN = 15;  // 15 Wiederholungen pro Satz -> volle Punkte
const ZIEL_SAETZE = 4;           // 4 Sätze                 -> volle Punkte

const MAX_HAEUFIGKEIT = 20;
const MAX_RELATIVE_LEISTUNG = 20;
const MAX_WIEDERHOLUNGEN = 15;
const MAX_SAETZE = 15;

// ---------- Datum ----------

// Heutiges Datum im Format JJJJ-MM-TT (Ortszeit)
function heutigesDatum() {
  const jetzt = new Date();
  const monat = String(jetzt.getMonth() + 1).padStart(2, "0");
  const tag = String(jetzt.getDate()).padStart(2, "0");
  return jetzt.getFullYear() + "-" + monat + "-" + tag;
}

// Prüft, ob ein Text ein echtes Datum im Format JJJJ-MM-TT ist
function istGueltigesDatum(text) {
  if (typeof text !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    return false;
  }
  const datum = new Date(text + "T00:00:00Z");
  if (isNaN(datum.getTime())) {
    return false;
  }
  // 2026-02-30 würde sonst zu 2026-03-02 umgerechnet werden
  return datum.toISOString().slice(0, 10) === text;
}

// Anzahl Tage zwischen zwei Datumsangaben (spaeter - frueher)
function tageZwischen(frueher, spaeter) {
  const a = new Date(frueher + "T00:00:00Z");
  const b = new Date(spaeter + "T00:00:00Z");
  return Math.round((b - a) / (24 * 60 * 60 * 1000));
}

// Sortiert Einheiten nach Datum (älteste zuerst). Bei gleichem Datum entscheidet die ID.
function sortiereChronologisch(einheiten) {
  const kopie = einheiten.slice();
  kopie.sort(function (a, b) {
    if (a.datum < b.datum) return -1;
    if (a.datum > b.datum) return 1;
    return a.id - b.id;
  });
  return kopie;
}

// ---------- Hilfsfunktionen für Punkte ----------

// Punkte proportional zum Zielwert, aber höchstens die Maximalpunkte
function punkteNachAnteil(wert, zielwert, maxPunkte) {
  const punkte = (wert / zielwert) * maxPunkte;
  if (punkte > maxPunkte) {
    return maxPunkte;
  }
  return punkte;
}

// Rundet auf eine Nachkommastelle (nur für die Anzeige der Teilpunkte)
function rundeEineStelle(zahl) {
  return Math.round(zahl * 10) / 10;
}

// Größter Wert eines Feldes (z. B. "gewicht") in einer Liste von Einheiten
function hoechsterWert(einheiten, feld) {
  let maximum = 0;
  for (let i = 0; i < einheiten.length; i++) {
    if (einheiten[i][feld] > maximum) {
      maximum = einheiten[i][feld];
    }
  }
  return maximum;
}

// ---------- Teilbereich 1: Trainingshäufigkeit ----------
// Zählt die verschiedenen Trainingstage der letzten 30 Tage
// (heute und die 29 Tage davor = 30 Kalendertage).
function zaehleTrainingstage(einheiten, heute) {
  const schonGezaehlt = {};
  let anzahl = 0;
  for (let i = 0; i < einheiten.length; i++) {
    const tage = tageZwischen(einheiten[i].datum, heute);
    if (tage >= 0 && tage < BETRACHTETE_TAGE && !schonGezaehlt[einheiten[i].datum]) {
      schonGezaehlt[einheiten[i].datum] = true;
      anzahl++;
    }
  }
  return anzahl;
}

// ---------- Teilbereich 5: Entwicklung über die Zeit ----------

// Verbesserung: mehr Gewicht ODER bei gleichem Gewicht mehr Wiederholungen insgesamt
function istVerbesserung(alt, neu) {
  if (neu.gewicht > alt.gewicht) {
    return true;
  }
  if (neu.gewicht === alt.gewicht) {
    return neu.wiederholungen * neu.saetze > alt.wiederholungen * alt.saetze;
  }
  return false;
}

// Vergleicht aufeinanderfolgende Einträge DERSELBEN Übung.
// Liefert: Anzahl Vergleiche, Anzahl Verbesserungen, längste Serie von Verbesserungen
function analysiereEntwicklung(einheiten) {
  const sortiert = sortiereChronologisch(einheiten);

  // Einträge nach Übung sortieren (jede Übung nur mit sich selbst vergleichen)
  const proUebung = {};
  for (let i = 0; i < sortiert.length; i++) {
    const name = sortiert[i].uebung;
    if (!proUebung[name]) {
      proUebung[name] = [];
    }
    proUebung[name].push(sortiert[i]);
  }

  let vergleiche = 0;
  let verbesserungen = 0;
  let laengsteSerie = 0;

  const namen = Object.keys(proUebung);
  for (let n = 0; n < namen.length; n++) {
    const liste = proUebung[namen[n]];
    let serie = 0;
    for (let i = 1; i < liste.length; i++) {
      vergleiche++;
      if (istVerbesserung(liste[i - 1], liste[i])) {
        verbesserungen++;
        serie++;
        if (serie > laengsteSerie) {
          laengsteSerie = serie;
        }
      } else {
        serie = 0;
      }
    }
  }

  return { vergleiche: vergleiche, verbesserungen: verbesserungen, laengsteSerie: laengsteSerie };
}

// 30 / 20 / 10 / 0 Punkte je nach Entwicklung
function punkteEntwicklung(analyse) {
  if (analyse.laengsteSerie >= 3) {
    return 30;
  }
  let quote = 0;
  if (analyse.vergleiche > 0) {
    quote = analyse.verbesserungen / analyse.vergleiche;
  }
  if (analyse.verbesserungen >= 2 && quote >= 0.5) {
    return 20;
  }
  if (analyse.verbesserungen >= 1) {
    return 10;
  }
  return 0;
}

// ---------- Status und Farbe ----------
function bestimmeStatus(score, hatTrainingsdaten) {
  if (!hatTrainingsdaten) return { status: "Inactive", farbe: "Weiß" };
  if (score <= 20) return { status: "Starter", farbe: "Rot" };
  if (score <= 40) return { status: "Rising", farbe: "Orange" };
  if (score <= 70) return { status: "Advanced", farbe: "Gelb" };
  return { status: "Elite", farbe: "Grün" };
}

// Ergebnis für eine Muskelgruppe ohne Trainingsdaten
function leereMuskelgruppe() {
  return {
    score: 0,
    status: "Inactive",
    farbe: "Weiß",
    teilpunkte: { haeufigkeit: 0, relativeLeistung: 0, wiederholungen: 0, saetze: 0, entwicklung: 0 },
    hinweis: null
  };
}

// ---------- Hauptfunktion: Score einer Muskelgruppe ----------
// einheiten: nur die Einheiten DIESER Muskelgruppe
// koerpergewicht: Zahl oder null (wenn unbekannt)
function berechneMuskelgruppe(einheiten, koerpergewicht, heute) {
  if (einheiten.length === 0) {
    return leereMuskelgruppe();
  }

  // 1. Trainingshäufigkeit (max. 20)
  const trainingstage = zaehleTrainingstage(einheiten, heute);
  const haeufigkeit = punkteNachAnteil(trainingstage, ZIEL_TRAININGSTAGE, MAX_HAEUFIGKEIT);

  // 2. Relative Trainingsleistung (max. 20): höchstes Gewicht / Körpergewicht
  let relativeLeistung = 0;
  let hinweis = null;
  if (typeof koerpergewicht === "number" && koerpergewicht > 0) {
    const verhaeltnis = hoechsterWert(einheiten, "gewicht") / koerpergewicht;
    relativeLeistung = punkteNachAnteil(verhaeltnis, ZIEL_VERHAELTNIS, MAX_RELATIVE_LEISTUNG);
  } else {
    hinweis = "Es ist kein Körpergewicht gespeichert. Die relative Trainingsleistung kann nicht berechnet werden " +
              "(0 Punkte dafür). Die Trainingsdaten bleiben unverändert erhalten.";
  }

  // 3. Wiederholungen (max. 15): höchste Wiederholungszahl pro Satz
  const wiederholungen = punkteNachAnteil(hoechsterWert(einheiten, "wiederholungen"), ZIEL_WIEDERHOLUNGEN, MAX_WIEDERHOLUNGEN);

  // 4. Sätze (max. 15): höchste Satzzahl
  const saetze = punkteNachAnteil(hoechsterWert(einheiten, "saetze"), ZIEL_SAETZE, MAX_SAETZE);

  // 5. Entwicklung über die Zeit (max. 30)
  const entwicklung = punkteEntwicklung(analysiereEntwicklung(einheiten));

  // Gesamtscore: addieren, auf höchstens 100 begrenzen, kaufmännisch runden
  let summe = haeufigkeit + relativeLeistung + wiederholungen + saetze + entwicklung;
  if (summe > 100) {
    summe = 100;
  }
  const score = Math.round(summe);

  const statusInfo = bestimmeStatus(score, true);

  return {
    score: score,
    status: statusInfo.status,
    farbe: statusInfo.farbe,
    teilpunkte: {
      haeufigkeit: rundeEineStelle(haeufigkeit),
      relativeLeistung: rundeEineStelle(relativeLeistung),
      wiederholungen: rundeEineStelle(wiederholungen),
      saetze: rundeEineStelle(saetze),
      entwicklung: entwicklung
    },
    hinweis: hinweis
  };
}

// ---------- Aktivitätslevel (aus der Anzahl der Übungen) ----------

// Zählt, wie viele verschiedene Übungen an einem Tag absolviert wurden.
// (Nicht verwechseln mit den Trainingstagen!)
function zaehleUebungenAmTag(einheiten, datum) {
  const schonGezaehlt = {};
  let anzahl = 0;
  for (let i = 0; i < einheiten.length; i++) {
    if (einheiten[i].datum === datum) {
      const schluessel = einheiten[i].muskelgruppe + "|" + einheiten[i].uebung;
      if (!schonGezaehlt[schluessel]) {
        schonGezaehlt[schluessel] = true;
        anzahl++;
      }
    }
  }
  return anzahl;
}

// 0-2 Übungen: niedrig, 3-5: mittel, ab 6: hoch
function bestimmeAktivitaetslevel(anzahlUebungen) {
  if (anzahlUebungen <= 2) return "niedrig";
  if (anzahlUebungen <= 5) return "mittel";
  return "hoch";
}


/* ======================================================================
   B. FESTE WERTE UND KLEINE HELFER
   ====================================================================== */

// Spätestes zulässiges Datum für ALLE Datumsfelder: heute (keine Daten in der Zukunft).
// Es wird bei jedem Aufruf neu bestimmt, damit es auch nach Mitternacht stimmt.
// heutigesDatum() (aus berechnung.js) verwendet die Ortszeit des Geräts, z. B. Wien.
function letztesErlaubtesDatum() { return heutigesDatum(); }

// Die zehn Muskelgruppen kommen direkt aus dem Übungskatalog.
const MUSKELGRUPPEN = Object.keys(uebungskatalog);

// Grenzen der Eingabefelder (Projektvorgabe)
const GRENZEN = {
  alter: { min: 1, max: 100 },
  groesse: { min: 120, max: 220 },
  koerpergewicht: { min: 1, max: 540 },
  trainingsgewicht: { min: 0, max: 540 },
  saetze: { min: 0, max: 25 },
  wiederholungen: { min: 0, max: 30 },
  uebungenProTag: { min: 0, max: 8 }   // Bereich, den berechneErnaehrung() akzeptiert
};

const ZIEL_REIHENFOLGE = ["Abnehmen", "Muskelaufbau", "Zunehmen", "Gewicht halten"];
const ZIEL_STANDARD = "Muskelaufbau";

// Zuordnung Status (aus berechnung.js) -> CSS-Klasse der Farbe
const STATUS_KLASSE = { Inactive: "inactive", Starter: "starter", Rising: "rising", Advanced: "advanced", Elite: "elite" };
const STATUS_FARBE = { Inactive: "#ffffff", Starter: "#e8837c", Rising: "#f2b36a", Advanced: "#efd668", Elite: "#7fc592" };

function $(id) { return document.getElementById(id); }

// Verhindert, dass Eingaben als HTML interpretiert werden
function esc(text) {
  return String(text === null || text === undefined ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// "2020-12-31" -> "31.12.2020"
function datumAnzeige(iso) {
  const teile = String(iso).split("-");
  return teile.length === 3 ? teile[2] + "." + teile[1] + "." + teile[0] : String(iso);
}

// Zahl mit deutschem Komma, höchstens eine Nachkommastelle
function zahlText(zahl) {
  return Number(zahl).toLocaleString("de-DE", { maximumFractionDigits: 1 });
}


/* ======================================================================
   C. ZENTRALE EINGABEPRÜFUNG (Validierung)
   Jede Prüffunktion bekommt den ROHEN Text aus dem Eingabefeld und
   liefert entweder { ok: true, wert: ... } oder { ok: false, fehler: "..." }.
   Es wird zuerst das ganze Format geprüft, erst danach in eine Zahl umgewandelt.
   Ungültige Werte werden nie stillschweigend zu 0.
   ====================================================================== */

function fehlerErgebnis(text) { return { ok: false, fehler: text }; }

// Name: nur Buchstaben (inkl. Umlaute und andere Unicode-Buchstaben) und einzelne
// Leerzeichen zwischen den Namensteilen. \p{L} = Buchstabe, \p{M} = Akzentzeichen.
const NAME_MUSTER = /^(?:\p{L}\p{M}*)+(?: (?:\p{L}\p{M}*)+)*$/u;

function pruefeName(roh) {
  const text = String(roh === null || roh === undefined ? "" : roh).normalize("NFC").trim().replace(/\s+/g, " ");
  if (text === "") return fehlerErgebnis("Bitte einen Namen eingeben.");
  if (!NAME_MUSTER.test(text)) return fehlerErgebnis("Der Name darf nur Buchstaben und Leerzeichen zwischen den Namensteilen enthalten.");
  return { ok: true, wert: text, text: text };
}

// Ganze Zahl in einem Bereich. Erlaubt sind nur Ziffern (kein Komma, kein Minus, kein Exponent).
function pruefeGanzzahl(roh, min, max, pflicht, bezeichnung) {
  const text = String(roh === null || roh === undefined ? "" : roh).trim();
  if (text === "") {
    return pflicht ? fehlerErgebnis("Bitte " + bezeichnung + " eingeben.") : { ok: true, wert: null, text: "" };
  }
  if (!/^\d+$/.test(text)) return fehlerErgebnis("Bitte eine ganze Zahl ohne Komma eingeben (" + min + " bis " + max + ").");
  const zahl = Number(text);
  if (!Number.isSafeInteger(zahl) || zahl < min || zahl > max) return fehlerErgebnis("Der Wert muss zwischen " + min + " und " + max + " liegen.");
  return { ok: true, wert: zahl, text: String(zahl) };
}

// Dezimalzahl mit höchstens einer Nachkommastelle; Komma und Punkt sind erlaubt.
function pruefeDezimal(roh, min, max, pflicht, bezeichnung, einheit) {
  const text = String(roh === null || roh === undefined ? "" : roh).trim();
  if (text === "") {
    return pflicht ? fehlerErgebnis("Bitte " + bezeichnung + " eingeben.") : { ok: true, wert: null, text: "" };
  }
  if (/^\d+[.,]\d{2,}$/.test(text)) return fehlerErgebnis("Bitte höchstens eine Nachkommastelle angeben.");
  if (!/^\d+(?:[.,]\d)?$/.test(text)) return fehlerErgebnis("Bitte eine Zahl eingeben, z. B. 72,5 (Komma oder Punkt).");
  const zahl = parseFloat(text.replace(",", "."));
  if (!isFinite(zahl) || zahl < min || zahl > max) return fehlerErgebnis("Der Wert muss zwischen " + zahlText(min) + " und " + zahlText(max) + " " + einheit + " liegen.");
  return { ok: true, wert: zahl, text: zahlText(zahl) };
}

// Datum: "JJJJ-MM-TT" (Datumsfeld) oder "TT.MM.JJJJ". Prüft echten Kalendertag
// (Schaltjahre!) und das späteste erlaubte Datum. istGueltigesDatum() stammt aus berechnung.js.
function pruefeDatum(roh, pflicht, nichtLesbar) {
  const text = String(roh === null || roh === undefined ? "" : roh).trim();
  if (nichtLesbar) return fehlerErgebnis("Das Datum ist unvollständig oder ungültig.");
  if (text === "") return pflicht ? fehlerErgebnis("Bitte ein Datum wählen.") : { ok: true, wert: null, text: "" };
  let iso = null;
  const deutsch = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(text);
  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    iso = text;
  } else if (deutsch) {
    iso = deutsch[3] + "-" + deutsch[2].padStart(2, "0") + "-" + deutsch[1].padStart(2, "0");
  }
  if (iso === null || iso.slice(0, 4) === "0000" || !istGueltigesDatum(iso)) {
    return fehlerErgebnis("Bitte ein gültiges Datum eingeben (z. B. 29.02.2020).");
  }
  if (iso > letztesErlaubtesDatum()) {
    return fehlerErgebnis("Das Datum darf nicht in der Zukunft liegen (spätestens heute, " + datumAnzeige(letztesErlaubtesDatum()) + ").");
  }
  return { ok: true, wert: iso, text: iso };
}

// Eigene Übung: 2-40 Zeichen, Buchstaben/Ziffern/Leerzeichen/Bindestrich, mindestens ein Buchstabe,
// darf in der Muskelgruppe noch nicht vorkommen.
function pruefeEigeneUebung(roh, gruppe) {
  const text = String(roh === null || roh === undefined ? "" : roh).normalize("NFC").trim().replace(/\s+/g, " ");
  if (text === "") return fehlerErgebnis("Bitte einen Namen für die Übung eingeben.");
  if (text.length < 2 || text.length > 40) return fehlerErgebnis("Der Name muss 2 bis 40 Zeichen lang sein.");
  if (!/^[\p{L}\p{N}][\p{L}\p{N}\p{M} -]*$/u.test(text) || !/\p{L}/u.test(text)) {
    return fehlerErgebnis("Erlaubt sind Buchstaben, Ziffern, Leerzeichen und Bindestriche (mindestens ein Buchstabe).");
  }
  if (gruppe) {
    const vorhanden = holeUebungsnamen(gruppe);
    for (let i = 0; i < vorhanden.length; i++) {
      if (vorhanden[i].toLowerCase() === text.toLowerCase()) return fehlerErgebnis("Diese Übung gibt es in „" + gruppe + "“ schon.");
    }
  }
  return { ok: true, wert: text, text: text };
}

// ---- Regelverzeichnis: Welches Feld (data-regel) wird womit geprüft? ----
const FELD_REGELN = {
  name: function (roh) { return pruefeName(roh); },
  alter: function (roh) { return pruefeGanzzahl(roh, GRENZEN.alter.min, GRENZEN.alter.max, false, "das Alter"); },
  groesse: function (roh) { return pruefeDezimal(roh, GRENZEN.groesse.min, GRENZEN.groesse.max, false, "die Körpergröße", "cm"); },
  koerpergewicht: function (roh) { return pruefeDezimal(roh, GRENZEN.koerpergewicht.min, GRENZEN.koerpergewicht.max, false, "das Körpergewicht", "kg"); },
  koerpergewichtPflicht: function (roh) { return pruefeDezimal(roh, GRENZEN.koerpergewicht.min, GRENZEN.koerpergewicht.max, true, "das Körpergewicht", "kg"); },
  trainingsgewicht: function (roh) { return pruefeDezimal(roh, GRENZEN.trainingsgewicht.min, GRENZEN.trainingsgewicht.max, false, "das Gewicht", "kg"); },
  saetze: function (roh) { return pruefeGanzzahl(roh, GRENZEN.saetze.min, GRENZEN.saetze.max, true, "die Anzahl der Sätze"); },
  wiederholungen: function (roh) { return pruefeGanzzahl(roh, GRENZEN.wiederholungen.min, GRENZEN.wiederholungen.max, true, "die Anzahl der Wiederholungen"); },
  uebungenProTag: function (roh) { return pruefeGanzzahl(roh, GRENZEN.uebungenProTag.min, GRENZEN.uebungenProTag.max, true, "die Anzahl der Übungen"); }
};

// Prüft EIN Eingabefeld, zeigt/entfernt die Fehlermeldung direkt am Feld und gibt das Ergebnis zurück.
function pruefeFeld(feld) {
  const regel = feld.dataset.regel;
  let ergebnis;
  if (regel === "datum" || regel === "datumOptional") {
    ergebnis = pruefeDatum(feld.value, regel === "datum", feld.validity && feld.validity.badInput);
  } else if (regel === "eigeneUebung") {
    ergebnis = pruefeEigeneUebung(feld.value, zustand.training.gruppe);
  } else if (FELD_REGELN[regel]) {
    ergebnis = FELD_REGELN[regel](feld.value);
  } else {
    return { ok: true, wert: feld.value };
  }
  zeigeFeldFehler(feld, ergebnis.ok ? "" : ergebnis.fehler);
  return ergebnis;
}

function zeigeFeldFehler(feld, text) {
  const meldung = $(feld.id + "-fehler");
  if (meldung) meldung.textContent = text;
  feld.classList.toggle("ungueltig", text !== "");
  if (text !== "") feld.setAttribute("aria-invalid", "true"); else feld.removeAttribute("aria-invalid");
}

// Prüft alle Felder mit data-regel in einem Bereich. Springt zum ersten Fehler.
// Gibt { ok, werte: {feldId: wert} } zurück.
function pruefeFormular(bereich) {
  const felder = bereich.querySelectorAll("[data-regel]");
  const werte = {};
  let erstesFehlerfeld = null;
  for (let i = 0; i < felder.length; i++) {
    const ergebnis = pruefeFeld(felder[i]);
    if (ergebnis.ok) {
      werte[felder[i].id] = ergebnis.wert;
      normalisiereFeld(felder[i], ergebnis);
      if (typeof merkeFeldWert === "function") merkeFeldWert(felder[i]);
    } else if (erstesFehlerfeld === null) {
      erstesFehlerfeld = felder[i];
    }
  }
  if (erstesFehlerfeld) erstesFehlerfeld.focus();
  return { ok: erstesFehlerfeld === null, werte: werte };
}

// Nach dem Verlassen eines gültigen Feldes: Schreibweise vereinheitlichen (z. B. "167.5" -> "167,5")
function normalisiereFeld(feld, ergebnis) {
  if (ergebnis.ok && typeof ergebnis.text === "string" && feld.dataset.regel !== "datum" && feld.dataset.regel !== "datumOptional") {
    if (feld.value !== ergebnis.text) feld.value = ergebnis.text;
  }
}


/* ======================================================================
   D. SPEICHERUNG ÜBER DEN NODE.JS-SERVER (server.js)
   Die Daten liegen als JSON-Dateien auf dem Server (Ordner Algorithmen/daten-test):
     profil.json, einstellungen.json, eigene_uebungen.json,
     trainingseinheiten.json, muskelstatus.json
   Ablauf:
   1. Beim Start werden ALLE Dateien mit GET /api/daten geladen (ladeAlleDatenVomServer).
      Erst danach wird die Oberfläche gezeichnet.
   2. Lesen: Die hole...()-Funktionen lesen aus dem Zwischenspeicher "serverDaten".
      Sie bleiben deshalb synchron, die Anzeige-Funktionen müssen nichts warten.
   3. Ändern: aendereDatei() schickt die geänderte Datei mit PUT /api/daten/<name>
      an den Server. Erst wenn der Server { ok: true } meldet, wird der Zwischenspeicher
      aktualisiert. Bei einem Fehler bleibt alles unverändert.
   4. Alle Änderungen laufen nacheinander (Warteschlange). So kann eine schnelle
      zweite Änderung eine erste nicht überschreiben.
   Alte Daten im Browser (localStorage, Schlüssel "mamu_...") werden NICHT mehr
   gelesen, aber auch NICHT gelöscht.
   ====================================================================== */

const API_ADRESSE = "/api/daten";
const DATEINAMEN = ["profil", "einstellungen", "eigene_uebungen", "trainingseinheiten", "muskelstatus"];

// Zwischenspeicher: zuletzt vom Server geladene bzw. bestätigte Daten
const serverDaten = {};
let datenGeladen = false;

// Tiefe Kopie, damit Änderungen nie direkt im Zwischenspeicher landen
function kopie(wert) { return JSON.parse(JSON.stringify(wert)); }

// Liefert eine Kopie einer Datei aus dem Zwischenspeicher
function ladeWert(name) { return kopie(serverDaten[name]); }

function istObjekt(wert) { return typeof wert === "object" && wert !== null && !Array.isArray(wert); }

// Schritt 1: alle Dateien laden. Gibt { ok: true } oder { ok: false, fehler: "..." } zurück.
async function ladeAlleDatenVomServer() {
  if (window.location.protocol === "file:") {
    return fehlerErgebnis("mamu wurde direkt als Datei geöffnet. Bitte den Server starten (im Ordner „Algorithmen“: PORT=3001 node server.js) und mamu über http://localhost:3001 öffnen.");
  }
  let antwort, inhalt = null;
  try {
    antwort = await fetch(API_ADRESSE, { cache: "no-store" });
  } catch (fehler) {
    return fehlerErgebnis("Der mamu-Server ist nicht erreichbar. Bitte prüfen, ob „node server.js“ noch läuft, und die Seite neu laden.");
  }
  try { inhalt = await antwort.json(); } catch (fehler) { inhalt = null; }
  if (!antwort.ok || !inhalt || inhalt.ok !== true) {
    const text = inhalt && inhalt.fehler ? inhalt.fehler : "Unbekannter Serverfehler (Status " + antwort.status + ").";
    return fehlerErgebnis("Die Daten konnten nicht geladen werden: " + text);
  }
  for (let i = 0; i < DATEINAMEN.length; i++) {
    const wert = inhalt.daten ? inhalt.daten[DATEINAMEN[i]] : undefined;
    if (!istObjekt(wert)) return fehlerErgebnis("Der Server hat für „" + DATEINAMEN[i] + "“ unerwartete Daten geliefert.");
  }
  if (!Array.isArray(inhalt.daten.trainingseinheiten.einheiten)) {
    return fehlerErgebnis("Die Trainingseinheiten haben ein unerwartetes Format.");
  }
  DATEINAMEN.forEach(function (name) { serverDaten[name] = inhalt.daten[name]; });
  datenGeladen = true;
  return { ok: true };
}

// Schickt EINE Datei an den Server. Erst nach { ok: true } wird der Zwischenspeicher ersetzt.
async function sendeAnServer(name, daten) {
  let antwort, inhalt = null;
  try {
    antwort = await fetch(API_ADRESSE + "/" + encodeURIComponent(name), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(daten)
    });
  } catch (fehler) {
    return fehlerErgebnis("Der mamu-Server ist nicht erreichbar. Es wurde nichts gespeichert.");
  }
  try { inhalt = await antwort.json(); } catch (fehler) { inhalt = null; }
  if (!antwort.ok || !inhalt || inhalt.ok !== true) {
    const text = inhalt && inhalt.fehler ? inhalt.fehler : "Unbekannter Serverfehler (Status " + antwort.status + ").";
    return fehlerErgebnis("Speichern fehlgeschlagen: " + text);
  }
  serverDaten[name] = kopie(daten);
  return { ok: true };
}

// Warteschlange: Jede Änderung wartet, bis die vorherige fertig ist.
let warteschlange = Promise.resolve();

// Ändert eine Datei. "aendere" bekommt eine Kopie der AKTUELLEN Daten und gibt
// { ok: true, daten: neueDaten, ... } oder { ok: false, fehler: "..." } zurück.
// Ergebnis (Promise): { ok: true, ... } oder { ok: false, fehler: "..." }
function aendereDatei(name, aendere) {
  const auftrag = warteschlange.then(async function () {
    if (!datenGeladen) return fehlerErgebnis("Die Daten wurden noch nicht vom Server geladen. Es wurde nichts gespeichert.");
    let vorbereitet;
    try { vorbereitet = aendere(ladeWert(name)); } catch (fehler) { return fehlerErgebnis("Unerwarteter Fehler. Es wurde nichts gespeichert."); }
    if (!vorbereitet || !vorbereitet.ok) return vorbereitet || fehlerErgebnis("Es wurde nichts gespeichert.");
    const gesendet = await sendeAnServer(name, vorbereitet.daten);
    if (!gesendet.ok) return gesendet;
    const ergebnis = Object.assign({}, vorbereitet);
    delete ergebnis.daten;
    return ergebnis;
  });
  warteschlange = auftrag.catch(function () { /* nächster Auftrag läuft trotzdem */ });
  return auftrag;
}

// ----- Trainingseinheiten (trainingseinheiten.json) -----

// Ist ein gespeicherter Datensatz vollständig und gültig? (Alte oder kaputte Datensätze werden ignoriert, aber nicht gelöscht.)
function istGueltigeEinheit(e) {
  if (!e || typeof e !== "object") return false;
  if (!Number.isSafeInteger(e.id) || e.id < 1) return false;
  if (MUSKELGRUPPEN.indexOf(e.muskelgruppe) === -1) return false;
  if (typeof e.uebung !== "string" || e.uebung.trim() === "") return false;
  if (e.gewicht !== null && !(typeof e.gewicht === "number" && isFinite(e.gewicht) && e.gewicht >= GRENZEN.trainingsgewicht.min && e.gewicht <= GRENZEN.trainingsgewicht.max)) return false;
  if (!Number.isInteger(e.wiederholungen) || e.wiederholungen < GRENZEN.wiederholungen.min || e.wiederholungen > GRENZEN.wiederholungen.max) return false;
  if (!Number.isInteger(e.saetze) || e.saetze < GRENZEN.saetze.min || e.saetze > GRENZEN.saetze.max) return false;
  if (typeof e.datum !== "string" || !istGueltigesDatum(e.datum) || e.datum > letztesErlaubtesDatum()) return false;
  return true;
}

// Liefert die gültigen Einheiten und zählt die ignorierten
function ladeEinheiten() {
  const roh = ladeWert("trainingseinheiten");
  const gueltig = roh.einheiten.filter(istGueltigeEinheit);
  return { gueltig: gueltig, ignoriert: roh.einheiten.length - gueltig.length };
}

function holeAlleEinheiten() { return ladeEinheiten().gueltig; }

// Speichert mehrere neue Einträge auf einmal. Prüft jeden Eintrag nochmals und lehnt exakte Duplikate ab.
// Bestehende Einträge (auch unbekannte oder ungültige) bleiben unverändert erhalten.
function speichereEinheiten(neue) {
  return aendereDatei("trainingseinheiten", function (roh) {
    let id = Number.isSafeInteger(roh.naechsteId) ? roh.naechsteId : 1;
    roh.einheiten.forEach(function (e) { if (e && Number.isSafeInteger(e.id) && e.id >= id) id = e.id + 1; });
    const hinzu = [];
    for (let i = 0; i < neue.length; i++) {
      const eintrag = { id: id + i, muskelgruppe: neue[i].muskelgruppe, uebung: neue[i].uebung, gewicht: neue[i].gewicht, wiederholungen: neue[i].wiederholungen, saetze: neue[i].saetze, datum: neue[i].datum };
      if (!istGueltigeEinheit(eintrag) || holeUebungsnamen(eintrag.muskelgruppe).indexOf(eintrag.uebung) === -1) {
        return fehlerErgebnis("Ein Eintrag ist ungültig und wurde nicht gespeichert.");
      }
      const doppelt = roh.einheiten.concat(hinzu).some(function (v) {
        return v && v.muskelgruppe === eintrag.muskelgruppe && v.uebung === eintrag.uebung && v.datum === eintrag.datum &&
          v.gewicht === eintrag.gewicht && v.wiederholungen === eintrag.wiederholungen && v.saetze === eintrag.saetze;
      });
      if (doppelt) return fehlerErgebnis("Ein identischer Eintrag („" + eintrag.uebung + "“ am " + datumAnzeige(eintrag.datum) + ") ist schon gespeichert.");
      hinzu.push(eintrag);
    }
    roh.einheiten = roh.einheiten.concat(hinzu);
    roh.naechsteId = id + hinzu.length;
    return { ok: true, daten: roh, anzahl: hinzu.length };
  });
}

function loescheEinheiten(ids) {
  return aendereDatei("trainingseinheiten", function (roh) {
    const vorher = roh.einheiten.length;
    roh.einheiten = roh.einheiten.filter(function (e) { return !(e && ids.indexOf(e.id) !== -1); });
    if (roh.einheiten.length === vorher) return fehlerErgebnis("Die Einheit wurde nicht gefunden. Es wurde nichts gelöscht.");
    return { ok: true, daten: roh };          // naechsteId bleibt gleich, IDs werden nie neu vergeben
  });
}

// ----- Profil (profil.json): Name, Alter, Größe und Körpergewicht -----
function holeKoerpergewicht() {
  const profil = ladeWert("profil");
  const g = profil.koerpergewicht;
  return (typeof g === "number" && isFinite(g) && g >= GRENZEN.koerpergewicht.min && g <= GRENZEN.koerpergewicht.max) ? g : null;
}

function holeAngaben() {
  const roh = ladeWert("profil");
  const name = pruefeName(roh.name);
  const alter = pruefeGanzzahl(String(roh.alter === undefined || roh.alter === null ? "" : roh.alter), GRENZEN.alter.min, GRENZEN.alter.max, false, "");
  const groesse = pruefeDezimal(String(roh.groesse === undefined || roh.groesse === null ? "" : roh.groesse), GRENZEN.groesse.min, GRENZEN.groesse.max, false, "", "cm");
  return { name: name.ok ? name.wert : "", alter: alter.ok ? alter.wert : null, groesse: groesse.ok ? groesse.wert : null };
}

// Ändert nur die übergebenen Felder. Alle anderen Felder in profil.json bleiben erhalten.
function speichereProfil(teil) {
  return aendereDatei("profil", function (profil) {
    return { ok: true, daten: Object.assign(profil, teil) };
  });
}

// ----- Einstellungen (einstellungen.json) -----
function holeEinstellungen() {
  const roh = ladeWert("einstellungen");
  return {
    koerper: roh.koerper === "frau" ? "frau" : "mann",
    trainingsziel: (typeof roh.trainingsziel === "string" && trainingsziele[roh.trainingsziel]) ? roh.trainingsziel : ZIEL_STANDARD
  };
}
function speichereEinstellungen(teil) {
  return aendereDatei("einstellungen", function (roh) {
    return { ok: true, daten: Object.assign(roh, teil) };
  });
}

// ----- Eigene Übungen (eigene_uebungen.json) -----
function holeEigeneUebungen(gruppe) {
  const alle = ladeWert("eigene_uebungen");
  const liste = Object.prototype.hasOwnProperty.call(alle, gruppe) ? alle[gruppe] : null;
  return Array.isArray(liste) ? liste.filter(function (n) { return typeof n === "string" && n.trim() !== ""; }) : [];
}
function speichereEigeneUebung(gruppe, name) {
  return aendereDatei("eigene_uebungen", function (alle) {
    const liste = Array.isArray(alle[gruppe]) ? alle[gruppe] : [];
    if (liste.some(function (n) { return String(n).toLowerCase() === name.toLowerCase(); })) {
      return fehlerErgebnis("Diese Übung gibt es in „" + gruppe + "“ schon.");
    }
    liste.push(name);
    alle[gruppe] = liste;
    return { ok: true, daten: alle };
  });
}
function loescheEigeneUebung(gruppe, name) {
  return aendereDatei("eigene_uebungen", function (alle) {
    const liste = Array.isArray(alle[gruppe]) ? alle[gruppe] : [];
    alle[gruppe] = liste.filter(function (n) { return n !== name; });
    return { ok: true, daten: alle };
  });
}

// Die Berechnung kennt kein "leeres Gewicht": Für die Rechenfunktionen wird ein fehlendes
// Gewicht (null) nur als Kopie zu 0 gemacht. Gespeichert bleibt null.
function fuerBerechnung(einheiten) {
  return einheiten.map(function (e) {
    return { id: e.id, muskelgruppe: e.muskelgruppe, uebung: e.uebung, gewicht: e.gewicht === null ? 0 : e.gewicht, wiederholungen: e.wiederholungen, saetze: e.saetze, datum: e.datum };
  });
}

// Bezugsdatum für "letzte 30 Tage": das echte heutige Datum
function bezugsdatum() { return heutigesDatum(); }

// Berechnet alle zehn Gruppen unabhängig voneinander
function berechneAlleGruppen(einheiten, koerpergewicht) {
  const heute = bezugsdatum();
  const ergebnis = {};
  MUSKELGRUPPEN.forEach(function (gruppe) {
    const liste = einheiten.filter(function (e) { return e.muskelgruppe === gruppe; });
    ergebnis[gruppe] = { einheiten: liste, hatDaten: liste.length > 0, ergebnis: berechneMuskelgruppe(fuerBerechnung(liste), koerpergewicht, heute) };
  });
  return ergebnis;
}

// Score einer Gruppe, wenn man nur Einträge bis einschließlich "bisDatum" kennt
function scoreBis(liste, koerpergewicht, bisDatum) {
  const teil = liste.filter(function (e) { return e.datum <= bisDatum; });
  if (teil.length === 0) return null;
  return berechneMuskelgruppe(fuerBerechnung(teil), koerpergewicht, bezugsdatum()).score;
}

// Verlauf: ein Punkt pro Trainingstag der Gruppe (Score mit allen Einträgen bis zu diesem Tag)
function verlaufFuerGruppe(liste, koerpergewicht) {
  const tage = [];
  liste.forEach(function (e) { if (tage.indexOf(e.datum) === -1) tage.push(e.datum); });
  tage.sort();
  return tage.map(function (tag) { return { datum: tag, score: scoreBis(liste, koerpergewicht, tag) }; });
}

// Inactive wird nur für die Übungsempfehlung zu Starter (Projektvorgabe)
function statusFuerEmpfehlung(status) { return status === "Inactive" ? "Starter" : status; }

function gruppiereSitzungen(einheiten) {
  const karte = {};
  einheiten.forEach(function (e) {
    const schluessel = e.datum + "|" + e.muskelgruppe;
    if (!karte[schluessel]) karte[schluessel] = { datum: e.datum, muskelgruppe: e.muskelgruppe, eintraege: [] };
    karte[schluessel].eintraege.push(e);
  });
  return Object.keys(karte).map(function (k) { return karte[k]; }).sort(function (a, b) {
    if (a.datum !== b.datum) return a.datum < b.datum ? 1 : -1;
    return a.muskelgruppe < b.muskelgruppe ? -1 : 1;
  });
}

// Breitenfaktor für die weibliche Figur (y -> Faktor). Die Mittellinie bleibt fest.
const WEIBLICH_STUETZPUNKTE = [[0, 1], [70, 0.9], [100, 0.88], [150, 0.82], [190, 1.0], [218, 1.13], [255, 1.07], [310, 1], [440, 1]];
function breitenfaktor(y) {
  const p = WEIBLICH_STUETZPUNKTE;
  for (let i = 1; i < p.length; i++) {
    if (y <= p[i][0]) {
      const t = (y - p[i - 1][0]) / (p[i][0] - p[i - 1][0]);
      return p[i - 1][1] + t * (p[i][1] - p[i - 1][1]);
    }
  }
  return 1;
}
function weiblichFormen(d) {
  return d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, function (_, x, y) {
    const neuX = 100 + (parseFloat(x) - 100) * breitenfaktor(parseFloat(y));
    return Math.round(neuX * 100) / 100 + "," + y;
  });
}

function spiegeln(d, klasse, extra) {
  const a = '<path class="' + klasse + '" d="' + d + '"' + (extra || "") + "/>";
  const b = '<path class="' + klasse + '" d="' + d + '" transform="matrix(-1 0 0 1 200 0)"' + (extra || "") + "/>";
  return a + b;
}

// Baut das komplette SVG für eine Körperseite
function baueKoerperSvg(seite, geschlecht, status, auswahl, scoreText, idPrefix) {
  const f = geschlecht === "weiblich" ? weiblichFormen : function (d) { return d; };
  const gradId = idPrefix + "-haut";
  const rumpf = seite === "vorne" ? SILHOUETTE.rumpfVorne : SILHOUETTE.rumpfHinten;
  const teile = [SILHOUETTE.bein, rumpf, SILHOUETTE.arm, SILHOUETTE.hals].map(f);
  const kopf = SILHOUETTE.kopf;
  let svg = '<svg class="koerper-svg" viewBox="0 0 ' + KOERPER_BREITE + " " + KOERPER_HOEHE + '" width="230" height="511" role="group" aria-label="Körper, ' + (seite === "vorne" ? "Vorderansicht" : "Rückansicht") + '" focusable="false">';
  svg += '<defs><linearGradient id="' + gradId + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e7cfb9"/><stop offset="0.5" stop-color="#f4e5d6"/><stop offset="1" stop-color="#e7cfb9"/></linearGradient><linearGradient id="' + idPrefix + '-licht" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.14"/></linearGradient></defs>';
  // 1) Umrisse (dicke Linie unter allen Flächen)
  let umriss = "", flaechen = "";
  teile.forEach(function (d) { umriss += spiegeln(d, "haut-umriss"); flaechen += spiegeln(d, "haut-flaeche", ' fill="url(#' + gradId + ')"'); });
  [kopf, SILHOUETTE.ohr].forEach(function (d) { umriss += spiegeln(d, "haut-umriss"); flaechen += spiegeln(d, "haut-flaeche", ' fill="url(#' + gradId + ')"'); });
  svg += '<g aria-hidden="true">' + umriss + flaechen + "</g>";
  // 2) Muskeln
  const formen = MUSKELFORMEN[seite];
  Object.keys(formen).forEach(function (gruppe) {
    const klasse = "status-" + (status[gruppe] || "inactive");
    svg += '<g class="muskel ' + klasse + '" data-gruppe="' + gruppe + '" role="button" tabindex="0" aria-label="' + gruppe + '" aria-pressed="' + (auswahl === gruppe) + '">';
    formen[gruppe].forEach(function (d) { svg += spiegeln(f(d), "muskel-form"); });
    formen[gruppe].forEach(function (d) { svg += spiegeln(f(d), "muskel-licht", ' fill="url(#' + idPrefix + '-licht)"'); });
    svg += "</g>";
  });
  // 3) Zierlinien
  svg += '<g class="detail" aria-hidden="true">';
  DETAIL_LINIEN[seite].forEach(function (d) { svg += spiegeln(f(d), "detail-linie"); });
  svg += "</g>";
  // 4) Auswahlrand + Punktzahl
  if (auswahl && formen[auswahl]) {
    svg += '<g class="auswahl-rand" aria-hidden="true">';
    formen[auswahl].forEach(function (d) { svg += spiegeln(f(d), "auswahl-pfad"); });
    svg += "</g>";
    if (scoreText && SCORE_POSITION[seite][auswahl]) {
      const pos = SCORE_POSITION[seite][auswahl];
      svg += '<g class="score-label" aria-hidden="true"><rect x="' + (pos[0] - 24) + '" y="' + (pos[1] - 9) + '" width="48" height="18" rx="9"/><text x="' + pos[0] + '" y="' + (pos[1] + 4) + '" text-anchor="middle">' + scoreText + "</text></g>";
    }
  }
  svg += "</svg>";
  return svg;
}

// ---------- Liniendiagramm (reines SVG, ohne Bibliothek) ----------
function liniendiagrammSvg(punkte, beschreibung) {
  const b = 320, h = 170, links = 32, rechts = 14, oben = 16, unten = 30;
  const nutzbarB = b - links - rechts, nutzbarH = h - oben - unten;
  function xPos(i) { return links + (punkte.length === 1 ? nutzbarB / 2 : (i / (punkte.length - 1)) * nutzbarB); }
  function yPos(wert) { return oben + nutzbarH - (wert / 100) * nutzbarH; }
  let svg = '<svg class="diagramm" viewBox="0 0 ' + b + " " + h + '" role="img" aria-label="' + esc(beschreibung) + '">';
  [0, 50, 100].forEach(function (wert) {
    svg += '<line class="gitter" x1="' + links + '" x2="' + (b - rechts) + '" y1="' + yPos(wert) + '" y2="' + yPos(wert) + '"/><text x="' + (links - 6) + '" y="' + (yPos(wert) + 4) + '" text-anchor="end">' + wert + "</text>";
  });
  let linie = "";
  punkte.forEach(function (p, i) { linie += (i === 0 ? "M" : "L") + xPos(i).toFixed(1) + "," + yPos(p.score).toFixed(1) + " "; });
  svg += '<path class="linie" d="' + linie + '"/>';
  punkte.forEach(function (p, i) {
    const letzter = i === punkte.length - 1;
    svg += '<circle class="punkt' + (letzter ? " aktuell" : "") + '" cx="' + xPos(i).toFixed(1) + '" cy="' + yPos(p.score).toFixed(1) + '" r="' + (letzter ? 5 : 3.5) + '"><title>' + datumAnzeige(p.datum) + ": " + p.score + " Punkte</title></circle>";
  });
  const letzterPunkt = punkte[punkte.length - 1];
  svg += '<text x="' + xPos(punkte.length - 1) + '" y="' + (yPos(letzterPunkt.score) - 10) + '" text-anchor="end" style="font-weight:700;fill:#1f2a24">' + letzterPunkt.score + "</text>";
  svg += '<text x="' + links + '" y="' + (h - 8) + '" text-anchor="start">' + datumAnzeige(punkte[0].datum) + '</text><text x="' + (b - rechts) + '" y="' + (h - 8) + '" text-anchor="end">' + datumAnzeige(letzterPunkt.datum) + "</text>";
  return svg + "</svg>";
}

function ringSvg(score, status) {
  const umfang = 2 * Math.PI * 42;
  return '<svg class="ring" viewBox="0 0 110 110" role="img" aria-label="Score ' + score + ' von 100"><circle class="ring-hintergrund" cx="55" cy="55" r="42"/>' +
    '<circle class="ring-wert" cx="55" cy="55" r="42" stroke="' + STATUS_FARBE[status] + '" stroke-dasharray="' + (umfang * score / 100).toFixed(1) + " " + umfang.toFixed(1) + '"/>' +
    '<text class="ring-zahl" x="55" y="58">' + score + '</text><text class="ring-klein" x="55" y="74">von 100</text></svg>';
}
