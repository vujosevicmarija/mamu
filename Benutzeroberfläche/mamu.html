  const erg = d.ergebnis;
  let html = '<div class="profil-innen"><div class="profil-kopf"><button type="button" class="knopf rund" data-aktion="profil-zurueck" aria-label="Zurück zur Körperansicht">' +
    '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>' +
    '<h2 id="profil-titel" tabindex="-1">' + esc(gruppe) + "</h2></div>";

  if (!d.hatDaten) {
    html += '<div class="karte leer-zustand"><h3>Noch keine Daten</h3><p>Für diese Muskelgruppe wurde noch kein Training gespeichert.</p>' +
      '<button type="button" class="knopf primaer" data-aktion="erstes-training" data-gruppe="' + esc(gruppe) + '">Erstes Training hinzufügen</button></div>';
  } else {
    const berechnungsListe = fuerBerechnung(d.einheiten);
    const tage = zaehleTrainingstage(berechnungsListe, bezugsdatum());
    const hoechstesGewicht = hoechsterWert(berechnungsListe, "gewicht");
    const t = erg.teilpunkte;
    html += '<div class="karte"><div class="score-bereich">' + ringSvg(erg.score, erg.status) +
      '<div><div class="leise">Trainings-Score</div><span class="status-plakette ' + STATUS_KLASSE[erg.status] + '">' + erg.status + "</span></div></div></div>";
    if (erg.hinweis) {
      html += '<div class="meldung warnung">Es ist noch kein Körpergewicht gespeichert. Die relative Trainingsleistung kann deshalb nicht berechnet werden. ' +
        '<button type="button" class="knopf klein" data-aktion="bereich" data-wert="mehr">Körpergewicht eintragen</button></div>';
    }
    html += '<div class="karte"><h2>Kennzahlen</h2><div class="kennzahlen">' +
      kennzahlHtml("Trainingshäufigkeit", tage + " von " + ZIEL_TRAININGSTAGE + " Tagen", "letzte " + BETRACHTETE_TAGE + " Tage · " + zahlText(t.haeufigkeit) + " / " + MAX_HAEUFIGKEIT + " Punkte") +
      kennzahlHtml("Relative Leistung", daten.kg ? (hoechstesGewicht / daten.kg).toLocaleString("de-DE", { maximumFractionDigits: 2 }) + " × Körpergewicht" : "nicht berechenbar", "höchstes Gewicht · " + zahlText(t.relativeLeistung) + " / " + MAX_RELATIVE_LEISTUNG + " Punkte") +
      kennzahlHtml("Wiederholungen", hoechsterWert(berechnungsListe, "wiederholungen") + " pro Satz", "Höchstwert · " + zahlText(t.wiederholungen) + " / " + MAX_WIEDERHOLUNGEN + " Punkte") +
      kennzahlHtml("Sätze", String(hoechsterWert(berechnungsListe, "saetze")), "Höchstwert · " + zahlText(t.saetze) + " / " + MAX_SAETZE + " Punkte") +
      "</div></div>";
    // Entwicklung über die Zeit
    const verlauf = verlaufFuerGruppe(d.einheiten, daten.kg);
    html += '<div class="karte"><h2>Entwicklung</h2>';
    if (verlauf.length < 2) {
      html += '<p class="leise">Noch kein Verlauf: Für das Liniendiagramm werden Einträge von mindestens zwei Trainingstagen benötigt.</p>' +
        '<div class="vergleich"><div><div class="name">Aktuell</div><div class="wert">' + erg.score + "</div></div><div><div class=\"name\">Vorher</div><div class=\"wert\">–</div></div><div><div class=\"name\">Veränderung</div><div class=\"wert\">–</div></div></div>";
    } else {
      const aktuell = verlauf[verlauf.length - 1].score, vorher = verlauf[verlauf.length - 2].score;
      let veraenderung = "–";
      if (vorher > 0) {
        const prozent = Math.round((aktuell - vorher) / vorher * 1000) / 10;
        veraenderung = (prozent > 0 ? "+" : "") + prozent.toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " %";
      }
      html += liniendiagrammSvg(verlauf, "Verlauf des Scores von " + gruppe + ": " + verlauf.map(function (p) { return datumAnzeige(p.datum) + " " + p.score; }).join(", ")) +
        '<div class="vergleich"><div><div class="name">Aktueller Score</div><div class="wert">' + aktuell + '</div></div><div><div class="name">Vorheriger Score</div><div class="wert">' + vorher +
        '</div></div><div><div class="name">Veränderung</div><div class="wert">' + veraenderung + "</div></div></div>";
    }
    html += '<p class="leise" style="margin-top:8px">Entwicklungspunkte (Verbesserungen bei gleichen Übungen): ' + t.entwicklung + " / 30</p></div>";
  }

  // Übungsempfehlungen (Ziel aus den Einstellungen, Status aus dem Score)
  const ziel = holeEinstellungen().trainingsziel;
  const empfehlung = waehleUebungen(gruppe, ziel, statusFuerEmpfehlung(erg.status));
  html += '<div class="karte"><h2>Übungsempfehlungen</h2>';
  if (!empfehlung.ok) {
    html += '<div class="meldung fehler">' + esc(empfehlung.fehler) + "</div>";
  } else {
    html += '<p class="leise">Trainingsziel: ' + esc(empfehlung.trainingsziel) + " · Status: " + esc(d.hatDaten ? erg.status : "noch keine Daten (Starter-Empfehlung)") + '</p><div class="empfehlungen">';
    empfehlung.uebungen.forEach(function (u) {
      html += '<div class="uebungskarte"><div class="uebungsbild" role="img" aria-label="Platzhalterbild"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg></div><div><div class="titel">' + esc(u.name) +
        '</div><div class="info">Beanspruchte Muskelgruppe: ' + esc(gruppe) + '</div><div class="info"><strong>' + u.saetze + " Sätze · " + esc(u.wiederholungen) + " Wiederholungen</strong></div></div></div>";
    });
    html += "</div>";
    if (empfehlung.hinweis) html += '<div class="meldung warnung" style="margin-top:10px">' + esc(empfehlung.hinweis) + "</div>";
  }
  html += "</div></div>";
  el.innerHTML = html;
}


/* ======================================================================
   H. TRAINING: Übersicht und Erfassung in vier Schritten
   1 Muskelgruppe  ->  2 Übungen  ->  3 Sätze/Wiederholungen/Gewicht  ->  4 Speichern
   Die Eingabefelder eines Schrittes werden nur beim Schrittwechsel neu aufgebaut,
   nie während des Tippens (so gehen Eingaben und Fokus nicht verloren).
   ====================================================================== */

function renderTrainingUebersicht() {
  const einheiten = daten.einheiten;
  const heute = bezugsdatum();
  const tage30 = zaehleTrainingstage(fuerBerechnung(einheiten), heute);
  // Anzahl verschiedener Trainingstage insgesamt
  const verschiedeneTage = {};
  einheiten.forEach(function (e) { verschiedeneTage[e.datum] = true; });
  let html = '<div class="kennzahl-zeile"><div class="kennzahl"><div class="name">Trainingstage insgesamt</div><div class="wert">' + Object.keys(verschiedeneTage).length +
    '</div></div><div class="kennzahl"><div class="name">Trainingshäufigkeit</div><div class="wert">' + tage30 + ' von ' + ZIEL_TRAININGSTAGE + '</div><div class="punkte">Tage in den letzten ' + BETRACHTETE_TAGE + ' Tagen</div></div></div>';
  html += '<button type="button" class="knopf primaer breit" data-aktion="training-starten">Training starten</button>';
  html += '<div class="karte" style="margin-top:14px"><h2>Zuletzt absolviert</h2>';
  const sitzungen = gruppiereSitzungen(einheiten).slice(0, 10);
  if (sitzungen.length === 0) {
    html += '<div class="leer-zustand"><p>Noch keine Trainingseinheiten gespeichert.</p></div>';
  } else {
    sitzungen.forEach(function (s) {
      const ids = s.eintraege.map(function (e) { return e.id; }).join(",");
      html += '<div class="sitzung"><div class="sitzung-kopf"><strong>' + esc(s.muskelgruppe) + '</strong><span class="leise">' + datumAnzeige(s.datum) + '</span></div><ul>';
      s.eintraege.forEach(function (e) {
        html += "<li>" + esc(e.uebung) + ": " + e.saetze + " × " + e.wiederholungen + (e.gewicht === null ? ", ohne Gewichtsangabe" : ", " + zahlText(e.gewicht) + " kg") + "</li>";
      });
      html += '</ul><button type="button" class="knopf gefahr klein" style="margin-top:8px" data-aktion="sitzung-loeschen" data-ids="' + ids + '" aria-label="Einheit ' + esc(s.muskelgruppe) + " vom " + datumAnzeige(s.datum) + ' löschen">Löschen</button></div>';
    });
  }
  html += "</div>";
  $("training-uebersicht").innerHTML = html;
}

function zeigeTrainingUebersicht() {
  $("training-wizard").hidden = true;
  $("training-uebersicht").hidden = false;
  zustand.training = { schritt: 0, gruppe: null, uebungen: [], felder: {}, datum: "" };
  renderTrainingUebersicht();
}

function starteTraining(gruppe) {
  zustand.training = { schritt: gruppe ? 2 : 1, gruppe: gruppe || null, uebungen: [], felder: {}, datum: "" };
  $("training-uebersicht").hidden = true;
  $("training-wizard").hidden = false;
  renderWizard();
}

function schrittAnzeige(schritt, titel) {
  let balken = '<div class="schritte" aria-hidden="true">';
  for (let i = 1; i <= 4; i++) balken += '<span class="' + (i < schritt ? "fertig" : i === schritt ? "aktiv" : "") + '"></span>';
  return balken + '</div><p class="leise">Schritt ' + schritt + " von 4</p><h2 id=\"wizard-titel\" tabindex=\"-1\">" + titel + "</h2>";
}

function renderWizard(meldung) {
  const t = zustand.training;
  const el = $("training-wizard");
  let html = '<div class="karte">';
  if (t.schritt === 1) {
    html += schrittAnzeige(1, "Muskelgruppe wählen") + '<div class="gruppenraster" role="group" aria-label="Muskelgruppen">';
    MUSKELGRUPPEN.forEach(function (g) {
      html += '<button type="button" class="gruppenknopf" data-aktion="wizard-gruppe" data-gruppe="' + esc(g) + '" aria-pressed="' + (t.gruppe === g) + '">' + esc(g) + "</button>";
    });
    html += "</div>";
  } else if (t.schritt === 2) {
    html += schrittAnzeige(2, "Übungen für „" + esc(t.gruppe) + "“") + '<p class="leise">Wähle eine oder mehrere Übungen aus dem Katalog oder lege eine eigene Übung an.</p><div class="chip-liste">';
    holeKatalogNamen(t.gruppe).forEach(function (name, i) {
      html += '<button type="button" class="chip" data-aktion="wizard-uebung" data-name="' + esc(name) + '" aria-pressed="' + (t.uebungen.indexOf(name) !== -1) + '"><span class="haken"></span><span><span class="chip-name">' + esc(name) +
        '</span><span class="chip-text">' + esc(uebungskatalog[t.gruppe][i].beschreibung) + "</span></span></button>";
    });
    holeEigeneUebungen(t.gruppe).forEach(function (name) {
      html += '<div style="display:flex;gap:8px;align-items:stretch"><button type="button" class="chip" data-aktion="wizard-uebung" data-name="' + esc(name) + '" aria-pressed="' + (t.uebungen.indexOf(name) !== -1) +
        '"><span class="haken"></span><span><span class="chip-name">' + esc(name) + '</span><span class="chip-text">Eigene Übung</span></span></button>' +
        '<button type="button" class="knopf gefahr klein" style="align-self:center" data-aktion="eigene-loeschen" data-name="' + esc(name) + '" aria-label="Eigene Übung ' + esc(name) + ' löschen">Löschen</button></div>';
    });
    html += '</div><form id="eigene-form" novalidate style="margin-top:16px"><div class="feld"><label class="feld-name" for="e-name">Eigene Übung erstellen</label>' +
      '<input type="text" id="e-name" data-regel="eigeneUebung" autocomplete="off" aria-describedby="e-name-fehler" placeholder="z. B. Kabel-Flys">' +
      '<div id="e-name-fehler" class="fehlertext" role="alert"></div></div><button type="submit" class="knopf">Übung speichern</button></form>';
  } else if (t.schritt === 3) {
    html += '<form id="wizard-form" novalidate>' + schrittAnzeige(3, "Sätze, Wiederholungen und Gewicht") +
      '<div class="feld"><label class="feld-name" for="t-datum">Datum des Trainings</label>' +
      '<input type="date" id="t-datum" data-regel="datum" required aria-required="true" max="' + letztesErlaubtesDatum() + '" value="' + esc(t.felder["t-datum"] || "") + '" aria-describedby="t-datum-fehler t-datum-hilfe">' +
      '<div id="t-datum-hilfe" class="hilfetext">Spätestes erlaubtes Datum: heute (' + datumAnzeige(letztesErlaubtesDatum()) + ")</div><div id=\"t-datum-fehler\" class=\"fehlertext\" role=\"alert\"></div></div>";
    t.uebungen.forEach(function (name, i) {
      html += '<fieldset class="eingabe-uebung" style="margin-inline:0"><legend><strong>' + esc(name) + "</strong></legend><div class=\"feld-reihe\">" +
        feldHtml("t-saetze-" + i, "Sätze", "saetze", "numeric", "[0-9]+", true, t.felder["t-saetze-" + i]) +
        feldHtml("t-wdh-" + i, "Wiederholungen", "wiederholungen", "numeric", "[0-9]+", true, t.felder["t-wdh-" + i]) +
        feldHtml("t-gewicht-" + i, 'Gewicht (kg) <span class="zusatz">optional</span>', "trainingsgewicht", "decimal", "[0-9]+([.,][0-9])?", false, t.felder["t-gewicht-" + i]) +
        '</div><p class="hilfetext">Gewicht leer lassen, wenn keines verwendet wurde. Es wird dann nicht als 0 kg gespeichert.</p></fieldset>';
    });
  } else if (t.schritt === 4) {
    html += schrittAnzeige(4, "Zusammenfassung") + '<p>Muskelgruppe: <strong>' + esc(t.gruppe) + "</strong> · Datum: <strong>" + esc(datumAnzeige(t.felder["t-datum"])) + "</strong></p><ul>";
    t.uebungen.forEach(function (name, i) {
      const g = t.felder["t-gewicht-" + i];
      html += "<li><strong>" + esc(name) + "</strong>: " + esc(t.felder["t-saetze-" + i]) + " Sätze × " + esc(t.felder["t-wdh-" + i]) + " Wdh., " + (String(g || "").trim() === "" ? "ohne Gewichtsangabe" : esc(g) + " kg") + "</li>";
    });
    html += "</ul>";
  }
  if (meldung) html += '<div class="meldung fehler" role="alert">' + esc(meldung) + "</div>";
  // Knopfleiste je Schritt
  if (t.schritt === 1) {
    html += '<div class="knopf-reihe"><button type="button" class="knopf" data-aktion="wizard-abbrechen">Abbrechen</button><button type="button" class="knopf primaer" data-aktion="wizard-weiter">Weiter</button></div>';
  } else if (t.schritt === 2) {
    html += '<div class="knopf-reihe"><button type="button" class="knopf" data-aktion="wizard-zurueck">Zurück</button><button type="button" class="knopf primaer" data-aktion="wizard-weiter">Weiter</button></div>';
  } else if (t.schritt === 3) {
    html += '<div class="knopf-reihe"><button type="button" class="knopf" data-aktion="wizard-zurueck">Zurück</button><button type="submit" class="knopf primaer">Weiter</button></div></form>';
  } else {
    html += '<div class="knopf-reihe"><button type="button" class="knopf" data-aktion="wizard-zurueck">Zurück</button><button type="button" class="knopf primaer" id="wizard-speichern" data-aktion="training-speichern">Training speichern</button></div>';
  }
  html += "</div>";
  el.innerHTML = html;
  const titel = $("wizard-titel");
  if (titel) titel.focus({ preventScroll: false });
}

// Baut ein Eingabefeld samt Fehlerzeile
function feldHtml(id, beschriftung, regel, modus, muster, pflicht, wert) {
  return '<div class="feld"><label class="feld-name" for="' + id + '">' + beschriftung + '</label><input type="text" id="' + id + '" data-regel="' + regel + '" inputmode="' + modus + '" pattern="' + muster + '" autocomplete="off"' +
    (pflicht ? ' required aria-required="true"' : "") + ' value="' + esc(wert || "") + '" aria-describedby="' + id + '-fehler"><div id="' + id + '-fehler" class="fehlertext" role="alert"></div></div>';
}

function wizardWeiter() {
  const t = zustand.training;
  if (t.schritt === 1) {
    if (!t.gruppe) return renderWizard("Bitte zuerst eine Muskelgruppe auswählen.");
    t.schritt = 2;
  } else if (t.schritt === 2) {
    if (t.uebungen.length === 0) return renderWizard("Bitte mindestens eine Übung auswählen.");
    t.schritt = 3;
  } else if (t.schritt === 3) {
    const ergebnis = pruefeFormular($("wizard-form"));
    if (!ergebnis.ok) return;
    t.schritt = 4;
  }
  renderWizard();
}

function wizardZurueck() {
  const t = zustand.training;
  if (t.schritt > 1) { t.schritt--; renderWizard(); }
}

// Endgültiges Speichern: Die Werte werden hier noch einmal aus den ROH-Texten geprüft,
// unabhängig davon, was im Formular steht.
// Asynchron: Die Erfolgsmeldung erscheint erst, wenn der Server das Speichern bestätigt hat.
async function speichereTraining() {
  if (zustand.speichertGerade || Date.now() < zustand.klickSperreBis) return;   // Schutz gegen Doppelklick
  zustand.speichertGerade = true;
  const knopf = $("wizard-speichern");
  if (knopf) { knopf.disabled = true; knopf.textContent = "Wird gespeichert …"; }
  try {
    const t = zustand.training;
    const datum = pruefeDatum(t.felder["t-datum"], true, false);
    const neue = [];
    let fehler = datum.ok ? "" : datum.fehler;
    for (let i = 0; i < t.uebungen.length && fehler === ""; i++) {
      const saetze = FELD_REGELN.saetze(t.felder["t-saetze-" + i]);
      const wdh = FELD_REGELN.wiederholungen(t.felder["t-wdh-" + i]);
      const gewicht = FELD_REGELN.trainingsgewicht(t.felder["t-gewicht-" + i]);
      if (!saetze.ok || !wdh.ok || !gewicht.ok) { fehler = "Bitte die Angaben zu „" + t.uebungen[i] + "“ prüfen."; break; }
      neue.push({ muskelgruppe: t.gruppe, uebung: t.uebungen[i], gewicht: gewicht.wert, wiederholungen: wdh.wert, saetze: saetze.wert, datum: datum.wert });
    }
    if (fehler === "" && (neue.length === 0 || MUSKELGRUPPEN.indexOf(t.gruppe) === -1)) fehler = "Es gibt nichts zu speichern.";
    if (fehler !== "") {
      t.schritt = 3;
      renderWizard(fehler);
      pruefeFormular($("wizard-form"));
      return;
    }
    const ergebnis = await speichereEinheiten(neue);       // wartet auf die Antwort des Servers
    if (!ergebnis.ok) { renderWizard(ergebnis.fehler); return; }
    zeigeTrainingUebersicht();
    aktualisiereAlles();
    zeigeToast("Training gespeichert.");
    $("titel-training").focus();
  } finally {
    zustand.speichertGerade = false;
    zustand.klickSperreBis = Date.now() + 700;
  }
}

let eigeneUebungWirdGespeichert = false;
async function speichereEigeneUebungAusFormular() {
  if (eigeneUebungWirdGespeichert) return;           // Schutz gegen doppeltes Absenden
  const feld = $("e-name");
  const ergebnis = pruefeFeld(feld);
  if (!ergebnis.ok) { feld.focus(); return; }
  const gruppe = zustand.training.gruppe;
  eigeneUebungWirdGespeichert = true;
  let gespeichert;
  try {
    gespeichert = await speichereEigeneUebung(gruppe, ergebnis.wert);
  } finally {
    eigeneUebungWirdGespeichert = false;
  }
  if (!gespeichert.ok) {
    if ($("e-name")) zeigeFeldFehler($("e-name"), gespeichert.fehler); else zeigeToast(gespeichert.fehler);
    return;
  }
  if (zustand.training.gruppe !== gruppe || zustand.training.schritt !== 2) { zeigeToast("Eigene Übung gespeichert."); return; }
  zustand.training.uebungen.push(ergebnis.wert);     // neue Übung gleich auswählen
  renderWizard();
  zeigeToast("Eigene Übung gespeichert.");
}


/* ======================================================================
   I. STATISTIKEN
   Zeitraum (von/bis) wählen; es werden nur echte gespeicherte Daten gezeigt.
   ====================================================================== */

function tagDavor(iso) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() - 1);
  return d.toISOString().slice(0, 10);
}

function renderStatistik() {
  const el = $("statistik-inhalt");
  const einheiten = daten.einheiten;
  if (einheiten.length === 0) {
    el.innerHTML = '<div class="karte leer-zustand"><h2>Noch keine Statistiken</h2><p>Sobald du Trainingseinheiten speicherst, erscheinen hier Häufigkeit, Score-Entwicklung und Fortschritt.</p>' +
      '<button type="button" class="knopf primaer" data-aktion="training-starten">Training starten</button></div>';
    return;
  }
  const s = zustand.statistik;
  const alleDaten = einheiten.map(function (e) { return e.datum; }).sort();
  if (!s.angepasst) { s.von = alleDaten[0]; s.bis = alleDaten[alleDaten.length - 1]; }
  const gruppenMitDaten = MUSKELGRUPPEN.filter(function (g) { return daten.gruppen[g].hatDaten; });
  if (gruppenMitDaten.indexOf(s.gruppe) === -1) s.gruppe = gruppenMitDaten[0];
  let optionen = "";
  gruppenMitDaten.forEach(function (g) { optionen += "<option" + (g === s.gruppe ? " selected" : "") + ">" + esc(g) + "</option>"; });
  el.innerHTML = '<form id="stat-form" class="karte" novalidate><h2>Zeitraum</h2><div class="feld-reihe zwei">' +
    '<div class="feld"><label class="feld-name" for="s-von">Von</label><input type="date" id="s-von" data-regel="datum" max="' + letztesErlaubtesDatum() + '" value="' + esc(s.von) + '" aria-describedby="s-von-fehler"><div id="s-von-fehler" class="fehlertext" role="alert"></div></div>' +
    '<div class="feld"><label class="feld-name" for="s-bis">Bis</label><input type="date" id="s-bis" data-regel="datum" max="' + letztesErlaubtesDatum() + '" value="' + esc(s.bis) + '" aria-describedby="s-bis-fehler"><div id="s-bis-fehler" class="fehlertext" role="alert"></div></div></div>' +
    '<div class="feld" style="margin-bottom:0"><label class="feld-name" for="s-gruppe">Muskelgruppe für das Diagramm</label><select id="s-gruppe">' + optionen + "</select></div></form>" +
    '<div id="stat-ergebnis"></div>';
  renderStatistikErgebnis();
}

function renderStatistikErgebnis() {
  const ziel = $("stat-ergebnis");
  if (!ziel) return;
  const von = pruefeDatum($("s-von").value, true, $("s-von").validity.badInput);
  const bis = pruefeDatum($("s-bis").value, true, $("s-bis").validity.badInput);
  if (!von.ok || !bis.ok) { ziel.innerHTML = '<div class="meldung info">Bitte einen gültigen Zeitraum eingeben.</div>'; return; }
  if (von.wert > bis.wert) {
    zeigeFeldFehler($("s-bis"), "Das Enddatum darf nicht vor dem Startdatum liegen.");
    ziel.innerHTML = '<div class="meldung info">Bitte einen gültigen Zeitraum eingeben.</div>';
    return;
  }
  zeigeFeldFehler($("s-bis"), "");
  zustand.statistik.von = von.wert; zustand.statistik.bis = bis.wert;
  const imZeitraum = daten.einheiten.filter(function (e) { return e.datum >= von.wert && e.datum <= bis.wert; });
  const tage = {};
  imZeitraum.forEach(function (e) { tage[e.datum] = true; });
  const anzahlTage = Object.keys(tage).length;
  const zeitraumTage = tageZwischen(von.wert, bis.wert) + 1;
  const proWoche = anzahlTage / (zeitraumTage / 7);
  const haeufigkeit30 = zaehleTrainingstage(fuerBerechnung(daten.einheiten), bezugsdatum());

  let html = '<div class="karte"><h2>Überblick</h2><div class="kennzahlen">' +
    kennzahlHtml("Trainingseinheiten", String(imZeitraum.length), "gespeicherte Einträge im Zeitraum") +
    kennzahlHtml("Trainingstage", String(anzahlTage), "im gewählten Zeitraum") +
    kennzahlHtml("Ø pro Woche", proWoche.toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " Tage", "im gewählten Zeitraum") +
    kennzahlHtml("Trainingshäufigkeit", haeufigkeit30 + " von " + ZIEL_TRAININGSTAGE + " Tagen", "letzte " + BETRACHTETE_TAGE + " Tage (wie im Score)") + "</div></div>";

  html += '<div class="karte"><h2>Fortschritt je Muskelgruppe</h2>';
  let zeilen = "";
  MUSKELGRUPPEN.forEach(function (g) {
    const liste = daten.gruppen[g].einheiten;
    const ende = scoreBis(liste, daten.kg, bis.wert);
    if (ende === null) return;
    const start = scoreBis(liste, daten.kg, tagDavor(von.wert));
    const status = bestimmeStatus(ende, true).status;
    let aenderung = '<span class="leise">neu</span>';
    if (start !== null) {
      const diff = ende - start;
      aenderung = '<span class="' + (diff > 0 ? "pos" : diff < 0 ? "neg" : "") + '">' + (diff > 0 ? "+" : "") + diff + "</span>";
    }
    zeilen += '<div class="balkenzeile"><span>' + esc(g) + '</span><div class="balken" role="img" aria-label="' + esc(g) + ": " + ende + ' von 100"><span style="width:' + ende + "%;background:" + STATUS_FARBE[status] + '"></span></div><span class="aenderung">' + ende + " · " + aenderung + "</span></div>";
  });
  html += zeilen === "" ? '<p class="leise">Für diesen Zeitraum liegen noch keine Daten vor.</p>' : zeilen + '<p class="leise">Zahl = Score am Ende des Zeitraums, Änderung = Unterschied zum Score davor („neu“ = erste Einträge im Zeitraum).</p>';
  html += "</div>";

  const gruppe = $("s-gruppe").value;
  const verlauf = verlaufFuerGruppe(daten.gruppen[gruppe].einheiten, daten.kg).filter(function (p) { return p.datum >= von.wert && p.datum <= bis.wert; });
  html += '<div class="karte"><h2>Score-Entwicklung: ' + esc(gruppe) + "</h2>";
  html += verlauf.length < 2 ? '<p class="leise">Für ein Diagramm werden Einträge von mindestens zwei Trainingstagen im Zeitraum benötigt.</p>' :
    liniendiagrammSvg(verlauf, "Score-Verlauf " + gruppe + ": " + verlauf.map(function (p) { return datumAnzeige(p.datum) + " " + p.score; }).join(", "));
  html += "</div>";
  ziel.innerHTML = html;
}

function aktualisiereAktivitaetsstufe() {
  const feld = $("n-uebungen");
  const hinweis = $("n-stufe");
  if (!feld || !hinweis) return;
  const ergebnis = FELD_REGELN.uebungenProTag(feld.value);

function zeigeErnaehrungsErgebnis(erg) {
  $("n-ergebnis").innerHTML = '<div class="karte beige"><h2>Ergebnis</h2><div class="kennzahlen">' +
    kennzahlHtml("Täglicher Kalorienbedarf", erg.kalorien.toLocaleString("de-DE") + " kcal", "Ziel: " + esc(erg.ziel)) +
    kennzahlHtml("Täglicher Proteinbedarf", erg.protein.toLocaleString("de-DE") + " g", "Ziel: " + esc(erg.ziel)) + '</div>' +
    '<p class="leise" style="margin-top:10px">Vereinfachte Projektvorgabe, kein individuell abgestimmter Ernährungsplan.</p></div>';
}

function berechneErnaehrungAusFormular() {
  const ergebnis = pruefeFormular($("n-form"));
  if (!ergebnis.ok) return;
  const ziel = $("n-ziel").value;
  const gewicht = ergebnis.werte["n-gewicht"];
  const uebungen = ergebnis.werte["n-uebungen"];
  const berechnet = berechneErnaehrung(gewicht, uebungen, ziel);      // vorhandener Algorithmus, unverändert
  if (!berechnet.ok) {
    $("n-ergebnis").innerHTML = '<div class="meldung fehler" role="alert">' + esc(berechnet.fehler) + "</div>";
    return;
  }
  zustand.ernaehrung.ergebnis = { kalorien: berechnet.kalorien, protein: berechnet.protein, ziel: ziel };
  zeigeErnaehrungsErgebnis(zustand.ernaehrung.ergebnis);
  // Das gewählte Ziel wird (wie bisher) als Trainingsziel gemerkt. Die Berechnung selbst
  // braucht den Server nicht; schlägt nur das Speichern fehl, erscheint ein Hinweis.
  if (holeEinstellungen().trainingsziel !== ziel) {
    speichereEinstellungen({ trainingsziel: ziel }).then(function (gespeichert) {
      if (!gespeichert.ok) zeigeToast("Das Trainingsziel konnte nicht gespeichert werden. " + gespeichert.fehler);
    });
  }
}

function uebernehmeUebungenAusDaten() {
  if (daten.einheiten.length === 0) { zeigeToast("Noch keine Trainingsdaten vorhanden."); return; }
  const letzterTag = daten.einheiten.map(function (e) { return e.datum; }).sort().pop();
  const anzahl = zaehleUebungenAmTag(fuerBerechnung(daten.einheiten), letzterTag);
  const feld = $("n-uebungen");
  feld.value = String(anzahl);
  zustand.eingaben["n-uebungen"] = feld.value;
  pruefeFeld(feld);
  aktualisiereAktivitaetsstufe();
  $("n-ergebnis").innerHTML = "";
  zustand.ernaehrung.ergebnis = null;
  zeigeToast("Übernommen: " + anzahl + " Übungen am " + datumAnzeige(letzterTag) + ".");
}

// Sperrt den Absende-Knopf eines Formulars, solange der Server antwortet
function sperreKnopf(formular, gesperrt) {
  const knopf = formular ? formular.querySelector('[type="submit"]') : null;
  if (knopf) knopf.disabled = gesperrt;
}

// Name, Alter, Größe und Körpergewicht werden gemeinsam in profil.json gespeichert (ein einziger Speichervorgang).
// Andere Felder in profil.json bleiben erhalten.
async function speichereAngabenAusFormular() {
  const formular = $("m-form");
  const ergebnis = pruefeFormular(formular);
  if (!ergebnis.ok) return;
  const w = ergebnis.werte;
  sperreKnopf(formular, true);
  const gespeichert = await speichereProfil({
    name: w["m-name"], alter: w["m-alter"], groesse: w["m-groesse"],
    koerpergewicht: w["m-gewicht"]                      // leer -> null (nicht 0)
  });
  sperreKnopf(formular, false);
  if (!gespeichert.ok) { zeigeToast(gespeichert.fehler); return; }
  ["m-name", "m-alter", "m-groesse", "m-gewicht"].forEach(function (id) { delete zustand.eingaben[id]; });
  aktualisiereAlles();
  zeigeToast("Angaben gespeichert.");
}

async function speichereEinstellungenAusFormular() {
  const formular = $("m-einst-form");
  const ansicht = $("m-ansicht").value === "frau" ? "frau" : "mann";
  const ziel = $("m-ziel").value;
  if (!trainingsziele[ziel]) { zeigeToast("Einstellungen konnten nicht gespeichert werden."); return; }
  sperreKnopf(formular, true);
  const gespeichert = await speichereEinstellungen({ koerper: ansicht, trainingsziel: ziel });
  sperreKnopf(formular, false);
  if (!gespeichert.ok) { zeigeToast(gespeichert.fehler); return; }
  zustand.geschlecht = ansicht;
  delete zustand.eingaben["n-ziel"];
  aktualisiereAlles();
  zeigeToast("Einstellungen gespeichert.");
}

/* ======================================================================
   L. NAVIGATION, EREIGNISSE UND START
   ====================================================================== */

const BEREICHE = ["koerper", "training", "statistik", "ernaehrung", "mehr"];

function zeigeBereich(name, mitFokus) {
  zustand.bereich = name;
  BEREICHE.forEach(function (b) { $("bereich-" + b).hidden = (b !== name); });
  document.querySelectorAll('[data-aktion="bereich"]').forEach(function (knopf) {
    if (knopf.dataset.wert === name) knopf.setAttribute("aria-current", "page"); else knopf.removeAttribute("aria-current");
  });
  if (name === "training" && !$("training-uebersicht").hidden) renderTrainingUebersicht();
  if (name === "statistik") renderStatistik();
  if (name === "ernaehrung") renderErnaehrung();
  if (name === "mehr") renderMehr();
  window.scrollTo(0, 0);
  if (mitFokus) $("titel-" + name).focus({ preventScroll: true });
}

function aktualisiereAlles() {
  aktualisiereDaten();
  renderKoerper();
  if ($("training-wizard").hidden) renderTrainingUebersicht();
  renderStatistik();
  renderErnaehrung();
  renderMehr();
}

// ---------- Bestätigungsdialog (statt window.confirm) ----------
function bestaetige(titel, text, okText) {
  return new Promise(function (fertig) {
    const dialog = $("dialog");
    $("dialog-titel").textContent = titel;
    $("dialog-text").textContent = text;
    $("dialog-ja").textContent = okText || "OK";
    let erledigt = false;
    function beende(antwort) {
      if (erledigt) return;
      erledigt = true;
      if (dialog.open) dialog.close();
      $("dialog-ja").onclick = null; $("dialog-nein").onclick = null; dialog.onclose = null;
      fertig(antwort);
    }
    $("dialog-ja").onclick = function () { beende(true); };
    $("dialog-nein").onclick = function () { beende(false); };
    dialog.onclose = function () { beende(false); };
    dialog.showModal();
    $("dialog-nein").focus();
  });
}

let toastZeitgeber = null;
function zeigeToast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastZeitgeber);
  toastZeitgeber = setTimeout(function () { t.hidden = true; }, 2600);
}

// Merkt sich Eingaben, damit sie beim Wechsel des Bereichs nicht verloren gehen
function merkeFeldWert(feld) {
  if (!feld.id) return;
  if (feld.id.indexOf("t-") === 0) zustand.training.felder[feld.id] = feld.value;
  else if (feld.id.indexOf("m-") === 0 || feld.id.indexOf("n-") === 0) zustand.eingaben[feld.id] = feld.value;
}

// ---------- Klicks ----------
document.addEventListener("click", function (ereignis) {
  const muskel = datenGeladen ? ereignis.target.closest(".muskel") : null;
  if (muskel) {
    waehleMuskelgruppe(muskel.dataset.gruppe, muskel.closest(".koerper-seite").dataset.seite);
    return;
  }
  const knopf = ereignis.target.closest("[data-aktion]");
  if (!knopf || knopf.disabled) return;
  const aktion = knopf.dataset.aktion;
  if (aktion === "neu-laden") { window.location.reload(); return; }
  if (!datenGeladen) return;                       // ohne geladene Daten keine Aktionen
  if (aktion === "bereich") {
    if (knopf.dataset.wert === "koerper" && zustand.bereich === "koerper" && zustand.auswahl) { schliesseProfil(); return; }
    zeigeBereich(knopf.dataset.wert, true);
  } else if (aktion === "geschlecht") {
    const vorher = zustand.geschlecht;
    const neu = knopf.dataset.wert === "frau" ? "frau" : "mann";
    if (neu === vorher) return;
    zustand.geschlecht = neu;
    renderKoerper();                               // sofort umschalten ...
    speichereEinstellungen({ koerper: neu }).then(function (gespeichert) {
      if (gespeichert.ok) return;
      // ... bei einem Speicherfehler wieder zurückschalten (wenn inzwischen nicht neu gewählt wurde)
      if (zustand.geschlecht === neu) { zustand.geschlecht = vorher; renderKoerper(); }
      zeigeToast("Die Körperform konnte nicht gespeichert werden. " + gespeichert.fehler);
    });
  } else if (aktion === "seite") {
    zustand.seite = knopf.dataset.wert === "hinten" ? "hinten" : "vorne";
    renderKoerper();
  } else if (aktion === "profil-zurueck") {
    schliesseProfil();
  } else if (aktion === "erstes-training") {
    const gruppe = knopf.dataset.gruppe;
    zeigeBereich("training", false);
    starteTraining(gruppe);
  } else if (aktion === "training-starten") {
    zeigeBereich("training", false);
    starteTraining(null);
  } else if (aktion === "wizard-gruppe") {
    const gruppe = knopf.dataset.gruppe;
    if (zustand.training.gruppe !== gruppe) { zustand.training.gruppe = gruppe; zustand.training.uebungen = []; zustand.training.felder = {}; }
    document.querySelectorAll('[data-aktion="wizard-gruppe"]').forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.gruppe === gruppe)); });
  } else if (aktion === "wizard-uebung") {
    const name = knopf.dataset.name;
    const liste = zustand.training.uebungen;
    const index = liste.indexOf(name);
    if (index === -1) liste.push(name); else liste.splice(index, 1);
    knopf.setAttribute("aria-pressed", String(index === -1));
  } else if (aktion === "wizard-weiter") {
    wizardWeiter();
  } else if (aktion === "wizard-zurueck") {
    wizardZurueck();
  } else if (aktion === "wizard-abbrechen") {
    zeigeTrainingUebersicht();
  } else if (aktion === "training-speichern") {
    speichereTraining();
  } else if (aktion === "eigene-loeschen") {
    loescheEigeneUebungMitFrage(knopf.dataset.name);
  } else if (aktion === "sitzung-loeschen") {
    loescheSitzungMitFrage(knopf.dataset.ids);
  } else if (aktion === "uebungen-uebernehmen") {
    uebernehmeUebungenAusDaten();
  } else if (aktion === "daten-loeschen") {
    loescheAlleDaten();
  }
});

async function loescheEigeneUebungMitFrage(name) {
  const gruppe = zustand.training.gruppe;
  if (daten.einheiten.some(function (e) { return e.muskelgruppe === gruppe && e.uebung === name; })) {
    zeigeToast("Diese Übung wird in gespeicherten Trainings verwendet und kann nicht gelöscht werden.");
    return;
  }
  if (!(await bestaetige("Eigene Übung löschen?", "„" + name + "“ wird aus deinen eigenen Übungen entfernt.", "Löschen"))) return;
  const geloescht = await loescheEigeneUebung(gruppe, name);
  if (!geloescht.ok) { zeigeToast(geloescht.fehler); return; }
  zeigeToast("Eigene Übung gelöscht.");
  if (zustand.training.gruppe !== gruppe || zustand.training.schritt !== 2) return;
  zustand.training.uebungen = zustand.training.uebungen.filter(function (n) { return n !== name; });
  renderWizard();
}

async function loescheSitzungMitFrage(idText) {
  const ids = String(idText).split(",").map(Number).filter(Number.isSafeInteger);
  if (ids.length === 0) return;
  if (!(await bestaetige("Einheit löschen?", "Diese Trainingseinheit wird dauerhaft gelöscht. Scores und Statistiken werden neu berechnet.", "Löschen"))) return;
  const geloescht = await loescheEinheiten(ids);
  if (!geloescht.ok) { zeigeToast(geloescht.fehler); return; }
  aktualisiereAlles();
  zeigeToast("Einheit gelöscht.");
}

// ---------- Eingaben ----------
function istEingabeFeld(ziel) { return ziel instanceof HTMLInputElement || ziel instanceof HTMLSelectElement; }

document.addEventListener("input", function (ereignis) {
  const feld = ereignis.target;
  if (!istEingabeFeld(feld)) return;
  merkeFeldWert(feld);
  if (feld.dataset.regel) pruefeFeld(feld);            // Prüfung beim Tippen
  nachEingabe(feld);
});
document.addEventListener("change", function (ereignis) {
  const feld = ereignis.target;
  if (!istEingabeFeld(feld)) return;
  merkeFeldWert(feld);
  if (feld.dataset.regel) pruefeFeld(feld);
  nachEingabe(feld);
});
document.addEventListener("focusout", function (ereignis) {      // Prüfung beim Verlassen des Feldes
  const feld = ereignis.target;
  if (!istEingabeFeld(feld) || !feld.dataset.regel) return;
  const ergebnis = pruefeFeld(feld);
  normalisiereFeld(feld, ergebnis);
  merkeFeldWert(feld);
});

function nachEingabe(feld) {
  if (feld.id === "s-von" || feld.id === "s-bis") {
    zustand.statistik.angepasst = true;
    renderStatistikErgebnis();
  } else if (feld.id === "s-gruppe") {
    zustand.statistik.gruppe = feld.value;
    renderStatistikErgebnis();
  } else if (feld.id.indexOf("n-") === 0) {
    if (feld.id === "n-uebungen") aktualisiereAktivitaetsstufe();
    zustand.ernaehrung.ergebnis = null;                  // altes Ergebnis passt nicht mehr
    if ($("n-ergebnis")) $("n-ergebnis").innerHTML = "";
  }
}

// Formulare: Enter-Taste und Schaltfläche verwenden denselben Weg
document.addEventListener("submit", function (ereignis) {
  ereignis.preventDefault();
  if (!datenGeladen) return;
  const id = ereignis.target.id;
  if (id === "wizard-form") wizardWeiter();
  else if (id === "eigene-form") speichereEigeneUebungAusFormular();
  else if (id === "n-form") berechneErnaehrungAusFormular();
  else if (id === "m-form") speichereAngabenAusFormular();
  else if (id === "m-einst-form") speichereEinstellungenAusFormular();
});

// Tastatur: Enter/Leertaste auf einer Muskelgruppe, Esc schließt das Profil
document.addEventListener("keydown", function (ereignis) {
  if (!datenGeladen) return;
  const muskel = ereignis.target.closest ? ereignis.target.closest(".muskel") : null;
  if (muskel && (ereignis.key === "Enter" || ereignis.key === " ")) {
    ereignis.preventDefault();
    waehleMuskelgruppe(muskel.dataset.gruppe, muskel.closest(".koerper-seite").dataset.seite);
  } else if (ereignis.key === "Escape" && zustand.auswahl && !$("dialog").open && zustand.bereich === "koerper") {
    schliesseProfil();
  }
});

// Wischen zwischen Vorder- und Rückseite (nur Handy)
(function () {
  let startX = 0, startY = 0;
  const bereich = $("koerper-bereich");
  bereich.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  bereich.addEventListener("touchend", function (e) {
    if (!datenGeladen || !window.matchMedia("(max-width: 699px)").matches) return;
    const dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      zustand.seite = dx < 0 ? "hinten" : "vorne";
      renderKoerper();
    }
  }, { passive: true });
})();
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });   // kein Zoomen per Geste

// ---------- Start: erst Daten vom Server laden, dann Vorderansicht ohne Auswahl zeigen ----------
(async function start() {
  const status = $("server-status");
  $("bereich-koerper").hidden = true;
  status.innerHTML = '<div class="meldung info">Daten werden vom mamu-Server geladen …</div>';
  status.hidden = false;
  const geladen = await ladeAlleDatenVomServer();
  if (!geladen.ok) {
    // Nichts zeichnen und nichts speichern: So kann kein leerer Zustand echte Daten überschreiben.
    status.innerHTML = '<div class="karte"><h1 tabindex="-1" id="titel-fehler">mamu konnte nicht starten</h1>' +
      '<div class="meldung fehler" role="alert">' + esc(geladen.fehler) + '</div>' +
      '<p class="leise">Es wurden keine Daten verändert.</p>' +
      '<button type="button" class="knopf primaer" data-aktion="neu-laden">Erneut versuchen</button></div>';
    return;
  }
  status.hidden = true;
  status.innerHTML = "";
  zustand.geschlecht = holeEinstellungen().koerper;
  zustand.seite = "vorne";
  zustand.auswahl = null;
  zustand.eingaben = {};
  zustand.statistik.angepasst = false;
  aktualisiereAlles();
  zeigeBereich("koerper", false);
})();

</script>
